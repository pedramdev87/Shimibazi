    });
    body += `<g class="at" style="animation-delay:0ms"><circle cx="${cx}" cy="${cy}" r="${Math.round(ar * 1.25)}" style="fill:var(--c-${center.cat})"/><text x="${cx}" y="${cy + 1}">${center.sym}</text></g>`;
    return svg + `<g class="bonds">${lines}</g>` + body + '</svg>';
  }

  /* ---------- نمایش‌ها ---------- */
  const builtCount = () => ALL.filter(c => S().compounds[c.key]).length;

  APP.microscopeSVG = function (cls) {
    return `<svg class="${cls || 'micro'}" viewBox="0 0 160 160" role="img" aria-label="میکروسکوپ" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="80" cy="147" rx="52" ry="8" fill="currentColor" opacity=".18"/>
      <path d="M38 142c0-9 8-14 20-14h44c12 0 20 5 20 14z" fill="currentColor" opacity=".9"/>
      <path d="M62 128c-26-6-34-34-22-56 8-14 24-20 38-12" stroke="currentColor" stroke-width="9"/>
      <g transform="rotate(-28 84 52)">
        <rect x="68" y="18" width="24" height="62" rx="6" fill="currentColor"/>
        <rect x="72" y="6" width="16" height="16" rx="4" fill="currentColor" opacity=".75"/>
        <rect x="74" y="80" width="12" height="14" rx="3" fill="currentColor" opacity=".75"/>
        <circle cx="80" cy="97" r="4.5" fill="var(--accent)"/>
      </g>
      <rect x="82" y="104" width="40" height="7" rx="3.5" fill="currentColor"/>
      <circle cx="118" cy="104" r="3" fill="var(--accent)"/>
      <circle class="spark" cx="108" cy="92" r="2.4" fill="var(--accent)"/>
      <circle class="spark s2" cx="124" cy="96" r="1.8" fill="var(--accent)"/>
    </svg>`;
  };

  APP.homeCompoundCard = function () {
    const n = builtCount();
    return `<button class="compound-card" data-go="#/compounds" aria-label="رفتن به بخش ترکیبات">
      ${APP.microscopeSVG()}
      <div class="grow">
        <h3>ترکیبات</h3>
        <p>اتم‌ها را زیر میکروسکوپ کنار هم بگذارید و ${fa(ALL.length)} ترکیب مدرسه‌ای مثل <span class="sym">H₂O</span> و <span class="sym">NaCl</span> بسازید.</p>
        <span class="badge">${fa(n)} از ${fa(ALL.length)} ساخته‌شده</span>
      </div>
      <span class="go-arrow" aria-hidden="true">‹</span>
    </button>`;
  };

  APP.views.compounds = function () {
    const cell = APP.cellSize({ auto: true, min: 17, max: 40 });
    const table = APP.tableHTML({ mode: 'build', cell });
    APP.afterRender = () => { renderTray(); renderCollection(); };
    return `
      <div class="stack">
        <div class="row">
          <button class="btn sm ghost" data-go="#/home">→ جدول</button>
          <h2 class="grow" style="font-size:20px;font-weight:800">🔬 ترکیبات</h2>
          <span class="badge" id="c-badge"></span>
        </div>
        <p class="small muted">روی عنصرها بزنید (در کامپیوتر می‌توانید بکشید و رها کنید) تا اتم‌ها به میکروسکوپ بیایند. برای ساختن <b>H₂</b> دو بار روی <span class="sym">H</span> بزنید؛ بعد یک‌بار روی <span class="sym">O</span> تا <b>H₂O</b> شود و دکمهٔ «ساخت» را بزنید.</p>
        <div class="pt-scroll" id="pt-scroll">${table}</div>

        <section class="card lab-card" aria-label="میکروسکوپ">
          <div class="lab-head">
            ${APP.microscopeSVG('micro sm')}
            <div class="formula-bar">
              <div class="formula" id="c-formula" aria-live="polite">—</div>
              <div class="small muted" id="c-count">هنوز اتمی انتخاب نشده</div>
            </div>
            <button class="btn accent build-btn" data-act="build-go" id="build-btn">ساخت ✨</button>
          </div>
          <div class="lens" id="lens" aria-label="صفحهٔ میکروسکوپ"><div class="lens-hint" id="lens-hint">اتم‌ها اینجا می‌آیند</div><div class="atoms" id="atoms"></div></div>
          <div class="row" style="justify-content:center">
            <button class="btn sm" data-act="build-undo">↶ برگردان</button>
            <button class="btn sm" data-act="build-clear">پاک‌کردن همه</button>
          </div>
          <div id="c-msg" class="c-msg" role="status"></div>
        </section>

        <section class="card" aria-label="کلکسیون ترکیب‌ها">
          <div class="section-title">کلکسیون من</div>
          <p class="small muted" style="margin-bottom:8px">اسم ترکیب‌ها را می‌بینید؛ فرمولشان را خودتان پیدا کنید! روی ترکیب قفل‌شده بزنید تا راهنمایی بگیرید.</p>
          <div id="collection"></div>
        </section>
      </div>`;
  };

  function renderTray() {
    const atoms = $('#atoms'); if (!atoms) return;
    const counts = countsOf();
    const n = tray.length;
    const size = n <= 12 ? 46 : n <= 24 ? 36 : 30;
    // گروه‌بندی اتم‌ها بر اساس عنصر
    const order = orderedSyms(counts);
    let h = '';
    order.forEach(s => {
      tray.forEach((z, i) => { if (E[z - 1].sym === s) h += `<button class="atom c-${E[z - 1].cat}" data-act="build-rm" data-i="${i}" style="--sz:${size}px;--d:${(i % 7) * -0.6}s" aria-label="حذف اتم ${E[z - 1].fa}">${s}</button>`; });
    });
    atoms.innerHTML = h;
    atoms.classList.toggle('many', n > 24);
    const hint = $('#lens-hint'); if (hint) hint.style.display = n ? 'none' : '';
    const f = $('#c-formula');
    if (f) f.innerHTML = n ? subHTML(formulaOf(counts)) : '—';
    const c = $('#c-count');
    if (c) c.textContent = n ? `${fa(n)} اتم · ${fa(Object.keys(counts).length)} نوع عنصر` : 'هنوز اتمی انتخاب نشده';
    const b = $('#build-btn'); if (b) b.disabled = !n;
    const bd = $('#c-badge'); if (bd) bd.textContent = `${fa(builtCount())} از ${fa(ALL.length)} ساخته شد`;
    syncTableCounts(counts);
  }
  function syncTableCounts(counts) {
    $$('#pt-scroll .el').forEach(b => {
      const s = b.querySelector('b').textContent;
      b.classList.toggle('picked', !!counts[s]);
      let t = b.querySelector('.cnt');
      if (counts[s]) {
        if (!t) { t = document.createElement('span'); t.className = 'cnt'; b.appendChild(t); }
        t.textContent = fa(counts[s]);
      } else if (t) t.remove();
    });
  }

  function renderCollection() {
    const box = $('#collection'); if (!box) return;
    let h = '';
    SECTIONS.forEach(s => {
      const items = ALL.filter(c => c.sec === s.id);
      const got = items.filter(c => S().compounds[c.key]).length;
      h += `<div class="coll-sec"><h4>${s.t} <span class="muted small">(${fa(got)}/${fa(items.length)})</span></h4><div class="coll-grid">`;
      items.forEach(c => {
        const ok = !!S().compounds[c.key];
        const shortName = c.n.split(' (')[0];
        h += ok
          ? `<button class="coll got" data-act="coll-open" data-k="${c.key}"><b class="sym">${subHTML(c.f)}</b><span>${shortName}</span></button>`
          : `<button class="coll lock" data-act="coll-hint" data-k="${c.key}"><b>🔒</b><span>${shortName}</span></button>`;
      });
      h += '</div></div>';
    });
    box.innerHTML = h;
  }

  /* ---------- کنش‌ها ---------- */
  function addAtom(z, fromEl) {
    if (tray.length >= MAX_ATOMS) { APP.toast('حداکثر ' + fa(MAX_ATOMS) + ' اتم می‌شود'); APP.fx.play('bad'); return; }
    tray.push(z);
    APP.fx.play('pop', z);
    clearMsg();
    renderTray();
    const items = $$('#atoms .atom');
    const mine = items.find(b => +b.dataset.i === tray.length - 1);
    if (mine) mine.classList.add('born');
    if (fromEl) { fromEl.classList.remove('bump'); void fromEl.offsetWidth; fromEl.classList.add('bump'); }
  }
  APP.acts['build-add'] = t => addAtom(+t.dataset.z, t);
  APP.acts['build-rm'] = t => {
    const i = +t.dataset.i;
    if (!(i >= 0 && i < tray.length)) return;
    tray.splice(i, 1); APP.fx.play('remove'); clearMsg(); renderTray();
  };
  APP.acts['build-undo'] = () => { if (tray.length) { tray.pop(); APP.fx.play('remove'); clearMsg(); renderTray(); } };
  APP.acts['build-clear'] = () => { if (tray.length) { tray = []; APP.fx.play('remove'); clearMsg(); renderTray(); } };
  function clearMsg() { const m = $('#c-msg'); if (m) { m.className = 'c-msg'; m.textContent = ''; } }
  function say(html, kind) { const m = $('#c-msg'); if (m) { m.className = 'c-msg show ' + (kind || ''); m.innerHTML = html; } }
  function shake() { const l = $('#lens'); if (!l) return; l.classList.remove('shake'); void l.offsetWidth; l.classList.add('shake'); }

  APP.acts['build-go'] = () => {
    if (!tray.length) { say('اول چند عنصر انتخاب کنید.', 'bad'); return; }
    const counts = countsOf();
    const c = MAP[keyOf(counts)];
    if (c) {
      const first = !S().compounds[c.key];
      if (first) { S().compounds[c.key] = Date.now(); APP.addXP(15); APP.touchStreak(); APP.save(); }
      APP.fx.play('build'); APP.fx.confetti();
      APP.openSheet(resultHTML(c, first));
      renderTray(); renderCollection();
      return;
    }
    APP.fx.play('bad'); shake();
    const syms = Object.keys(counts);
    if (tray.length === 1) { say('یک اتم تنها هنوز ترکیب نیست؛ اتم‌های بیشتری اضافه کنید.', 'bad'); return; }
    const same = ALL.filter(x => { const k = Object.keys(x.counts); return k.length === syms.length && k.every(s => syms.includes(s)); });
    if (same.length) say('با این عنصرها ترکیبی می‌شود ساخت، ولی <b>شمار اتم‌ها</b> درست نیست. شمارشان را کم یا زیاد کنید.', 'bad');
    else say('این ترکیب در فهرست برنامه نیست. یا اتم‌ها را عوض کنید یا از «کلکسیون من» یک ترکیب را برای راهنمایی انتخاب کنید.', 'bad');
  };

  function resultHTML(c, first) {
    const total = builtCount();
    const elems = Object.keys(c.counts).map(s => `${BY_SYM[s].fa} (${s}) × ${fa(c.counts[s])}`).join('، ');
    return `
      <div class="sheet-head"><h2>ترکیب ساخته شد</h2><button class="icon-btn" data-act="close-sheet" aria-label="بستن">✕</button></div>
      <div class="result-compound">
        ${first ? `<div class="made">🎉 شما <b>${c.n.split(' (')[0]}</b> را ساختید!</div>` : `<div class="made">این ترکیب را قبلاً ساخته بودید: <b>${c.n.split(' (')[0]}</b></div>`}
        <div class="big-formula sym">${subHTML(c.f)}</div>
        <div class="mol-wrap">${molSVG(c.counts)}</div>
        <div class="small muted center">${c.n}</div>
        <p class="center" style="margin:8px 0">${c.d}</p>
        <div class="fact wide"><span>از چه اتم‌هایی ساخته شده؟</span><b>${elems}</b></div>
        ${first ? `<p class="small center muted" style="margin-top:8px">+۱۵ امتیاز · ${fa(total)} از ${fa(ALL.length)} ترکیب ساخته شده</p>` : ''}
        <div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="build-again">ترکیب بعدی</button></div>
      </div>`;
  }
  APP.acts['build-again'] = () => { tray = []; APP.closeSheet(); renderTray(); const p = $('#pt-scroll'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  APP.acts['coll-open'] = t => { const c = MAP[t.dataset.k]; if (c) { APP.fx.play('open'); APP.openSheet(resultHTML(c, false)); } };
  APP.acts['coll-hint'] = t => {
    const c = MAP[t.dataset.k]; if (!c) return;
    const parts = Object.keys(c.counts).map(s => BY_SYM[s].fa);
    const total = Object.values(c.counts).reduce((a, b) => a + b, 0);
    say(`راهنما برای «${c.n.split(' (')[0]}»: از عنصرهای <b>${parts.join(' و ')}</b> ساخته می‌شود و جمعاً <b>${fa(total)} اتم</b> دارد.`, 'hint');
    APP.fx.play('tap');
    const m = $('#c-msg'); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  /* ---------- کشیدن و رها کردن (کامپیوتر) ---------- */
  document.addEventListener('dragstart', ev => {
    const b = ev.target.closest && ev.target.closest('.pt.build .el');
    if (!b) return;
    ev.dataTransfer.setData('text/plain', b.dataset.z);
    ev.dataTransfer.effectAllowed = 'copy';
  });
  document.addEventListener('dragover', ev => {
    const l = ev.target.closest && ev.target.closest('#lens');
    if (l) { ev.preventDefault(); l.classList.add('over'); }
  });
  document.addEventListener('dragleave', ev => {
    const l = ev.target.closest && ev.target.closest('#lens');
    if (l && !l.contains(ev.relatedTarget)) l.classList.remove('over');
  });
  document.addEventListener('drop', ev => {
    const l = ev.target.closest && ev.target.closest('#lens');
    if (!l) return;
    ev.preventDefault(); l.classList.remove('over');
    const z = +ev.dataTransfer.getData('text/plain');
    if (z >= 1 && z <= 118) addAtom(z);
  });

  APP.resetTray = () => { tray = []; };
})();

/* ===== onboard.js ===== */
/* اسلایدهای معرفی برای کاربر تازه‌وارد */
(function () {
  'use strict';
  const { u } = APP;
  const { $, $$, fa } = u;
  const S = () => APP.S();

  const miniTable = () => {
    const cell = Math.max(9, Math.min(15, Math.floor((Math.min(window.innerWidth, 560) - 40 - 12 - 22 - 54) / 18)));
    return APP.tableHTML({ mode: 'static', cell });
  };

  const SLIDES = [
    { c: '#134e6f,#2b8a9e', art: () => `<div class="onb-atom">${APP.atomSVG(6)}</div>`,
      t: 'به جدول مندلیف خوش آمدید', p: 'یادگیری ۱۱۸ عنصر جدول تناوبی، قدم‌به‌قدم و با بازی؛ مناسب برای پایه‌های هشتم تا دوازدهم.' },
    { c: '#0b6e4f,#5fbf7a', art: () => `<div class="onb-table">${miniTable()}</div>`,
      t: 'جدول تعاملی', p: 'روی هر عنصر بزنید تا مدل اتم، عدد اتمی، جرم، گروه، دوره و آرایش الکترونی‌اش را ببینید. با جست‌وجو و فیلتر دسته‌ها هر عنصر را سریع پیدا کنید.' },
    { c: '#7a3e9d,#c77dff', art: () => '<div class="onb-emoji">📖</div>',
      t: 'درس‌های کوتاه و روشن', p: 'از اتم و عدد اتمی تا ایزوتوپ، آرایش الکترونی و روندهای جدول؛ ۱۲ درس کوتاه که هر کدام یک تمرین دارد.' },
    { c: '#c2410c,#ffa94d', art: () => '<div class="onb-emoji">🎯</div>',
      t: 'آزمون‌های هوشمند', p: 'اول خودتان مشخص می‌کنید کدام قسمت جدول را بلدید (مثلاً ردیف اول)، بعد فقط از همان قسمت سؤال می‌پرسد: چهارگزینه‌ای، نوشتنی، جای‌یابی روی جدول و کارت حفظی.' },
    { c: '#1d4ed8,#4dabf7', art: () => '<div class="onb-emoji">📊</div>',
      t: 'پیشرفت شما', p: 'نقشهٔ رنگی جدول نشان می‌دهد کدام عنصرها را کامل بلدید و کدام‌ها هنوز به مرور نیاز دارند. هر چه بیشتر تمرین کنید خانه‌ها سبزتر می‌شوند.' },
    { c: '#be185d,#f783ac', art: () => APP.microscopeSVG('micro onb-micro'),
      t: 'ساختن ترکیبات', p: 'اتم‌ها را زیر میکروسکوپ کنار هم بگذارید و ترکیب‌هایی مثل H₂O، CO₂ و NaCl را بسازید؛ هر ترکیب تازه امتیاز دارد.' },
    { c: '#134e6f,#0f1822', last: true, art: () => `<div class="onb-atom">${APP.atomSVG(26)}</div>`,
      t: 'آمادهٔ شروع هستید؟', p: 'هر وقت خواستید این راهنما را از «تنظیمات» دوباره ببینید.', credit: 'ساخته شده توسط امیر محمد پدرام' }
  ];

  let idx = 0, dir = 1;

  function html() {
    const s = SLIDES[idx];
    const dots = SLIDES.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('');
    return `
      <div class="onb-top"><span class="small">${fa(idx + 1)} از ${fa(SLIDES.length)}</span>${s.last ? '<span></span>' : '<button class="onb-skip" data-act="onb-skip">رد کردن</button>'}</div>
      <div class="onb-slide ${dir > 0 ? 'from-left' : 'from-right'}" key="${idx}">
        <div class="onb-art">${s.art()}</div>
        <h2>${s.t}</h2>
        <p>${s.p}</p>
        ${s.credit ? `<div class="onb-credit">${s.credit}</div>` : ''}
      </div>
      <div class="onb-dots" aria-hidden="true">${dots}</div>
      <div class="onb-actions">
        ${idx > 0 ? '<button class="btn onb-btn ghost" data-act="onb-prev">قبلی</button>' : '<span></span>'}
        ${s.last ? '<button class="btn onb-btn solid" data-act="onb-done">شروع یادگیری 🚀</button>' : '<button class="btn onb-btn solid" data-act="onb-next">بعدی</button>'}
      </div>`;
  }
  function paint() {
    const ov = $('#onb'); if (!ov) return;
    const s = SLIDES[idx];
    ov.style.setProperty('--g1', s.c.split(',')[0]);
    ov.style.setProperty('--g2', s.c.split(',')[1]);
    ov.innerHTML = html();
  }
  function go(n) {
    if (n < 0 || n >= SLIDES.length) return;
    dir = n > idx ? 1 : -1; idx = n; paint();
  }
  APP.showOnboarding = function () {
    idx = 0; dir = 1;
    const ov = document.createElement('div');
    ov.id = 'onb'; ov.className = 'onb';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'راهنمای برنامه');
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    paint();
    let x0 = null;
    ov.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    ov.addEventListener('touchend', e => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) < 50) return;
      // در صفحهٔ راست‌به‌چپ، کشیدن به چپ یعنی اسلاید بعدی
      if (dx < 0) { APP.fx.play('next'); go(idx + 1); } else if (idx > 0) { APP.fx.play('next'); go(idx - 1); }
    }, { passive: true });
    document.addEventListener('keydown', onKey);
  };
  function onKey(e) {
    if (!$('#onb')) { document.removeEventListener('keydown', onKey); return; }
    if (e.key === 'ArrowLeft') { APP.fx.play('next'); go(idx + 1); }
    else if (e.key === 'ArrowRight') { APP.fx.play('next'); go(idx - 1); }
    else if (e.key === 'Escape') APP.acts['onb-skip']();
  }
  function close() {
    const ov = $('#onb'); if (ov) ov.remove();
    document.body.style.overflow = '';
    S().onboarded = true; APP.save();
  }
  APP.acts['onb-next'] = () => { APP.fx.play('next'); go(idx + 1); };
  APP.acts['onb-prev'] = () => { APP.fx.play('next'); go(idx - 1); };
  APP.acts['onb-skip'] = () => { close(); };
  APP.acts['onb-done'] = () => { APP.fx.play('win'); APP.fx.confetti({ n: 60 }); close(); };
  APP.acts['show-guide'] = () => { APP.closeSheet(); APP.showOnboarding(); };
})();

/* ===== main.js ===== */
window.addEventListener('DOMContentLoaded', function () { APP.start(); });

</script>
</body>
</html>

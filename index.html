(function () {
  'use strict';
  const { E, CATS, u } = APP;
  const { $, $$, fa, shuffle, normFa } = u;
  const S = () => APP.S();

  /* ============ خانه ============ */
  const home = { cat: null, q: '' };

  APP.views.home = function () {
    const s = S();
    const T = APP.isTeacher();
    const cell = APP.cellSize();
    const table = APP.tableHTML({
      mode: 'home', cell, showName: s.showName, showMass: s.showMass, overlay: s.overlay && !T,
      cls: e => (e.z > s.scope ? 'out' : '')
    });
    const catChips = Object.keys(CATS).map(k =>
      `<button class="chip" data-act="home-cat" data-v="${k}" aria-pressed="${home.cat === k}"><span class="dot c-${k}"></span>${CATS[k].short}</button>`).join('');
    const hint = (cell < 40 && s.showMass) || (cell < 44 && s.showName)
      ? '<p class="small muted center">برای دیدن نام و جرم عنصرها روی «+» بزنید تا جدول بزرگ‌تر شود.</p>'
      : '<p class="small muted center">روی هر عنصر بزنید تا جزئیاتش را ببینید.</p>';
    APP.afterRender = applyFilter;
    return `
      <div class="stack">
        <div class="home-tools">
          <div class="search"><input id="search" type="search" placeholder="جست‌وجو: نام، نماد یا عدد اتمی…" value="${home.q.replace(/"/g, '&quot;')}" aria-label="جست‌وجوی عنصر" autocomplete="off"></div>
          <div class="chips">
            <button class="chip" data-act="home-tog" data-k="showName" aria-pressed="${s.showName}">نام</button>
            <button class="chip" data-act="home-tog" data-k="showMass" aria-pressed="${s.showMass}">جرم</button>
            ${T ? '' : `<button class="chip" data-act="home-tog" data-k="overlay" aria-pressed="${s.overlay}">پیشرفت</button>`}
            <button class="chip" data-act="home-zoom" data-v="-4" aria-label="کوچک‌تر" style="min-width:44px;justify-content:center;font-size:18px">−</button>
            <button class="chip" data-act="home-zoom" data-v="4" aria-label="بزرگ‌تر" style="min-width:44px;justify-content:center;font-size:18px">+</button>
            <button class="chip" data-act="home-fit" aria-label="متناسب با صفحه" style="min-width:44px;justify-content:center;font-size:16px">⤢</button>
          </div>
          <div class="chips">${catChips}</div>
        </div>

        <div class="pt-scroll" id="pt-scroll">${table}</div>
        ${hint}
        ${APP.homeCompoundCard()}
        ${APP.homeLabCard ? APP.homeLabCard() : ''}
      </div>`;
  };

  function matchQ(e, q) {
    const x = q.trim().toLowerCase();
    if (!x) return true;
    if (/^[0-9۰-۹]+$/.test(x)) return e.z === +normFa(x);
    return e.sym.toLowerCase() === x || e.sym.toLowerCase().startsWith(x) || e.en.toLowerCase().includes(x) || normFa(e.fa).includes(normFa(x));
  }
  function applyFilter() {
    const q = home.q, cat = home.cat;
    const anyF = !!(q.trim() || cat);
    $$('#pt-scroll .el').forEach(b => {
      const e = E[+b.dataset.z - 1];
      const okCat = !cat || e.cat === cat;
      const okQ = !q.trim() || matchQ(e, q);
      const on = okCat && okQ;
      b.classList.toggle('dim', anyF && !on);
      b.classList.toggle('hit', !!q.trim() && on);
    });
    $$('#pt-scroll .ph').forEach(p => p.classList.toggle('dim', anyF));
  }
  document.addEventListener('input', ev => {
    if (ev.target.id === 'search') { home.q = ev.target.value; applyFilter(); }
  });
  APP.acts['home-cat'] = t => { home.cat = home.cat === t.dataset.v ? null : t.dataset.v; APP.render(); };
  APP.acts['home-tog'] = t => {
    const k = t.dataset.k, s = S();
    s[k] = !s[k];
    // اگر خانه‌ها برای نمایش جرم یا نام کوچک‌اند، جدول خودکار بزرگ می‌شود
    const need = k === 'showMass' ? 48 : k === 'showName' ? 46 : 0;
    if (s[k] && need && APP.cellSize() < need) {
      s.cell = need;
      APP.toast(k === 'showMass' ? 'جدول بزرگ شد تا جرم اتمی دیده شود (برگشت: ⤢)' : 'جدول بزرگ شد تا نام عنصرها دیده شود (برگشت: ⤢)');
    }
    APP.save(); APP.render();
  };
  APP.acts['home-zoom'] = t => {
    const s = S(); const cur = APP.cellSize();
    const up = +t.dataset.v > 0;
    s.cell = u.clamp(up ? Math.max(cur + 3, Math.round(cur * 1.25)) : Math.round(cur / 1.25), 14, 90); APP.save(); APP.render();
  };
  APP.acts['home-fit'] = () => { S().cell = null; APP.save(); APP.render(); };

  /* ============ آموزش ============ */
  APP.views.learn = function () {
    const done = Object.keys(S().lessons).length;
    const cards = LESSONS.map(l => {
      const d = S().lessons[l.id];
      return `<button class="lesson-card" data-go="#/lesson/${l.id}">
        <div class="ico" aria-hidden="true">${l.icon}</div>
        <div class="grow">
          <h3>${l.title}</h3>
          <div class="small muted"><span class="badge">پایهٔ ${l.grade}</span> ${d ? `<span class="done">✓ انجام شد (${fa(d.score)}٪)</span>` : ''}</div>
        </div>
      </button>`;
    }).join('');
    return `
      <div class="stack">
        <div class="card">
          <div class="section-title">مسیر یادگیری</div>
          <p class="small muted">از اتم و عدد اتمی شروع کنید و تا روندهای جدول بروید. هر درس یک تمرین کوتاه دارد. <b>${fa(done)} از ${fa(LESSONS.length)}</b> درس را کامل کرده‌اید.</p>
          <div class="bar" style="margin-top:10px"><i style="width:${Math.round(done / LESSONS.length * 100)}%"></i></div>
        </div>
        <div class="lesson-list">${cards}</div>
      </div>`;
  };

  function hlPredicate(spec) {
    const [k, v] = spec.split(':');
    switch (k) {
      case 'group': return e => e.group === +v;
      case 'period': return e => e.row === +v;
      case 'cat': return e => e.cat === v;
      case 'block': return e => e.block === v;
      case 'z': { const [a, b] = v.split('-').map(Number); return e => e.z >= a && e.z <= b; }
      case 'metal': return e => ['alkali', 'alkaline', 'transition', 'post', 'lanthanide', 'actinide'].includes(e.cat);
      case 'nonmetal': return e => ['nonmetal', 'halogen', 'noble'].includes(e.cat);
      case 'state': return e => e.state === v;
      default: return () => true;
    }
  }
  APP.hlPredicate = hlPredicate;
  function vizHTML(v) {
    if (v.t === 'atom') {
      const e = E[v.z - 1];
      return `<div class="viz card">${APP.atomSVG(v.z)}<p class="center small muted">مدل لایه‌ای اتم ${e.fa} (<span class="sym">${e.sym}</span>): ${e.shells.map(fa).join('، ')}</p></div>`;
    }
    const p = hlPredicate(v.hl);
    const cell = Math.min(28, Math.max(18, Math.floor((Math.min(window.innerWidth, 720) - 100) / 19)));
    return `<div class="viz pt-scroll">${APP.tableHTML({ mode: 'static', cell, cls: e => (e.ph ? 'dim' : (p(e) ? '' : 'dim')) })}</div>`;
  }

  let LQ = null; // وضعیت تمرین درس جاری

  APP.views.lesson = function (r) {
    const l = LESSONS.find(x => x.id === r.id);
    if (!l) return APP.views.learn();
    LQ = { id: l.id, answered: 0, right: 0, total: l.quiz.length, qs: l.quiz.map(q => ({ q: q.q, opts: shuffle(q.o.map((t, i) => ({ t, ok: i === q.a }))), done: false })) };
    const idx = LESSONS.indexOf(l);
    const nxt = LESSONS[idx + 1];
    const secs = l.sections.map(s => `
      <section class="sec"><h3>${s.h}</h3>${s.p.map(x => `<p>${x}</p>`).join('')}${s.viz ? vizHTML(s.viz) : ''}</section>`).join('');
    const quiz = LQ.qs.map((q, qi) => `
      <div class="mini-q" data-qi="${qi}"><h4>${fa(qi + 1)}. ${q.q}</h4>
        <div class="opts">${q.opts.map((o, oi) => `<button class="opt" data-act="lq" data-qi="${qi}" data-oi="${oi}">${o.t}</button>`).join('')}</div>
      </div>`).join('');
    return `
      <article class="lesson stack">
        <div class="row"><button class="btn sm ghost" data-go="#/learn">→ همهٔ درس‌ها</button><span class="badge">پایهٔ ${l.grade}</span></div>
        <div><h2>${l.icon} ${l.title}</h2><p class="lead">${l.intro}</p></div>
        ${secs}
        <div class="card"><div class="section-title">تمرین کوتاه</div>${quiz}<div id="lq-result"></div></div>
        <div class="row">
          ${nxt ? `<button class="btn primary grow" data-go="#/lesson/${nxt.id}">درس بعد: ${nxt.title}</button>` : '<button class="btn primary grow" data-go="#/quiz">برو به آزمون‌ها 🎯</button>'}
        </div>
      </article>`;
  };
  APP.acts.lq = t => {
    if (!LQ) return;
    const qi = +t.dataset.qi, oi = +t.dataset.oi;
    const q = LQ.qs[qi]; if (q.done) return;
    q.done = true; LQ.answered++;
    const ok = q.opts[oi].ok; if (ok) LQ.right++;
    APP.fx.play(ok ? 'good' : 'bad');
    const wrap = t.closest('.mini-q');
    $$('.opt', wrap).forEach((b, i) => {
      b.disabled = true;
      if (q.opts[i].ok) b.classList.add('good');
    });
    if (!ok) t.classList.add('bad');
    if (LQ.answered === LQ.total) {
      const score = Math.round(LQ.right / LQ.total * 100);
      const s = S(); const first = !s.lessons[LQ.id];
      const prev = s.lessons[LQ.id];
      s.lessons[LQ.id] = { score: prev ? Math.max(prev.score, score) : score };
      if (first) APP.addXP(20);
      APP.touchStreak(); APP.save();
      if (score === 100) { APP.fx.play('win'); APP.fx.confetti(); }
      $('#lq-result').innerHTML = `<div class="feedback ${score >= 67 ? 'good' : 'bad'}">${score === 100 ? '🎉 عالی بود! همهٔ پاسخ‌ها درست بود.' : score >= 67 ? '👍 خوب بود! نتیجه: ' + fa(LQ.right) + ' از ' + fa(LQ.total) : 'نتیجه: ' + fa(LQ.right) + ' از ' + fa(LQ.total) + '. یک بار دیگر متن درس را بخوانید و دوباره امتحان کنید.'}
        <span class="more">${first ? '۲۰ امتیاز گرفتید.' : ''}</span>
        <div style="margin-top:8px"><button class="btn sm" data-act="lq-retry">تلاش دوباره</button></div></div>`;
    }
  };
  APP.acts['lq-retry'] = () => { const id = LQ && LQ.id; APP.render(); void id; };

  /* ============ پیشرفت ============ */
  function pct(list) {
    if (!list.length) return 0;
    return Math.round(list.reduce((a, e) => a + APP.box(e.z), 0) / (5 * list.length) * 100);
  }
  function barRows(items) {
    return items.map(([label, list]) => {
      const p = pct(list);
      return `<div class="bar-row"><span>${label}</span><div class="bar"><i style="width:${p}%"></i></div><span>${fa(p)}٪</span></div>`;
    }).join('');
  }
  APP.weakest = function (n, limitToScope) {
    const s = S();
    const list = E.filter(e => !limitToScope || e.z <= s.scope);
    const score = e => {
      const m = s.mastery[e.z];
      if (!m) return 2.5; // هنوز دیده نشده: متوسط
      return APP.box(e.z) - Math.min(2, m.wrong * 0.4);
    };
    return list.map(e => ({ e, w: score(e) + Math.random() * 0.8 })).sort((a, b) => a.w - b.w).slice(0, n).map(x => x.e);
  };

  APP.views.progress = function () {
    const s = S();
    const inScope = E.filter(e => e.z <= s.scope);
    const mastered = inScope.filter(e => APP.box(e.z) >= 4).length;
    const learning = inScope.filter(e => APP.box(e.z) >= 1 && APP.box(e.z) < 4).length;
    const acc = s.stats.answered ? Math.round(s.stats.correct / s.stats.answered * 100) : 0;
    const table = APP.tableHTML({ mode: 'heat', cell: APP.cellSize({ auto: true, min: 14, max: 46 }), overlay: false, cls: e => (e.z > s.scope ? 'out' : '') });
    const groups = []; for (let g = 1; g <= 18; g++) groups.push([`گروه ${fa(g)}`, E.filter(e => e.group === g)]);
    const periods = []; for (let p = 1; p <= 7; p++) periods.push([`دورهٔ ${fa(p)}`, E.filter(e => e.row === p)]);
    periods.push(['لانتانیدها', E.filter(e => e.cat === 'lanthanide')], ['اکتینیدها', E.filter(e => e.cat === 'actinide')]);
    const weak = inScope.filter(e => s.mastery[e.z] && s.mastery[e.z].wrong > 0)
      .sort((a, b) => (APP.box(a.z) - APP.box(b.z)) || (s.mastery[b.z].wrong - s.mastery[a.z].wrong)).slice(0, 6);
    const lessonsDone = Object.keys(s.lessons).length;
    const last = s.sessions.slice(-5).reverse();
    return `
      <div class="stack">
        <div class="stat-grid">
          <div class="stat"><b>${fa(mastered)}<small class="muted" style="font-size:14px"> از ${fa(inScope.length)}</small></b><span>عنصر مسلط‌شده</span></div>
          <div class="stat"><b>${fa(learning)}</b><span>در حال یادگیری</span></div>
          <div class="stat"><b>${fa(acc)}٪</b><span>دقت پاسخ‌ها</span></div>
          <div class="stat"><b>${fa(s.xp)}</b><span>امتیاز ⭐ ${APP.streakNow() ? '· 🔥' + fa(APP.streakNow()) + ' روز' : ''}</span></div>
        </div>

        <div class="card stack" style="gap:10px" id="report-card">
          <div class="section-title" style="margin:0">📤 پیشرفت برای استاد</div>
          <p class="small muted">اگر استاد دارید، با دکمهٔ زیر یک متن رمزگذاری‌شده بسازید و برایش بفرستید (تلگرام، واتساپ، ایتا و …). فقط «پنل استاد» می‌تواند آن را بخواند و پیشرفت شما را نشان دهد.</p>
          <button class="btn primary block" data-act="report-make">ساخت متن برای استاد</button>
          <div id="report-out"></div>
        </div>

        <div class="card stack" style="gap:10px">
          <div class="section-title" style="margin:0">نقشهٔ یادگیری شما</div>
          <div class="mastery-legend">
            <span style="--c:var(--m0)">هنوز تمرین نشده</span><span style="--c:var(--m1)">شروع یادگیری</span>
            <span style="--c:var(--m2)">در حال یادگیری</span><span style="--c:var(--m3)">نزدیک به تسلط</span>
            <span style="--c:var(--m4)">مسلط</span><span style="--c:var(--m5)">کاملاً مسلط</span>
          </div>
          <div class="pt-scroll">${table}</div>
          <p class="small muted">هر چه پاسخ درست بدهید خانه سبزتر می‌شود؛ پاسخ اشتباه آن را یک‌ــدو پله پایین می‌آورد. روی هر خانه بزنید تا جزئیاتش را ببینید.</p>
        </div>

        ${weak.length ? `<div class="card"><div class="section-title">عنصرهایی که بیشتر به مرور نیاز دارند</div>
          <div class="chips wrap">${weak.map(e => `<button class="chip" data-act="detail-open" data-z="${e.z}"><span class="dot c-${e.cat}"></span>${e.fa} <span class="sym">${e.sym}</span></button>`).join('')}</div>
          <button class="btn primary block" style="margin-top:12px" data-act="practice-weak">تمرین همین عنصرها</button></div>` : ''}

        <div class="grid-2">
          <div class="card"><div class="section-title">پیشرفت در هر گروه</div><div class="bars">${barRows(groups)}</div></div>
          <div class="card stack" style="gap:14px">
            <div><div class="section-title">پیشرفت در هر دوره</div><div class="bars">${barRows(periods)}</div></div>
            <div><div class="section-title">درس‌ها</div>
              <p class="small muted">${fa(lessonsDone)} از ${fa(LESSONS.length)} درس انجام شده است.</p>
              <div class="bar" style="margin-top:6px"><i style="width:${Math.round(lessonsDone / LESSONS.length * 100)}%"></i></div></div>
          </div>
        </div>

        ${last.length ? `<div class="card"><div class="section-title">آخرین آزمون‌ها</div>
          <div class="bars">${last.map(x => `<div class="bar-row" style="grid-template-columns:1fr auto"><span>${x.mode} — ${fa(x.right)} از ${fa(x.total)}</span><span class="muted">${fa(Math.round(x.right / Math.max(1, x.total) * 100))}٪</span></div>`).join('')}</div></div>` : ''}
      </div>`;
  };
  APP.acts['detail-open'] = t => APP.openSheet(APP.detailHTML(+t.dataset.z));
})();

/* ============ گزارش برای استاد ============ */
(function () {
  'use strict';
  const { E, u } = APP;
  const { $, fa } = u;
  const S = () => APP.S();

  APP.buildReport = function () {
    const s = S();
    const m = E.map(e => APP.box(e.z)).join('');
    const c = [];
    E.forEach(e => { const x = s.mastery[e.z]; if (x) c.push([e.z, x.right, x.wrong]); });
    const l = LESSONS.map((L, i) => (s.lessons[L.id] ? [i, s.lessons[L.id].score] : null)).filter(Boolean);
    const k = APP.compounds.ALL.map((cc, i) => (s.compounds[cc.key] ? i : -1)).filter(i => i >= 0);
    return {
      v: 1, n: s.name, t: Date.now(), x: s.xp, y: APP.streakNow(),
      a: [s.stats.answered, s.stats.correct], m, c, l, k,
      rx: Object.keys(s.rxn || {}).length, rb: (s.rxStats && s.rxStats.bal) || 0,
      q: s.sessions.slice(-8).map(z => [z.mode, z.right, z.total, z.t])
    };
  };
  APP.acts['report-make'] = () => {
    const token = APP.secure.seal(APP.buildReport(), 'SB1');
    const text = 'گزارش پیشرفت «شیمی بازی» 🧪\n(این متن را بدون تغییر برای استاد بفرستید)\n' + token;
    const out = $('#report-out'); if (!out) return;
    out.innerHTML = `
      <textarea id="report-text" class="selectable report-text" readonly rows="6" dir="ltr" aria-label="متن گزارش">${text}</textarea>
      <div class="row">
        <button class="btn accent grow" data-act="report-copy">📋 کپی متن</button>
        ${navigator.share ? '<button class="btn grow" data-act="report-share">📤 اشتراک‌گذاری</button>' : ''}
      </div>
      <p class="small muted">ساخته‌شده در ${new Date().toLocaleString('fa-IR')} — هر بار که پیشرفت کردید، متن تازه بسازید.</p>`;
    APP.fx.play('good');
  };
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((res, rej) => {
      const ta = $('#report-text') || document.createElement('textarea');
      ta.removeAttribute('readonly'); ta.select(); ta.setSelectionRange(0, 999999);
      try { document.execCommand('copy') ? res() : rej(); } catch (e) { rej(e); }
      ta.setAttribute('readonly', '');
    });
  }
  APP.copyText = copyText;
  APP.acts['report-copy'] = () => {
    const ta = $('#report-text'); if (!ta) return;
    copyText(ta.value).then(() => { APP.fx.play('build'); APP.toast('متن کپی شد؛ برای استاد بفرستید'); })
      .catch(() => { ta.focus(); ta.select(); APP.toast('متن انتخاب شد؛ آن را کپی کنید'); });
  };
  APP.acts['report-share'] = () => {
    const ta = $('#report-text'); if (!ta) return;
    navigator.share({ text: ta.value }).catch(() => { /* لغو شد */ });
  };
})();

/* ===== quiz.js ===== */
/* بخش آزمون: انتخاب محدوده، چهار نوع تمرین، نتیجه */
(function () {
  'use strict';
  const { E, CATS, u } = APP;
  const { $, $$, fa, shuffle, rand, normFa, matchesName } = u;
  const S = () => APP.S();

  const MODES = {
    mc:    { ic: '🔘', t: 'چهارگزینه‌ای', d: 'از بین چهار گزینه درست را انتخاب کنید.' },
    type:  { ic: '⌨️', t: 'نوشتنی', d: 'پاسخ را خودتان بنویسید؛ بهترین روش برای حفظ.' },
    place: { ic: '🧩', t: 'جای عنصر در جدول', d: 'روی جدول خالی، خانهٔ درست عنصر را پیدا کنید.' },
    flash: { ic: '🃏', t: 'کارت حفظی', d: 'عنصرهای سخت‌تر بیشتر تکرار می‌شوند.' }
  };
  const KIND_GROUPS = {
    names:    { t: 'نام و نماد', kinds: ['sym2fa', 'fa2sym'] },
    numbers:  { t: 'عدد اتمی', kinds: ['num2fa', 'fa2num'] },
    position: { t: 'گروه و دوره', kinds: ['group', 'period'] },
    props:    { t: 'دسته و الکترون ظرفیت', kinds: ['cat', 'valence'] }
  };

  /* ---------- انتخاب محدوده ---------- */
  function initSel() {
    if (!APP.quizSel) APP.quizSel = new Set(E.filter(e => e.z <= S().scope).map(e => e.z));
    return APP.quizSel;
  }
  function syncSel() {
    const sel = initSel();
    $$('#view .pt.select .el').forEach(b => b.classList.toggle('sel', sel.has(+b.dataset.z)));
    const c = $('#sel-count'); if (c) c.textContent = fa(sel.size);
    const go = $('#start-btn'); if (go) go.disabled = sel.size === 0;
  }
  function toggleSet(zs) {
    const sel = initSel();
    const all = zs.every(z => sel.has(z));
    zs.forEach(z => (all ? sel.delete(z) : sel.add(z)));
    syncSel();
  }
  function setSel(zs) { APP.quizSel = new Set(zs); syncSel(); }

  APP.acts['sel-cell'] = t => toggleSet([+t.dataset.z]);
  APP.acts['sel-group'] = t => toggleSet(E.filter(e => e.group === +t.dataset.v).map(e => e.z));
  APP.acts['sel-period'] = t => toggleSet(E.filter(e => e.row === +t.dataset.v).map(e => e.z));
  APP.acts['sel-f'] = t => toggleSet(E.filter(e => e.cat === (t.dataset.v === 'lan' ? 'lanthanide' : 'actinide')).map(e => e.z));
  APP.acts['sel-cat'] = t => toggleSet(E.filter(e => e.cat === t.dataset.v).map(e => e.z));
  APP.acts['sel-preset'] = t => {
    const v = t.dataset.v;
    if (v === 'none') setSel([]);
    else if (v === 'all') setSel(E.map(e => e.z));
    else if (v === '20') setSel(E.filter(e => e.z <= 20).map(e => e.z));
    else if (v === '36') setSel(E.filter(e => e.z <= 36).map(e => e.z));
    else if (v === 'weak') setSel(APP.weakest(20, true).map(e => e.z));
    else if (v === 'new') setSel(E.filter(e => e.z <= S().scope && !S().mastery[e.z]).map(e => e.z));
  };
  APP.acts['q-mode'] = t => { S().quizPrefs.mode = t.dataset.v; APP.save(); APP.render(); };
  APP.acts['q-kind'] = t => {
    const k = t.dataset.v, arr = S().quizPrefs.kinds, i = arr.indexOf(k);
    if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); } else arr.push(k);
    APP.save(); t.setAttribute('aria-pressed', arr.includes(k));
  };
  APP.acts['q-count'] = t => {
    const v = t.dataset.v;
    const p = S().quizPrefs;
    if (v === 'timed') { p.timed = true; } else { p.timed = false; p.count = +v; }
    APP.save(); APP.render();
  };


  // کارت انتخاب بخشی از جدول (برای آزمون، کوییز زنده و برگهٔ تمرین)
  APP.selectorHTML = function (num, title) {
    initSel();
    const T = APP.isTeacher();
    const cell = APP.cellSize({ auto: true, min: 14, max: 40 });
    const table = APP.tableHTML({ mode: 'select', labels: 'select', cell, cls: e => (e.ph ? '' : (APP.quizSel.has(e.z) ? 'sel' : '')) });
    const catChips = Object.keys(CATS).map(k => `<button class="chip" data-act="sel-cat" data-v="${k}"><span class="dot c-${k}"></span>${CATS[k].short}</button>`).join('');
    return `<div class="setup-step card">
          <h3>${num ? `<span class="num-dot">${num}</span> ` : ''}${title}</h3>
          <p class="small muted" style="margin-bottom:8px">روی خانه‌ها بزنید یا روی شمارهٔ گروه (بالا) و دوره (کنار) بزنید تا کل آن ستون یا ردیف انتخاب شود. <span class="sel-count" id="sel-count">${fa(APP.quizSel.size)}</span> عنصر انتخاب شده است.</p>
          <div class="chips" style="margin-bottom:8px">
            <button class="chip" data-act="sel-preset" data-v="20">۲۰ عنصر اول</button>
            <button class="chip" data-act="sel-preset" data-v="36">۳۶ عنصر اول</button>
            <button class="chip" data-act="sel-preset" data-v="all">همه</button>
            ${T ? '' : `<button class="chip" data-act="sel-preset" data-v="weak">ضعیف‌ترین‌ها</button>
            <button class="chip" data-act="sel-preset" data-v="new">تمرین‌نشده‌ها</button>`}
            <button class="chip" data-act="sel-preset" data-v="none">پاک‌کردن</button>
          </div>
          <div class="chips" style="margin-bottom:8px">${catChips}</div>
          <div class="pt-scroll">${table}</div>
        </div>`;
  };

  APP.views.quiz = function () {
    const p = S().quizPrefs;
    initSel();
    const modes = Object.keys(MODES).map(k => `<button class="mode" data-act="q-mode" data-v="${k}" aria-pressed="${p.mode === k}"><span class="mi">${MODES[k].ic}</span><b>${MODES[k].t}</b><span>${MODES[k].d}</span></button>`).join('');
    const showKinds = p.mode === 'mc' || p.mode === 'type';
    const kinds = Object.keys(KIND_GROUPS).filter(k => p.mode === 'mc' || KIND_GROUPS[k].kinds.some(x => KINDS[x].typeable))
      .map(k => `<button class="chip" data-act="q-kind" data-v="${k}" aria-pressed="${p.kinds.includes(k)}">${KIND_GROUPS[k].t}</button>`).join('');
    const counts = [[10, '۱۰ سؤال'], [20, '۲۰ سؤال'], [30, '۳۰ سؤال']].map(([n, t]) => `<button class="chip" data-act="q-count" data-v="${n}" aria-pressed="${!p.timed && p.count === n}">${t}</button>`).join('')
      + `<button class="chip" data-act="q-count" data-v="timed" aria-pressed="${p.timed}">⏱ زمان‌دار (۶۰ ثانیه)</button>`;
    return `
      <div class="stack">
        ${APP.selectorHTML('۱', 'کدام قسمت جدول را می‌خواهید تمرین کنید؟')}

        <div class="setup-step card">
          <h3><span class="num-dot">۲</span> نوع تمرین</h3>
          <div class="mode-grid">${modes}</div>
        </div>

        <div class="setup-step card stack" style="gap:12px">
          <h3 style="margin:0"><span class="num-dot">۳</span> تنظیم سؤال‌ها</h3>
          ${showKinds ? `<div><div class="small muted" style="margin-bottom:6px">چه نوع سؤالی بیاید؟</div><div class="chips wrap">${kinds}</div></div>` : ''}
          <div><div class="small muted" style="margin-bottom:6px">تعداد</div><div class="chips wrap">${counts}</div></div>
        </div>

        <button class="btn primary block" id="start-btn" data-act="q-start" style="min-height:52px;font-size:18px" ${APP.quizSel.size ? '' : 'disabled'}>شروع تمرین</button>
      </div>`;
  };

  /* ---------- سؤال‌ها ---------- */
  const lat = s => `<span class="latin">${s}</span>`;
  function pickNames(e, field, n) {
    const same = shuffle(E.filter(x => x.z !== e.z && x.cat === e.cat));
    const other = shuffle(E.filter(x => x.z !== e.z && x.cat !== e.cat));
    const out = [];
    for (const x of same.slice(0, 2).concat(other)) { if (out.length >= n) break; if (!out.some(y => y[field] === x[field])) out.push(x); }
    return out;
  }
  function nearNums(z, lo, hi, n, spread) {
    const set = new Set();
    let guard = 0;
    while (set.size < n && guard++ < 200) {
      const d = (1 + rand(spread)) * (Math.random() < .5 ? -1 : 1);
      const v = z + d;
      if (v >= lo && v <= hi && v !== z) set.add(v);
    }
    for (let v = lo; set.size < n && v <= hi; v++) if (v !== z) set.add(v);
    return [...set];
  }
  const where = e => `${e.fa} (${e.sym}) — عدد اتمی ${fa(e.z)}${e.group ? '، گروه ' + fa(e.group) : ''}، دورهٔ ${fa(e.period)}`;

  const KINDS = {
    sym2fa: { typeable: true, make(e) {
      return { prompt: 'نام فارسی این عنصر چیست؟', big: lat(e.sym), input: 'fa', answer: e.fa, check: v => matchesName(v, e),
        opts: shuffle([e, ...pickNames(e, 'fa', 3)]).map(x => ({ html: x.fa, ok: x.z === e.z })), explain: where(e) };
    } },
    fa2sym: { typeable: true, make(e) {
      return { prompt: 'نماد شیمیایی این عنصر کدام است؟', big: e.fa, bigCls: 'fa', input: 'sym', answer: e.sym, check: v => v.trim().toLowerCase() === e.sym.toLowerCase(),
        opts: shuffle([e, ...pickNames(e, 'sym', 3)]).map(x => ({ html: lat(x.sym), ok: x.z === e.z })), explain: where(e) };
    } },
    num2fa: { typeable: true, make(e) {
      return { prompt: `عنصر شمارهٔ ${fa(e.z)} کدام است؟`, big: fa(e.z), input: 'fa', answer: e.fa, check: v => matchesName(v, e),
        opts: shuffle([e, ...pickNames(e, 'fa', 3)]).map(x => ({ html: `${x.fa} (${lat(x.sym)})`, ok: x.z === e.z })), explain: where(e) };
    } },
    fa2num: { typeable: true, make(e) {
      return { prompt: 'عدد اتمی این عنصر چند است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', input: 'num', answer: fa(e.z), check: v => +normFa(v) === e.z,
        opts: shuffle([e.z, ...nearNums(e.z, 1, 118, 3, 6)]).map(n => ({ html: fa(n), ok: n === e.z })), explain: where(e) };
    } },
    group: { typeable: true, ok: e => !!e.group, make(e) {
      return { prompt: 'این عنصر در کدام گروه جدول است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', input: 'num', answer: fa(e.group), check: v => +normFa(v) === e.group,
        opts: shuffle([e.group, ...nearNums(e.group, 1, 18, 3, 4)]).map(n => ({ html: 'گروه ' + fa(n), ok: n === e.group })), explain: where(e) };
    } },
    period: { typeable: true, make(e) {
      return { prompt: 'این عنصر در کدام دورهٔ جدول است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', input: 'num', answer: fa(e.period), check: v => +normFa(v) === e.period,
        opts: shuffle([e.period, ...nearNums(e.period, 1, 7, 3, 3)]).map(n => ({ html: 'دورهٔ ' + fa(n), ok: n === e.period })), explain: where(e) };
    } },
    cat: { typeable: false, make(e) {
      const others = shuffle(Object.keys(CATS).filter(k => k !== e.cat)).slice(0, 3);
      return { prompt: 'این عنصر جزو کدام دسته است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', answer: CATS[e.cat].fa,
        opts: shuffle([e.cat, ...others]).map(k => ({ html: CATS[k].fa, ok: k === e.cat })), explain: `${e.fa} جزو «${CATS[e.cat].fa}» است.` };
    } },
    valence: { typeable: false, ok: e => !['transition', 'lanthanide', 'actinide'].includes(e.cat), make(e) {
      return { prompt: 'شمار الکترون‌های لایهٔ آخر این عنصر چند است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', answer: fa(e.valence),
        opts: shuffle([e.valence, ...nearNums(e.valence, 1, 8, 3, 3)]).map(n => ({ html: fa(n), ok: n === e.valence })),
        explain: `${e.fa}: آرایش لایه‌ای ${e.shells.map(fa).join('، ')} و ${fa(e.valence)} الکترون در لایهٔ آخر دارد.` };
    } }
  };

  function makeQuestion(z, mode, groups) {
    const e = E[z - 1];
    const enabled = [];
    (groups || S().quizPrefs.kinds).forEach(g => KIND_GROUPS[g].kinds.forEach(k => enabled.push(k)));
    let ks = enabled.filter(k => (mode === 'mc' || KINDS[k].typeable) && (!KINDS[k].ok || KINDS[k].ok(e)));
    if (!ks.length) ks = ['sym2fa', 'fa2sym'];
    const kind = ks[rand(ks.length)];
    return Object.assign({ kind, z }, KINDS[kind].make(e));
  }

  APP.makeQ = (z, mode, groups) => makeQuestion(z, mode, groups);
  APP.KIND_GROUPS = KIND_GROUPS;

  // نمونه‌گیری وزنی: عنصرهای ضعیف‌تر شانس بیشتری دارند
  function sample(zs, n) {
    const keyed = zs.map(z => ({ z, k: Math.pow(Math.random(), 1 / (1 / (1 + APP.box(z)) + 0.05)) }));
    keyed.sort((a, b) => b.k - a.k);
    let out = keyed.map(x => x.z).slice(0, n);
    while (out.length < n && zs.length) out = out.concat(shuffle(zs)).slice(0, n);
    return out;
  }

  /* ---------- جریان تمرین ---------- */
  let P = null; // وضعیت تمرین جاری
  let timerId = null;
  const stopTimer = () => { if (timerId) { clearInterval(timerId); timerId = null; } };

  function begin(mode, pool, opts) {
    const p = S().quizPrefs;
    const timed = opts && opts.timed != null ? opts.timed : p.timed;
    const count = opts && opts.count || p.count;
    P = { mode, pool, timed, count, i: 0, right: 0, wrong: [], seen: 0, q: null, done: false, locked: false, timeLeft: 60, requeued: new Set() };
    if (mode === 'flash') {
      P.deck = sample(pool, Math.min(pool.length, timed ? 40 : count));
      P.total = P.deck.length;
    } else {
      P.items = timed ? null : sample(pool, count);
      P.total = timed ? 0 : count;
    }
    APP.go('#/play');
  }

  APP.acts['q-start'] = () => {
    const pool = [...initSel()].sort((a, b) => a - b);
    if (!pool.length) { APP.toast('اول بخشی از جدول را انتخاب کنید'); return; }
    begin(S().quizPrefs.mode, pool);
  };
  APP.acts['practice-weak'] = () => begin('mc', APP.weakest(10, true).map(e => e.z), { count: 10, timed: false });
  const goPractice = zs => { APP.quizSel = new Set(zs); APP.closeSheet(); APP.go('#/quiz'); };
  APP.acts['practice-group'] = t => { const g = E[+t.dataset.z - 1].group; goPractice(E.filter(e => e.group === g).map(e => e.z)); };
  APP.acts['practice-period'] = t => { const p = E[+t.dataset.z - 1].row; goPractice(E.filter(e => e.row === p).map(e => e.z)); };
  APP.acts['practice-cat'] = t => { const c = E[+t.dataset.z - 1].cat; goPractice(E.filter(e => e.cat === c).map(e => e.z)); };

  APP.views.play = function () {
    if (!P) { setTimeout(() => APP.go('#/quiz'), 0); return ''; }
    APP.onLeave = () => { stopTimer(); };
    if (P.done) return resultHTML();
    if (P.mode === 'flash') return flashHTML();
    nextQuestion(true);
    APP.afterRender = () => APP.afterPlayRender();
    return playHTML();
  };

  function topBar() {
    const total = P.timed ? '∞' : fa(P.total);
    const pr = P.timed ? 0 : Math.round(P.i / P.total * 100);
    return `<div class="q-top">
      <button class="icon-btn" data-act="q-quit" aria-label="خروج">✕</button>
      <div class="bar ${P.timed ? 'time' : ''}"><i id="q-bar" style="width:${P.timed ? (P.timeLeft / 60 * 100) : pr}%"></i></div>
      <span class="badge" id="q-count">${P.timed ? '⏱ ' + fa(P.timeLeft) : fa(Math.min(P.i + 1, P.total)) + ' / ' + total}</span>
    </div>`;
  }

  function nextQuestion(first) {
    if (!P.timed && P.i >= P.total) return finish();
    const z = P.timed ? sample(P.pool, 1)[0] : P.items[P.i];
    P.q = P.mode === 'place' ? { kind: 'place', z } : makeQuestion(z, P.mode);
    P.locked = false;
    if (P.timed && first && !timerId) {
      timerId = setInterval(() => {
        P.timeLeft--;
        const b = $('#q-bar'), c = $('#q-count');
        if (b) b.style.width = (P.timeLeft / 60 * 100) + '%';
        if (c) c.textContent = '⏱ ' + fa(Math.max(0, P.timeLeft));
        if (P.timeLeft <= 0) finish();
      }, 1000);
    }
  }

  function playHTML() {
    const q = P.q, e = E[q.z - 1];
    if (P.mode === 'place') {
      const cell = APP.cellSize({ auto: true, min: 20, max: 46 });
      return `<div class="stack">${topBar()}
        <div class="card center"><div class="q-prompt">جای این عنصر را روی جدول نشان بدهید</div>
          <div class="q-big fa">${e.fa} <span class="sym" style="color:var(--ink-2)">(${e.sym})</span></div></div>
        <div id="fb"></div>
        <div class="pt-scroll">${APP.tableHTML({ mode: 'place', cell })}</div></div>`;
    }
    let body;
    if (P.mode === 'type') {
      body = `<input id="ans" class="type-input" type="text" inputmode="${q.input === 'num' ? 'numeric' : 'text'}" dir="${q.input === 'sym' ? 'ltr' : 'rtl'}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.input === 'fa' ? 'نام فارسی را بنویسید' : q.input === 'sym' ? 'نماد (مثل Na)' : 'یک عدد بنویسید'}" aria-label="پاسخ">
        <div class="row" style="margin-top:12px;justify-content:center"><button class="btn primary grow" data-act="q-submit">ثبت پاسخ</button><button class="btn" data-act="q-hint">راهنمایی</button><button class="btn ghost" data-act="q-skip">نمی‌دانم</button></div>`;
    } else {
      body = `<div class="opts ${q.opts.some(o => o.html.length > 14) ? '' : 'grid2'}">${q.opts.map((o, i) => `<button class="opt" data-act="q-pick" data-i="${i}">${o.html}</button>`).join('')}</div>`;
    }
    return `<div class="stack">${topBar()}
      <div class="card q-card"><div class="q-prompt">${q.prompt}</div><div class="q-big ${q.bigCls || ''}">${q.big}</div>${body}<div id="fb"></div></div></div>`;
  }
  APP.afterPlayRender = () => { const a = $('#ans'); if (a) a.focus(); };

  function feedback(ok, q, extra) {
    const fb = $('#fb'); if (!fb) return;
    const last = !P.timed && P.i + 1 >= P.total;
    fb.innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? '✅ درست!' : '❌ پاسخ درست: ' + (q.answer || '')}<span class="more">${(extra || '') + q.explain}</span>
      ${P.timed ? '' : `<button class="btn primary block" style="margin-top:10px" data-act="q-next" id="next-btn">${last ? 'دیدن نتیجه' : 'سؤال بعدی'}</button>`}</div>`;
    const nb = $('#next-btn'); if (nb) nb.focus({ preventScroll: true });
  }

  function settle(ok, q, extra) {
    if (P.locked) return;
    P.locked = true; P.seen++;
    APP.fx.play(ok ? 'good' : 'bad');
    if (!ok) { const card = $('.q-card') || $('.pt.place'); if (card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); } }
    else { const card = $('.q-card'); if (card) { card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse'); } }
    APP.record(q.z, ok);
    if (ok) { P.right++; APP.addXP(10); } else if (!P.wrong.includes(q.z)) P.wrong.push(q.z);
    APP.save();
    if (q.kind === 'place') placeFeedback(ok, q); else feedback(ok, q, extra);
    if (P.timed) setTimeout(() => { if (P && !P.done) { P.i++; nextQuestion(); rerenderPlay(); } }, ok ? 450 : 1400);
  }
  function placeFeedback(ok, q) {
    const e = E[q.z - 1];
    const fb = $('#fb'); if (!fb) return;
    const last = !P.timed && P.i + 1 >= P.total;
    fb.innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? '✅ درست!' : '❌ اینجا نبود؛ جای درست با رنگ سبز نشان داده شد.'}<span class="more">${where(e)}</span>
      ${P.timed ? '' : `<button class="btn primary block" style="margin-top:10px" data-act="q-next" id="next-btn">${last ? 'دیدن نتیجه' : 'سؤال بعدی'}</button>`}</div>`;
  }
  function rerenderPlay() {
    if (APP.route().name !== 'play') return;
    $('#view').innerHTML = P.done ? resultHTML() : P.mode === 'flash' ? flashHTML() : playHTML();
    APP.afterPlayRender();
  }

  APP.acts['q-pick'] = t => {
    const q = P.q; if (P.locked) return;
    const i = +t.dataset.i;
    $$('.opt').forEach((b, k) => { b.disabled = true; if (q.opts[k].ok) b.classList.add('good'); });
    if (!q.opts[i].ok) t.classList.add('bad');
    settle(q.opts[i].ok, q);
  };
  APP.acts['q-submit'] = () => {
    const q = P.q; if (P.locked) return;
    const inp = $('#ans'); const v = inp.value;
    if (!v.trim()) { inp.focus(); return; }
    inp.disabled = true;
    settle(!!q.check(v), q, v.trim() && !q.check(v) ? `پاسخ شما: ${v.trim()}. ` : '');
  };
  APP.acts['q-skip'] = () => { if (P.locked) return; const inp = $('#ans'); if (inp) inp.disabled = true; settle(false, P.q, 'اشکالی ندارد؛ این‌بار یاد می‌گیرید. '); };
  APP.acts['q-hint'] = () => {
    const q = P.q, inp = $('#ans'); if (!inp || P.locked) return;
    const a = String(q.answer).replace(/<[^>]+>/g, '');
    inp.placeholder = 'حرف اول: ' + a[0] + ' — تعداد حروف: ' + fa(a.length);
    P.hinted = true; inp.focus();
  };
  APP.acts['q-next'] = () => { P.i++; nextQuestion(); if (P.done) return; rerenderPlay(); };
  APP.acts['q-quit'] = () => {
    if (P && P.seen && !P.done && !confirm('تمرین نیمه‌کاره بماند؟ نتیجه‌ها تا همین‌جا ثبت می‌شود.')) return;
    if (P && P.seen && !P.done) finish(); else { stopTimer(); P = null; APP.go('#/quiz'); }
  };
  APP.acts['place-pick'] = t => {
    if (!P || P.mode !== 'place' || P.locked) return;
    const z = +t.dataset.z, target = P.q.z;
    const ok = z === target;
    const tiles = $$('.pt.place .el');
    t.classList.add(ok ? 'good' : 'bad');
    if (!ok) { const r = tiles.find(b => +b.dataset.z === target); if (r) r.classList.add('reveal'); }
    settle(ok, P.q);
  };
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && P && !P.done && APP.route().name === 'play') {

  /* ---------- پردازش فرمول ---------- */
  function parse(f) {
    const st = [{}];
    let i = 0;
    const num = () => { let n = ''; while (i < f.length && /\d/.test(f[i])) n += f[i++]; return n ? +n : 1; };
    while (i < f.length) {
      const c = f[i];
      if (c === '(') { st.push({}); i++; }
      else if (c === ')') {
        i++;
        const n = num(), top = st.pop(), below = st[st.length - 1];
        for (const k in top) below[k] = (below[k] || 0) + top[k] * n;
      } else {
        const m = /^[A-Z][a-z]?/.exec(f.slice(i));
        const sym = m[0]; i += sym.length;
        const n = num();
        st[st.length - 1][sym] = (st[st.length - 1][sym] || 0) + n;
      }
    }
    return st[0];
  }
  const keyOf = c => Object.keys(c).sort().map(k => k + c[k]).join('');
  const BY_SYM = {}; E.forEach(e => (BY_SYM[e.sym] = e));
  const sub = n => String(n).replace(/\d/g, d => '₀₁₂₃₄₅₆₇₈₉'[d]);
  const subHTML = f => f.replace(/(\d+)/g, '<sub>$1</sub>');
  APP.subHTML = subHTML;

  const ALL = [];
  const MAP = {};
  SECTIONS.forEach(s => s.items.forEach(([f, n, d]) => {
    const counts = parse(f);
    const c = { f, n, d, sec: s.id, counts, key: keyOf(counts) };
    for (const sym in counts) if (!BY_SYM[sym]) throw new Error('نماد ناشناخته: ' + sym + ' در ' + f);
    if (MAP[c.key]) console.warn('ترکیب تکراری:', f, MAP[c.key].f);
    MAP[c.key] = c; ALL.push(c);
  }));
  APP.compounds = { SECTIONS, ALL, MAP, parse, keyOf };

  /* ---------- وضعیت سینی ---------- */
  const MAX_ATOMS = 40;
  let tray = []; // آرایه‌ای از شمارهٔ اتمی

  const countsOf = () => { const c = {}; tray.forEach(z => { const s = E[z - 1].sym; c[s] = (c[s] || 0) + 1; }); return c; };
  function orderedSyms(counts) {
    const keyc = keyOf(counts);
    if (MAP[keyc]) return Object.keys(parse(MAP[keyc].f));
    const seen = [];
    tray.forEach(z => { const s = E[z - 1].sym; if (!seen.includes(s)) seen.push(s); });
    return seen;
  }
  function formulaOf(counts) {
    const m = MAP[keyOf(counts)];
    if (m) return m.f;
    return orderedSyms(counts).map(s => s + (counts[s] > 1 ? counts[s] : '')).join('');
  }

  /* ---------- شکل مولکول ---------- */
  function molSVG(counts) {
    const atoms = [];
    Object.keys(counts).forEach(s => { for (let i = 0; i < counts[s]; i++) atoms.push(BY_SYM[s]); });
    const n = atoms.length;
    // اتم مرکزی: کم‌ترین تعداد و بزرگ‌ترین عدد اتمی
    const syms = Object.keys(counts).sort((a, b) => counts[a] - counts[b] || BY_SYM[b].z - BY_SYM[a].z);
    const centerSym = syms[0];
    const ci = atoms.findIndex(a => a.sym === centerSym);
    const center = atoms.splice(ci, 1)[0];
    const W = 260, H = 200, cx = W / 2, cy = H / 2;
    const r = n <= 2 ? 66 : n <= 7 ? 70 : 82;
    const ar = n <= 4 ? 23 : n <= 9 ? 17 : 12;
    let svg = `<svg class="mol" viewBox="0 0 ${W} ${H}" role="img" aria-label="شکل ساده‌شدهٔ مولکول">`;
    let body = '', lines = '';
    const pts = [];
    const m = atoms.length;
    atoms.forEach((a, i) => {
      const ring2 = m > 8 && i >= Math.ceil(m / 2);
      const idx = ring2 ? i - Math.ceil(m / 2) : i;
      const cnt = ring2 ? m - Math.ceil(m / 2) : (m > 8 ? Math.ceil(m / 2) : m);
      const rr = ring2 ? r * 1.35 : (m > 8 ? r * 0.72 : r);
      const ang = -Math.PI / 2 + (2 * Math.PI * idx) / cnt + (ring2 ? Math.PI / cnt : 0);
      const x = cx + Math.min(rr, 80) * 1.3 * Math.cos(ang), y = cy + Math.min(rr, 80) * Math.sin(ang);
      pts.push([a, x, y]);
    });
    pts.forEach(([a, x, y]) => { lines += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; });
    pts.forEach(([a, x, y], i) => {
      body += `<g class="at" style="animation-delay:${(i * 60) + 120}ms"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${ar}" style="fill:var(--c-${a.cat})"/><text x="${x.toFixed(1)}" y="${(y + 1).toFixed(1)}">${a.sym}</text></g>`;
    });
    body += `<g class="at" style="animation-delay:0ms"><circle cx="${cx}" cy="${cy}" r="${Math.round(ar * 1.25)}" style="fill:var(--c-${center.cat})"/><text x="${cx}" y="${cy + 1}">${center.sym}</text></g>`;
    return svg + `<g class="bonds">${lines}</g>` + body + '</svg>';
  }

  APP.molSVG = molSVG;

  /* ---------- نمایش‌ها ---------- */
  const isT = () => APP.isTeacher();
  const have = c => isT() || !!S().compounds[c.key];
  const builtCount = () => ALL.filter(have).length;
  let cq = '';

  APP.microscopeSVG = function (cls) {
    return `<svg class="${cls || 'micro'}" viewBox="0 0 160 160" role="img" aria-label="میکروسکوپ" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="80" cy="147" rx="52" ry="8" fill="currentColor" opacity=".18"/>
      <path d="M38 142c0-9 8-14 20-14h44c12 0 20 5 20 14z" fill="currentColor" opacity=".9"/>
      <path d="M62 128c-26-6-34-34-22-56 8-14 24-20 38-12" stroke="currentColor" stroke-width="9"/>
      <g transform="rotate(-28 84 52)">
        <rect x="68" y="18" width="24" height="62" rx="6" fill="currentColor"/>
        <rect x="72" y="6" width="16" height="16" rx="4" fill="currentColor" opacity=".75"/>
        <rect x="74" y="80" width="12" height="14" rx="3" fill="currentColor" opacity=".75"/>
        <circle cx="80" cy="97" r="4.5" fill="var(--accent)"/>
      </g>
      <rect x="82" y="104" width="40" height="7" rx="3.5" fill="currentColor"/>
      <circle cx="118" cy="104" r="3" fill="var(--accent)"/>
      <circle class="spark" cx="108" cy="92" r="2.4" fill="var(--accent)"/>
      <circle class="spark s2" cx="124" cy="96" r="1.8" fill="var(--accent)"/>
    </svg>`;
  };

  APP.homeCompoundCard = function () {
    const n = builtCount();
    return `<button class="compound-card" data-go="#/compounds" aria-label="رفتن به بخش ترکیبات">
      ${APP.microscopeSVG()}
      <div class="grow">
        <h3>ترکیبات</h3>
        <p>اتم‌ها را زیر میکروسکوپ کنار هم بگذارید و ${fa(ALL.length)} ترکیب مدرسه‌ای مثل <span class="sym">H₂O</span> و <span class="sym">NaCl</span> بسازید.</p>
        <span class="badge">${isT() ? fa(ALL.length) + ' ترکیب برای نمایش به دانش‌آموزان' : fa(n) + ' از ' + fa(ALL.length) + ' ساخته‌شده'}</span>
      </div>
      <span class="go-arrow" aria-hidden="true">‹</span>
    </button>`;
  };

  APP.views.compounds = function () {
    cq = '';
    const cell = APP.cellSize({ auto: true, min: 14, max: 40 });
    const table = APP.tableHTML({ mode: 'build', cell });
    APP.afterRender = () => { renderTray(); renderCollection(); };
    return `
      <div class="stack">
        <div class="row">
          <button class="btn sm ghost" data-go="#/home">→ جدول</button>
          <h2 class="grow" style="font-size:20px;font-weight:800">🔬 ترکیبات</h2>
          <span class="badge" id="c-badge"></span>
        </div>
        <p class="small muted">روی عنصرها بزنید (در کامپیوتر می‌توانید بکشید و رها کنید) تا اتم‌ها به میکروسکوپ بیایند. برای ساختن <b>H₂</b> دو بار روی <span class="sym">H</span> بزنید؛ بعد یک‌بار روی <span class="sym">O</span> تا <b>H₂O</b> شود و دکمهٔ «ساخت» را بزنید.</p>
        <div class="pt-scroll" id="pt-scroll">${table}</div>

        <section class="card lab-card" aria-label="میکروسکوپ">
          <div class="lab-head">
            ${APP.microscopeSVG('micro sm')}
            <div class="formula-bar">
              <div class="formula" id="c-formula" aria-live="polite">—</div>
              <div class="small muted" id="c-count">هنوز اتمی انتخاب نشده</div>
            </div>
            <button class="btn accent build-btn" data-act="build-go" id="build-btn">ساخت ✨</button>
          </div>
          <div class="lens" id="lens" aria-label="صفحهٔ میکروسکوپ"><div class="lens-hint" id="lens-hint">اتم‌ها اینجا می‌آیند</div><div class="atoms" id="atoms"></div></div>
          <div class="row" style="justify-content:center">
            <button class="btn sm" data-act="build-undo">↶ برگردان</button>
            <button class="btn sm" data-act="build-clear">پاک‌کردن همه</button>
          </div>
          <div id="c-msg" class="c-msg" role="status"></div>
        </section>

        <section class="card" aria-label="کلکسیون ترکیب‌ها">
          <div class="section-title">${isT() ? 'همهٔ ترکیب‌ها' : 'کلکسیون من'}</div>
          <p class="small muted" style="margin-bottom:8px">${isT() ? 'روی هر ترکیب بزنید تا فرمول، شکل مولکول و توضیحش را روی تخته نشان دهید. با میکروسکوپ بالا هم می‌توانید زنده بسازید.' : 'اسم ترکیب‌ها را می‌بینید؛ فرمولشان را خودتان پیدا کنید! روی ترکیب قفل‌شده بزنید تا راهنمایی بگیرید.'}</p>
          ${isT() ? '<input id="c-search" type="search" class="selectable" placeholder="جست‌وجوی ترکیب: نام یا فرمول…" style="margin-bottom:10px" autocomplete="off">' : ''}
          <div id="collection"></div>
        </section>
      </div>`;
  };

  function renderTray() {
    const atoms = $('#atoms'); if (!atoms) return;
    const counts = countsOf();
    const n = tray.length;
    const size = n <= 12 ? 46 : n <= 24 ? 36 : 30;
    // گروه‌بندی اتم‌ها بر اساس عنصر
    const order = orderedSyms(counts);
    let h = '';
    order.forEach(s => {
      tray.forEach((z, i) => { if (E[z - 1].sym === s) h += `<button class="atom c-${E[z - 1].cat}" data-act="build-rm" data-i="${i}" style="--sz:${size}px;--d:${(i % 7) * -0.6}s" aria-label="حذف اتم ${E[z - 1].fa}">${s}</button>`; });
    });
    atoms.innerHTML = h;
    atoms.classList.toggle('many', n > 24);
    const hint = $('#lens-hint'); if (hint) hint.style.display = n ? 'none' : '';
    const f = $('#c-formula');
    if (f) f.innerHTML = n ? subHTML(formulaOf(counts)) : '—';
    const c = $('#c-count');
    if (c) c.textContent = n ? `${fa(n)} اتم · ${fa(Object.keys(counts).length)} نوع عنصر` : 'هنوز اتمی انتخاب نشده';
    const b = $('#build-btn'); if (b) b.disabled = !n;
    const bd = $('#c-badge'); if (bd) bd.textContent = `${fa(builtCount())} از ${fa(ALL.length)} ساخته شد`;
    syncTableCounts(counts);
  }
  function syncTableCounts(counts) {
    $$('#pt-scroll .el').forEach(b => {
      const s = b.querySelector('b').textContent;
      b.classList.toggle('picked', !!counts[s]);
      let t = b.querySelector('.cnt');
      if (counts[s]) {
        if (!t) { t = document.createElement('span'); t.className = 'cnt'; b.appendChild(t); }
        t.textContent = fa(counts[s]);
      } else if (t) t.remove();
    });
  }

  function renderCollection() {
    const box = $('#collection'); if (!box) return;
    let h = '';
    const q = cq.trim().toLowerCase();
    SECTIONS.forEach(s => {
      let items = ALL.filter(c => c.sec === s.id);
      if (q) items = items.filter(c => c.f.toLowerCase().includes(q) || u.normFa(c.n).includes(u.normFa(q)));
      if (!items.length) return;
      const got = items.filter(have).length;
      h += `<div class="coll-sec"><h4>${s.t} <span class="muted small">(${fa(got)}/${fa(items.length)})</span></h4><div class="coll-grid">`;
      items.forEach(c => {
        const ok = have(c);
        const shortName = c.n.split(' (')[0];
        h += ok
          ? `<button class="coll got" data-act="coll-open" data-k="${c.key}"><b class="sym">${subHTML(c.f)}</b><span>${shortName}</span></button>`
          : `<button class="coll lock" data-act="coll-hint" data-k="${c.key}"><b>🔒</b><span>${shortName}</span></button>`;
      });
      h += '</div></div>';
    });
    box.innerHTML = h;
  }

  /* ---------- کنش‌ها ---------- */
  function addAtom(z, fromEl) {
    if (tray.length >= MAX_ATOMS) { APP.toast('حداکثر ' + fa(MAX_ATOMS) + ' اتم می‌شود'); APP.fx.play('bad'); return; }
    tray.push(z);
    APP.fx.play('pop', z);
    clearMsg();
    renderTray();
    const items = $$('#atoms .atom');
    const mine = items.find(b => +b.dataset.i === tray.length - 1);
    if (mine) mine.classList.add('born');
    if (fromEl) { fromEl.classList.remove('bump'); void fromEl.offsetWidth; fromEl.classList.add('bump'); }
  }
  APP.acts['build-add'] = t => addAtom(+t.dataset.z, t);
  APP.acts['build-rm'] = t => {
    const i = +t.dataset.i;
    if (!(i >= 0 && i < tray.length)) return;
    tray.splice(i, 1); APP.fx.play('remove'); clearMsg(); renderTray();
  };
  APP.acts['build-undo'] = () => { if (tray.length) { tray.pop(); APP.fx.play('remove'); clearMsg(); renderTray(); } };
  APP.acts['build-clear'] = () => { if (tray.length) { tray = []; APP.fx.play('remove'); clearMsg(); renderTray(); } };
  function clearMsg() { const m = $('#c-msg'); if (m) { m.className = 'c-msg'; m.textContent = ''; } }
  function say(html, kind) { const m = $('#c-msg'); if (m) { m.className = 'c-msg show ' + (kind || ''); m.innerHTML = html; } }
  function shake() { const l = $('#lens'); if (!l) return; l.classList.remove('shake'); void l.offsetWidth; l.classList.add('shake'); }

  APP.acts['build-go'] = () => {
    if (!tray.length) { say('اول چند عنصر انتخاب کنید.', 'bad'); return; }
    const counts = countsOf();
    const c = MAP[keyOf(counts)];
    if (c) {
      const first = !isT() && !S().compounds[c.key];
      if (first) { S().compounds[c.key] = Date.now(); APP.addXP(15); APP.touchStreak(); APP.save(); }
      APP.fx.play('build'); APP.fx.confetti();
      APP.openSheet(resultHTML(c, first));
      renderTray(); renderCollection();
      return;
    }
    APP.fx.play('bad'); shake();
    const syms = Object.keys(counts);
    if (tray.length === 1) { say('یک اتم تنها هنوز ترکیب نیست؛ اتم‌های بیشتری اضافه کنید.', 'bad'); return; }
    const same = ALL.filter(x => { const k = Object.keys(x.counts); return k.length === syms.length && k.every(s => syms.includes(s)); });
    if (same.length) say('با این عنصرها ترکیبی می‌شود ساخت، ولی <b>شمار اتم‌ها</b> درست نیست. شمارشان را کم یا زیاد کنید.', 'bad');
    else say('این ترکیب در فهرست برنامه نیست. یا اتم‌ها را عوض کنید یا از «کلکسیون من» یک ترکیب را برای راهنمایی انتخاب کنید.', 'bad');
  };

  function resultHTML(c, first) {
    const total = builtCount();
    const elems = Object.keys(c.counts).map(s => `${BY_SYM[s].fa} (${s}) × ${fa(c.counts[s])}`).join('، ');
    return `
      <div class="sheet-head"><h2>ترکیب ساخته شد</h2><button class="icon-btn" data-act="close-sheet" aria-label="بستن">✕</button></div>
      <div class="result-compound">
        ${isT() ? `<div class="made">ترکیب: <b>${c.n.split(' (')[0]}</b></div>` : first ? `<div class="made">🎉 شما <b>${c.n.split(' (')[0]}</b> را ساختید!</div>` : `<div class="made">این ترکیب را قبلاً ساخته بودید: <b>${c.n.split(' (')[0]}</b></div>`}
        <div class="big-formula sym">${subHTML(c.f)}</div>
        <div class="mol-wrap">${molSVG(c.counts)}</div>
        <div class="small muted center">${c.n}</div>
        <p class="center" style="margin:8px 0">${c.d}</p>
        <div class="fact wide"><span>از چه اتم‌هایی ساخته شده؟</span><b>${elems}</b></div>
        ${first ? `<p class="small center muted" style="margin-top:8px">+۱۵ امتیاز · ${fa(total)} از ${fa(ALL.length)} ترکیب ساخته شده</p>` : ''}
        <div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="build-again">ترکیب بعدی</button></div>
      </div>`;
  }
  APP.acts['build-again'] = () => { tray = []; APP.closeSheet(); renderTray(); const p = $('#pt-scroll'); if (p) p.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  APP.acts['coll-open'] = t => { const c = MAP[t.dataset.k]; if (c) { APP.fx.play('open'); APP.openSheet(resultHTML(c, false)); } };
  APP.acts['coll-hint'] = t => {
    const c = MAP[t.dataset.k]; if (!c) return;
    const parts = Object.keys(c.counts).map(s => BY_SYM[s].fa);
    const total = Object.values(c.counts).reduce((a, b) => a + b, 0);
    say(`راهنما برای «${c.n.split(' (')[0]}»: از عنصرهای <b>${parts.join(' و ')}</b> ساخته می‌شود و جمعاً <b>${fa(total)} اتم</b> دارد.`, 'hint');
    APP.fx.play('tap');
    const m = $('#c-msg'); if (m) m.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  /* ---------- کشیدن و رها کردن (کامپیوتر) ---------- */
  document.addEventListener('dragstart', ev => {
    const b = ev.target.closest && ev.target.closest('.pt.build .el');
    if (!b) return;
    ev.dataTransfer.setData('text/plain', b.dataset.z);
    ev.dataTransfer.effectAllowed = 'copy';
  });
  document.addEventListener('dragover', ev => {
    const l = ev.target.closest && ev.target.closest('#lens');
    if (l) { ev.preventDefault(); l.classList.add('over'); }
  });
  document.addEventListener('dragleave', ev => {
    const l = ev.target.closest && ev.target.closest('#lens');
    if (l && !l.contains(ev.relatedTarget)) l.classList.remove('over');
  });
  document.addEventListener('drop', ev => {
    const l = ev.target.closest && ev.target.closest('#lens');
    if (!l) return;
    ev.preventDefault(); l.classList.remove('over');
    const z = +ev.dataTransfer.getData('text/plain');
    if (z >= 1 && z <= 118) addAtom(z);
  });

  document.addEventListener('input', ev => {
    if (ev.target.id === 'c-search') { cq = ev.target.value; renderCollection(); }
  });
  APP.resetTray = () => { tray = []; };
})();

/* ===== rxdata.js ===== */
/* دادهٔ آزمایشگاه واکنش‌ها: مواد، شرایط و ۱۱۰+ واکنش مدرسه‌ای (هشتم تا دوازدهم)
   فرمت معادله: «2Mg + O2 > 2MgO ~ MnO2» که بعد از ~ کاتالیزگر (ماده‌ای که مصرف نمی‌شود) می‌آید. */
(function () {
  'use strict';

  const TYPES = {
    syn:   { t: 'ترکیب', ic: '🧩', d: 'دو یا چند ماده با هم یک ماده می‌سازند: A + B → AB' },
    dec:   { t: 'تجزیه', ic: '✂️', d: 'یک ماده به مواد ساده‌تر شکسته می‌شود: AB → A + B' },
    sr:    { t: 'جابه‌جایی یگانه', ic: '🔀', d: 'عنصر فعال‌تر جای عنصر کم‌فعال‌تر را در ترکیب می‌گیرد: A + BC → AC + B' },
    dr:    { t: 'جابه‌جایی دوگانه', ic: '🔁', d: 'دو ترکیب یون‌هایشان را عوض می‌کنند (رسوب، گاز یا آب پدید می‌آید): AB + CD → AD + CB' },
    neut:  { t: 'خنثی‌شدن', ic: '⚖️', d: 'اسید با باز یا اکسید بازی نمک و آب می‌سازد.' },
    comb:  { t: 'سوختن', ic: '🔥', d: 'ماده با اکسیژن می‌سوزد و گرما و نور آزاد می‌کند.' },
    elec:  { t: 'برق‌کافت', ic: '🔌', d: 'جریان برق ماده را به مواد سازنده‌اش تجزیه می‌کند.' },
    org:   { t: 'واکنش آلی', ic: '🧬', d: 'واکنش ترکیب‌های کربن‌دار: افزایشی، استری‌شدن، پلیمری‌شدن، صابونی‌شدن و …' },
    redox: { t: 'اکسایش–کاهش', ic: '⚡', d: 'الکترون‌ها از یک ذره به ذرهٔ دیگر می‌روند؛ شمار اکسایش تغییر می‌کند.' }
  };
  const GROUPS = { m: 'فلزها', n: 'نافلزها', o: 'اکسیدها', a: 'اسیدها', b: 'بازها', s: 'نمک‌ها', c: 'آلی', x: 'آب و کاتالیزگر' };
  const CONDS = {
    heat:  { ic: '🔥', t: 'گرما' },
    spark: { ic: '⚡', t: 'جرقه' },
    light: { ic: '💡', t: 'نور' },
    elec:  { ic: '🔌', t: 'برق' }
  };

  // [شناسه (فرمول، با پسوند _c برای «غلیظ»)، نام، حالت (s جامد، l مایع، aq محلول، g گاز)، رنگ، گروه]

  /* ---------- ساخت ساختار داده ---------- */
  const SP = {};
  SPECIES.forEach(([id, n, s, c, g]) => { SP[id] = { id, f: id === 'yeast' ? '' : (id === 'PE' ? '(C2H4)n' : id.split('_')[0]), n, s, c, g }; });
  const fOf = id => (SP[id] ? SP[id].f : id.split('_')[0]);

  function parseSide(str) {
    return str.split(' + ').map(t => {
      const m = /^(\d+)?(.+)$/.exec(t.trim());
      return { n: m[1] ? +m[1] : 1, id: m[2] };
    });
  }
  const RX = ROWS.map(([g, t, eqs, cond, fx, obs]) => {
    const [main, cat] = eqs.split(' ~ ');
    const [L, R] = main.split(' > ');
    const left = parseSide(L), right = parseSide(R);
    const cats = cat ? cat.split(',').map(x => x.trim()) : [];
    const ins = left.map(x => x.id).concat(cats);
    const key = ins.slice().sort().join('+') + (cond ? '|' + cond : '');
    return { key, g, t, left, right, cats, cond, fx: fx || {}, obs, ins, nobal: /(^|\s)n[A-Z(]/.test(main) };
  });

  /* ---------- شمارش اتم و موازنه ---------- */
  function atoms(f) {
    const st = [{}];
    let i = 0;
    const num = () => { let n = ''; while (i < f.length && /\d/.test(f[i])) n += f[i++]; return n ? +n : 1; };
    while (i < f.length) {
      const ch = f[i];
      if (ch === '(') { st.push({}); i++; }
      else if (ch === ')') {
        i++;
        const n = num(), top = st.pop(), below = st[st.length - 1];
        for (const k in top) below[k] = (below[k] || 0) + top[k] * n;
      } else {
        const m = /^[A-Z][a-z]?/.exec(f.slice(i));
        if (!m) throw new Error('فرمول نامعتبر: ' + f);
        i += m[0].length;
        const n = num();
        st[st.length - 1][m[0]] = (st[st.length - 1][m[0]] || 0) + n;
      }
    }
    return st[0];
  }
  function sideAtoms(side, coefs) {
    const tot = {};
    side.forEach((x, i) => {
      const c = coefs ? coefs[i] : x.n;
      const a = atoms(fOf(x.id));
      for (const k in a) tot[k] = (tot[k] || 0) + a[k] * c;
    });
    return tot;
  }
  const sameAtoms = (a, b) => { const ks = new Set([...Object.keys(a), ...Object.keys(b)]); for (const k of ks) if ((a[k] || 0) !== (b[k] || 0)) return false; return true; };
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  function isBalanced(r, coefsL, coefsR) {
    if (r.nobal) return true;
    return sameAtoms(sideAtoms(r.left, coefsL), sideAtoms(r.right, coefsR));
  }
  const lowest = (cl, cr) => cl.concat(cr).reduce((a, b) => gcd(a, b)) === 1;

  const fmtF = f => f.replace(/(\d+)/g, '<sub>$1</sub>');
  const SUBD = '₀₁₂₃₄₅₆₇₈₉';
  const plainF = f => f.replace(/\d/g, d => SUBD[d]);
  const termHTML = (x, plain) => `${x.n > 1 ? x.n : ''}${plain ? plainF(fOf(x.id) || SP[x.id].n) : fmtF(fOf(x.id) || SP[x.id].n)}`;
  function eqHTML(r, opts) {
    const o = opts || {};
    const side = a => a.map(x => `<span class="rx-t">${termHTML(x)}</span>`).join(' + ');
    const above = [].concat(r.cats.map(c => fOf(c) || SP[c].n), r.cond ? [CONDS[r.cond].t] : []).map(s => fmtF(s)).join('، ');
    return `<span class="rx-eq" dir="ltr">${side(r.left)} <span class="rx-arrow">${above ? `<small>${above}</small>` : ''}<b>→</b></span> ${side(r.right)}</span>`;
  }
  function eqPlain(r) {
    const side = a => a.map(x => termHTML(x, true)).join(' + ');
    return `${side(r.left)} → ${side(r.right)}`;
  }
  const nameOf = id => (SP[id] ? SP[id].n : id);

  window.APP = Object.assign(window.APP || {}, {
    rx: { TYPES, GROUPS, CONDS, SP, SPECIES_LIST: Object.values(SP), RX, NOREACT, atoms, sideAtoms, sameAtoms, isBalanced, lowest, fOf, fmtF, plainF, eqHTML, eqPlain, nameOf, gcd }
  });
})();

/* ===== beaker.js ===== */
/* بشر آزمایشگاهی (SVG) و انیمیشن واکنش‌ها؛ هم در «آزمایشگاه» و هم در «نمایشگر کلاس» استفاده می‌شود */
(function () {
  'use strict';
  const R = APP.rx;
  const NS = 'http://www.w3.org/2000/svg';
  const S = () => APP.S();

  const sv = (tag, attrs, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hex = c => {
    const m = /^#?([0-9a-f]{6})$/i.exec(c || '');
    if (!m) return [200, 220, 230];
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  };
  const toHex = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const lum = c => { const [r, g, b] = hex(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
  const mix = (a, b, t) => { const x = hex(a), y = hex(b); return toHex(x.map((v, i) => v * (1 - t) + y[i] * t)); };
  const PALE = '#cfe9f3';
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const seeded = seed => () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
  const animOn = () => S().anim !== false && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const SLOTS = [84, 112, 140, 168];
  const isMetal = sp => sp && sp.g === 'm';
  const isLiquid = sp => sp && (sp.s === 'l' || sp.s === 'aq');

  /* حالت دیداری بشر را از فهرست مواد می‌سازد */
  function viewFromItems(items) {
    const v = { level: 0, color: PALE, solids: [], wisps: [] };
    const liqs = [];
    items.forEach((id, k) => {
      const sp = R.SP[id]; if (!sp) return;
      if (isLiquid(sp)) liqs.push(sp);
      else if (sp.s === 's') v.solids.push({ kind: isMetal(sp) ? 'strip' : 'grain', color: sp.c, slot: k, id });
      else if (sp.s === 'g') v.wisps.push({ color: lum(sp.c) > .85 ? '#c3d2dc' : sp.c });
    });
    if (liqs.length) {
      v.level = Math.min(150, 80 + 24 * (liqs.length - 1));
      const colored = liqs.filter(s => lum(s.c) < .86);
      if (colored.length) {
        let c = colored[0].c;
        colored.slice(1).forEach(s => { c = mix(c, s.c, .5); });
        v.color = mix(PALE, c, .8);
      }
    }
    return v;
  }

  let UID = 0;
  function create(host, opts) {
    opts = opts || {};
    const id = 'bk' + (++UID);
    host.innerHTML = `
      <svg class="bk" viewBox="0 0 240 300" role="img" aria-label="بشر آزمایشگاه">
        <defs>
          <clipPath id="${id}c"><path d="M56 44 H184 V234 Q184 246 172 246 H68 Q56 246 56 234 Z"/></clipPath>
          <linearGradient id="${id}g" x1="0" x2="1">
            <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".22" stop-color="#fff" stop-opacity=".06"/>
            <stop offset=".82" stop-color="#fff" stop-opacity=".03"/><stop offset="1" stop-color="#fff" stop-opacity=".32"/>
          </linearGradient>
          <radialGradient id="${id}r"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse class="bk-glow" cx="120" cy="150" rx="118" ry="132" opacity="0"/>
        <ellipse cx="120" cy="268" rx="84" ry="9" fill="rgba(0,0,0,.2)"/>
        <g clip-path="url(#${id}c)">
          <rect class="bk-liq" x="52" y="44" width="136" height="204" rx="0"/>
          <ellipse class="bk-surf" cx="120" cy="44" rx="64" ry="5"/>
          <g class="bk-sol"></g>
          <g class="bk-pile"></g>
          <g class="bk-fx"></g>
        </g>
        <path class="bk-glass" d="M52 40 V234 Q52 250 68 250 H172 Q188 250 188 234 V40" fill="url(#${id}g)"/>
        <path class="bk-glass-line" d="M44 40 H196"/>
        <g class="bk-marks"><path d="M52 86 h16 M52 112 h10 M52 138 h16 M52 164 h10 M52 190 h16 M52 216 h10"/></g>
        <path class="bk-shine" d="M62 60 V200"/>
        <g class="bk-over"></g>
      </svg>`;
    const svg = host.firstElementChild;
    const q = c => svg.querySelector(c);
    const liq = q('.bk-liq'), surf = q('.bk-surf'), sol = q('.bk-sol'), pile = q('.bk-pile'), fxg = q('.bk-fx'), over = q('.bk-over'), glow = q('.bk-glow');
    const glass = q('.bk-glass-line'), glassBody = q('.bk-glass');
    const timers = [];
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
    const loops = [];
    let items = [], cond = '', view = viewFromItems([]), busy = false, doneCb = null;

    const setLevel = (lv, color) => {
      const ty = lv ? 204 - lv : 204;
      liq.style.transform = `translateY(${ty}px)`; surf.style.transform = `translateY(${ty}px)`;
      liq.style.opacity = lv ? 1 : 0; surf.style.opacity = lv ? 1 : 0;
      if (color) { liq.style.fill = color; surf.style.fill = mix(color, '#ffffff', .35); }
    };
    const outline = c => (lum(c) > .8 ? '#9db1be' : 'rgba(0,0,0,.28)');

    function drawSolids(list) {
      sol.innerHTML = '';
      list.forEach(s => {
        const cx = SLOTS[s.slot % 4];
        const g = sv('g', { class: 'bk-sitem', 'data-id': s.id || '' }, sol);
        if (s.kind === 'strip') {
          const tilt = ((s.slot % 2) ? 1 : -1) * (6 + (s.slot % 3) * 3);
          sv('rect', { x: cx - 5, y: 150, width: 10, height: 96, rx: 3, fill: s.color, stroke: outline(s.color), 'stroke-width': 1.4, transform: `rotate(${tilt} ${cx} 246)`, class: 'bk-strip' }, g);
        } else {
          const rnd2 = seeded(hash((s.id || '') + s.slot));
          for (let i = 0; i < 9; i++) {
            const x = cx + (rnd2() - .5) * 30, y = 238 - rnd2() * 12, r = 3 + rnd2() * 3.6;
            const pts = [0, 1, 2, 3, 4].map(k => { const a = k / 5 * Math.PI * 2 + rnd2(); const rr = r * (.7 + rnd2() * .5); return (x + Math.cos(a) * rr).toFixed(1) + ',' + (y + Math.sin(a) * rr).toFixed(1); }).join(' ');
            sv('polygon', { points: pts, fill: s.color, stroke: outline(s.color), 'stroke-width': 1 }, g);
          }
        }
      });
    }
    function drawPile(list) {
      pile.innerHTML = '';
      list.forEach((p, k) => {
        const rnd2 = seeded(hash(p.color + k));
        const h = p.h || 14;
        const g = sv('g', { class: 'bk-pile-item' }, pile);
        sv('path', { d: `M56 246 V${246 - h * .55} Q88 ${246 - h * 1.15} 120 ${246 - h * .75} T184 ${246 - h * .6} V246 Z`, fill: p.color, stroke: outline(p.color), 'stroke-width': 1 }, g);
        for (let i = 0; i < 14; i++) sv('circle', { cx: 62 + rnd2() * 116, cy: 246 - rnd2() * h * .8, r: 1.6 + rnd2() * 2.2, fill: mix(p.color, '#000000', .1 + rnd2() * .15), opacity: .6 }, g);
      });
    }
    function drawWisps(list) {
      fxg.querySelectorAll('.bk-wisp').forEach(n => n.remove());
      list.forEach((w, k) => {
        const g = sv('g', { class: 'bk-wisp', style: `animation-delay:${-k * 1.3}s` }, fxg);
        for (let i = 0; i < 3; i++) sv('circle', { cx: 86 + i * 30 + k * 6, cy: 78 + (i % 2) * 14 + k * 8, r: 16 + i * 3, fill: w.color, opacity: .32 }, g);
      });
    }
    function draw(v) {
      view = v;
      setLevel(v.level, v.color);
      drawSolids(v.solids); drawPile(v.piles || []); drawWisps(v.wisps);
    }
    function setProps(c) {
      over.querySelectorAll('.bk-prop').forEach(n => n.remove());
      cond = c || '';
      if (!cond) return;
      const g = sv('g', { class: 'bk-prop' }, over);
      if (cond === 'heat') {
        [96, 120, 144].forEach((x, i) => sv('path', { d: `M${x} 282 C${x - 9} 272 ${x - 6} 262 ${x} 252 C${x + 6} 262 ${x + 9} 272 ${x} 282 Z`, fill: i === 1 ? '#ffb02e' : '#ff7a2f', class: 'bk-burner', style: `animation-delay:${i * .12}s` }, g));
        sv('rect', { x: 78, y: 280, width: 84, height: 8, rx: 4, fill: '#6b7782' }, g);
      } else if (cond === 'light') {
        sv('circle', { cx: 206, cy: 34, r: 14, fill: '#ffd43b' }, g);
        for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; sv('path', { d: `M${206 + Math.cos(a) * 19} ${34 + Math.sin(a) * 19} L${206 + Math.cos(a) * 28} ${34 + Math.sin(a) * 28}`, stroke: '#ffd43b', 'stroke-width': 3, 'stroke-linecap': 'round' }, g); }
      } else if (cond === 'spark') {
        sv('path', { d: 'M30 20 L44 42 L34 42 L48 68', stroke: '#ffd43b', 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: 'bk-bolt' }, g);
      } else if (cond === 'elec') {
        [[96, '−'], [144, '+']].forEach(([x, t]) => {
          sv('rect', { x: x - 4, y: 4, width: 8, height: 180, rx: 3, fill: '#3b4249' }, g);
          sv('text', { x, y: 0, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 800, fill: t === '+' ? '#e5484d' : '#4dabf7' }, g).textContent = t;
        });
        sv('path', { d: 'M96 4 V-6 H144 V4', stroke: '#8a949c', 'stroke-width': 3, fill: 'none' }, g);
      }
    }
    function setItems(list) {
      stop();
      items = list.slice();
      draw(viewFromItems(items));
    }

    /* ---------- ابزارهای انیمیشن ---------- */
    const kill = n => { try { n.remove(); } catch (e) { /* */ } };
    function particle(tag, attrs, parent, frames, opt) {
      const e = sv(tag, attrs, parent);
      const a = e.animate(frames, Object.assign({ fill: 'forwards', easing: 'ease-out' }, opt));
      a.onfinish = () => kill(e);
      return e;
    }
    function loop(fn, every, until) {
      const t0 = Date.now();
      const id = setInterval(() => { if (Date.now() - t0 > until) { clearInterval(id); return; } fn(); }, every);
      loops.push(id);
    }
    function stop() {
      timers.splice(0).forEach(clearTimeout);
      loops.splice(0).forEach(clearInterval);
      [fxg, over].forEach(g => { g.querySelectorAll('.bk-tmp').forEach(kill); });
      glow.setAttribute('opacity', 0);
      glass.style.stroke = ''; glassBody.style.stroke = '';
      svg.classList.remove('shake');
      busy = false;
    }
    const surfY = () => 244 - (view.level || 0);

    function flame(x, y, color, scale) {
      const g = sv('g', { class: 'bk-tmp bk-flame', transform: `translate(${x} ${y}) scale(${scale || 1})` }, over);
      sv('path', { d: 'M0 0 C-15 -16 -13 -34 0 -58 C13 -34 15 -16 0 0 Z', fill: color }, g);
      sv('path', { d: 'M0 0 C-7 -8 -6 -18 0 -30 C6 -18 7 -8 0 0 Z', fill: '#fff', opacity: .6 }, g);
      g.firstChild.style.transformOrigin = '0 0'; g.lastChild.style.transformOrigin = '0 0';
      if (animOn()) {
        g.firstChild.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(.88,1.18) skewX(5deg)' }, { transform: 'scale(1.08,.9) skewX(-5deg)' }, { transform: 'scale(1,1)' }], { duration: 420 + rnd(0, 160), iterations: Infinity });
        g.lastChild.animate([{ transform: 'scale(1,1)' }, { transform: 'scale(.85,1.2)' }, { transform: 'scale(1,1)' }], { duration: 300 + rnd(0, 120), iterations: Infinity });
      }
      return g;
    }
    function bubble(x, y, y2, color, r, dur) {
      particle('circle', { class: 'bk-tmp', cx: x, cy: y, r, fill: color || '#fff', 'fill-opacity': .75, stroke: '#fff', 'stroke-opacity': .9, 'stroke-width': .8 }, fxg,
        [{ transform: 'translate(0,0)', opacity: .95 }, { transform: `translate(${rnd(-6, 6)}px,${y2 - y}px)`, opacity: .9, offset: .85 }, { transform: `translate(${rnd(-6, 6)}px,${y2 - y - 3}px) scale(1.6)`, opacity: 0 }], { duration: dur, easing: 'ease-in' });
    }
    function puff(x, y, color, dur, up, grow, op) {
      particle('circle', { class: 'bk-tmp', cx: x, cy: y, r: rnd(7, 12), fill: color, opacity: op || .5 }, over,
        [{ transform: 'translate(0,0) scale(.6)', opacity: 0 }, { opacity: op || .5, offset: .2 }, { transform: `translate(${rnd(-14, 14)}px,${-up}px) scale(${grow || 2.4})`, opacity: 0 }], { duration: dur, easing: 'ease-out' });
    }

    /* ---------- اجرای واکنش ---------- */
    function react(r, cb) {
      stop();
      busy = true; doneCb = cb || null;
      const fx = r.fx || {};
      const hasLiq = view.level > 0 || fx.to || r.right.some(x => isLiquid(R.SP[x.id]));
      if (hasLiq && !view.level) { view = Object.assign({}, view, { level: 90, color: PALE }); setLevel(90, PALE); }
      const condNow = r.cond || cond;
      if (condNow && condNow !== cond) setProps(condNow);
      else setProps(cond);
      const on = animOn();
      const T = on ? 1 : 0;           // بدون انیمیشن همه‌چیز فوری انجام می‌شود
      const end = on ? 4300 : 0;
      const lvTop = () => surfY();
      const baseY = 236;

      if (on && S().sound !== false) {
        if (fx.pop) later(() => APP.fx.play('boom'), 700);
        else if (fx.flame || fx.glow) later(() => APP.fx.play('whoosh'), 500);
        else if (fx.gas) later(() => APP.fx.play('fizz'), 500);
        else later(() => APP.fx.play('drip'), 600);
      }
      // درخشش
      if (fx.glow && on) {
        glow.setAttribute('fill', fx.glow); glow.setAttribute('opacity', 0);
        glow.animate([{ opacity: 0 }, { opacity: .55 }, { opacity: .25 }, { opacity: 0 }], { duration: end - 500, delay: 500, fill: 'forwards' });
      }
      // گرما
      if (fx.hot && on) {
        glass.style.stroke = '#ff8a6a'; glassBody.style.stroke = '#ff8a6a';
        later(() => { glass.style.stroke = ''; glassBody.style.stroke = ''; }, end - 400);
      }
      // الکترودها: حباب از دو الکترود
      if (condNow === 'elec' && on) {
        loop(() => { bubble(96 + rnd(-4, 4), 180, lvTop() + 6, '#cfe8ff', rnd(2, 4), 1300); bubble(144 + rnd(-4, 4), 180, lvTop() + 6, '#d9f2c4', rnd(2, 4), 1300); if (Math.random() < .6) bubble(96 + rnd(-4, 4), 175, lvTop() + 6, '#cfe8ff', rnd(2, 3), 1200); }, 130, 3200);
      }
      // شعله
      if (fx.flame && on) {
        const y = hasLiq ? Math.min(lvTop(), 200) : 232;
        later(() => {
          flame(96, y, fx.flame, .9); flame(122, y + 2, fx.flame, 1.25); flame(148, y, fx.flame, .85);
          const fl = [...over.querySelectorAll('.bk-flame')];
          later(() => fl.forEach(n => n.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' })), end - 1100);
        }, 500);
      }
      // جرقه
      if (fx.spark && on) {
        loop(() => {
          for (let i = 0; i < 7; i++) {
            const a = rnd(-Math.PI, 0), d = rnd(30, 70);
            particle('circle', { class: 'bk-tmp', cx: 120, cy: 215, r: rnd(1.4, 2.6), fill: i % 2 ? '#ffe27a' : '#fff' }, over,
              [{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px)`, opacity: 0 }], { duration: rnd(450, 850) });
          }
        }, 380, 2600);
      }
      // پرتاب/صدا
      if (fx.pop && on) later(() => { svg.classList.add('shake'); later(() => svg.classList.remove('shake'), 700); }, 700);
      // گاز
      if (fx.gas && on) {
        const n = fx.gn || 1;
        if (hasLiq) {
          loop(() => { for (let i = 0; i < n; i++) bubble(rnd(78, 162), rnd(210, 236), lvTop() + 2, '#fff', rnd(2, 5), rnd(1000, 1700)); }, 120, 3300);
          if (lum(fx.gas) < .85) loop(() => puff(rnd(80, 160), 36, fx.gas, 2200, 40, 2.2, .45), 360, 3000);
        } else {
          loop(() => { puff(rnd(86, 156), 52, lum(fx.gas) > .85 ? '#cfd9e0' : fx.gas, 2400, 60, 2.6, .5); }, Math.max(120, 330 / n), 3300);
        }
      }
      // دود
      if (fx.smoke && on) loop(() => puff(rnd(80, 160), 30, fx.smoke, 2600, 70, 3, .55), 200, 3300);
      // بخار (گرما)
      if (fx.hot && !fx.smoke && on) loop(() => puff(rnd(86, 156), hasLiq ? lvTop() : 60, '#e8f1f6', 2400, 50, 2.2, .45), 420, 2800);
      // کف
      if (fx.foam && on) {
        const g = sv('g', { class: 'bk-tmp bk-foam' }, over);
        for (let i = 0; i < 34; i++) {
          const x = rnd(62, 178), c = sv('circle', { cx: x, cy: lvTop() + 2, r: rnd(5, 10), fill: '#fff', 'fill-opacity': .88, stroke: '#cfe0ea', 'stroke-width': .8 }, g);
          const top = rnd(10, 44);
          c.animate([{ transform: 'translateY(0) scale(.3)', opacity: 0 }, { opacity: 1, offset: .15 }, { transform: `translateY(${top - lvTop()}px) scale(1)`, opacity: 1 }], { duration: rnd(1200, 2200), delay: rnd(400, 1400), fill: 'forwards', easing: 'ease-out' });
        }
        later(() => g.animate([{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(30px)' }], { duration: 900, fill: 'forwards' }), end - 1000);
      }
      // رسوب
      if (fx.ppt) {
        const color = fx.ppt;
        if (on) {
          loop(() => { for (let i = 0; i < 3; i++) particle('circle', { class: 'bk-tmp', cx: rnd(70, 170), cy: lvTop() + 4, r: rnd(2, 3.6), fill: color, stroke: outline(color), 'stroke-width': .8 }, fxg, [{ transform: 'translate(0,0)', opacity: 0 }, { opacity: 1, offset: .15 }, { transform: `translate(${rnd(-6, 6)}px,${baseY - lvTop() - rnd(0, 14)}px)`, opacity: 1 }], { duration: rnd(1400, 2200), easing: 'ease-in' }); }, 100, 2600);
        }
      }
      // رنگ و سطح محلول
      later(() => { liq.style.transition = 'fill 2s'; surf.style.transition = 'fill 2s'; }, 0);
      if (fx.to) later(() => setLevel(view.level, fx.to), on ? 900 : 0);
      else if (hasLiq && fx.ppt) later(() => setLevel(view.level, mix(view.color, '#ffffff', .6)), on ? 1500 : 0);
      // ناپدیدشدن واکنش‌دهنده‌های جامد (یا رنگ‌شدن میله در آبکاری)
      const vanish = () => {
        sol.querySelectorAll('.bk-sitem').forEach(g => {
          if (fx.pm) { const s = g.querySelector('.bk-strip'); if (s) { s.style.transition = 'fill 2s'; s.setAttribute('fill', fx.ppt); } }
          else { g.style.transition = 'opacity 2.4s, transform 2.4s'; g.style.opacity = 0; g.style.transformOrigin = '120px 246px'; g.style.transform = 'scale(.7)'; }
        });
      };
      if (on) later(vanish, 900); else vanish();
      // حالت نهایی
      const piles = [];
      if (fx.solid) piles.push({ color: fx.solid, h: 14 });
      if (fx.ppt) piles.push({ color: fx.ppt, h: fx.pm ? 6 : 18 });
      else if (!fx.solid) {
        const s = r.right.map(x => R.SP[x.id]).find(sp => sp && sp.s === 's');
        if (s) piles.push({ color: s.c, h: 12 });
      }
      later(() => {
        const next = { level: view.level, color: fx.to || (fx.ppt ? mix(view.color, '#ffffff', .6) : view.color), solids: fx.pm ? view.solids.map(s => (s.kind === 'strip' ? Object.assign({}, s, { color: fx.ppt }) : s)) : [], piles, wisps: [] };
        if (hasLiq && !next.level) next.level = 90;
        // لایهٔ رسوب با محوشدن آهسته ظاهر شود
        draw(next);
        if (on) { pile.style.opacity = 0; pile.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 700, fill: 'forwards' }); pile.style.opacity = 1; }
        busy = false;
        const cbk = doneCb; doneCb = null; if (cbk) cbk();
      }, end);
      return end;
    }

    return {
      svg, setItems, setProps, react, stop, draw,
      reset() { stop(); items = []; setProps(''); draw(viewFromItems([])); },
      get busy() { return busy; },
      get cond() { return cond; },
      destroy() { stop(); host.innerHTML = ''; }
    };
  }

  APP.beaker = { create, viewFromItems };
})();

/* ===== lab.js ===== */
/* آزمایشگاه واکنش‌ها: میز آزمایش (بشر)، کتابخانهٔ واکنش‌ها، بازی موازنه و پیش‌بینی فراورده */
(function () {
  'use strict';
  const { u } = APP;
  const { $, $$, fa, shuffle, rand, esc } = u;
  const R = APP.rx;
  const S = () => APP.S();
  const isT = () => APP.isTeacher();
  const TOTAL = R.RX.length;

  const LAB = { tab: 'bench', items: [], cond: '', cat: 'm', q: '', res: null, bk: null };
  const LIB = { type: '', grade: '', q: '' };
  const BAL = { r: null, c: null, done: false, tries: 0, grade: '', shown: false };
  const PRED = { r: null, opts: [], picked: -1, n: 0, ok: 0 };

  const STATE_IC = { s: '◼️', l: '💧', aq: '🧪', g: '💨' };
  const STATE_FA = { s: 'جامد', l: 'مایع', aq: 'محلول', g: 'گاز' };
  const found = () => S().rxn || (S().rxn = {});
  const countFound = () => Object.keys(found()).length;
  const isOpen = r => isT() || !!found()[r.key];
  const nm = id => R.nameOf(id);
  const fm = id => R.fmtF(R.fOf(id) || '');

  /* ---------- پیداکردن واکنش ---------- */
  function judge(items, cond) {
    if (!items.length) return { kind: 'empty' };
    const set = new Set(items);
    const cands = R.RX.filter(r => r.left.every(x => set.has(x.id)));
    const full = cands.filter(r => r.cats.every(c => set.has(c)));
    const okc = full.filter(r => !r.cond || r.cond === cond);
    if (okc.length) {
      okc.sort((a, b) => (b.cond === cond ? 1 : 0) - (a.cond === cond ? 1 : 0) || (b.left.length + b.cats.length) - (a.left.length + a.cats.length));
      const r = okc[0];
      const used = new Set(r.left.map(x => x.id).concat(r.cats));
      return { kind: 'ok', r, spectators: items.filter(x => !used.has(x)) };
    }
    const needCond = full.find(r => r.cond && r.cond !== cond);
    if (needCond) return { kind: 'cond', r: needCond };
    const needCat = cands.find(r => r.cats.length);
    if (needCat) return { kind: 'cat', r: needCat, miss: needCat.cats.filter(c => !set.has(c)) };
    for (let i = 0; i < items.length; i++) for (let j = i + 1; j < items.length; j++) {
      const k1 = items[i] + '+' + items[j], k2 = items[j] + '+' + items[i];
      const hit = R.NOREACT.find(([k]) => k === k1 || k === k2);
      if (hit) return { kind: 'none', why: hit[1], pair: [items[i], items[j]] };
    }
    return { kind: items.length === 1 ? 'single' : 'unknown' };
  }

  const condName = c => (R.CONDS[c] ? R.CONDS[c].ic + ' ' + R.CONDS[c].t : '');

  /* ---------- کارت نتیجه ---------- */
  function atomTable(r) {
    const L = R.sideAtoms(r.left), Rr = R.sideAtoms(r.right);
    const ks = Object.keys(L);
    return `<div class="atom-tab">${ks.map(k => `<span class="atom-chip ok"><b>${k}</b> ${fa(L[k])} = ${fa(Rr[k])}</span>`).join('')}</div>`;
  }
  function productsHTML(r) {
    return r.right.map(x => {
      const sp = R.SP[x.id] || {};
      return `<span class="prod"><i style="background:${sp.c || '#ccc'}"></i>${esc(nm(x.id))} <small>${STATE_IC[sp.s] || ''} ${STATE_FA[sp.s] || ''}</small></span>`;
    }).join('');
  }
  function resultHTML(r, o) {
    o = o || {};
    const ty = R.TYPES[r.t];
    return `
      <div class="rx-result card stack" style="gap:10px">
        <div class="row" style="flex-wrap:wrap">
          <span class="badge">${ty.ic} ${ty.t}</span><span class="badge">پایهٔ ${fa(r.g)}</span>
          ${o.isNew ? '<span class="badge new">✨ کشف جدید</span>' : ''}
          ${r.cond ? `<span class="badge">${condName(r.cond)}</span>` : ''}
          ${r.cats.length ? `<span class="badge">کاتالیزگر: ${r.cats.map(c => R.fmtF(R.fOf(c) || nm(c))).join('، ')}</span>` : ''}
        </div>
        <div class="rx-bigeq">${R.eqHTML(r)}</div>
        <div class="rx-names small muted">${r.left.map(x => esc(nm(x.id))).join(' + ')} ← ${r.right.map(x => esc(nm(x.id))).join(' + ')}</div>
        <div class="rx-obs">👀 ${esc(r.obs)}</div>
        <div class="prods">${productsHTML(r)}</div>
        ${r.nobal ? '' : `<details class="rx-atoms"><summary>⚖️ چرا موازنه است؟ شمار اتم‌ها</summary>${atomTable(r)}<p class="small muted">شمار اتم هر عنصر در دو طرف معادله یکسان است (پایستگی جرم).</p></details>`}
        <p class="small muted">${ty.ic} ${ty.d}</p>
        ${o.extra || ''}
      </div>`;
  }
  APP.lab = { judge, resultHTML, create: (h, o) => APP.beaker.create(h, o), isOpen };

  /* ---------- شروع واکنش در میز آزمایش ---------- */
  function award(r) {
    const f = found();
    if (isT() || f[r.key]) return false;
    f[r.key] = Date.now(); APP.addXP(10); APP.touchStreak(); APP.save();
    return true;
  }
  function msgCard(icon, title, body, tone) {
    return `<div class="rx-result card stack rx-msg ${tone || ''}" style="gap:6px"><div class="rx-msg-t"><span>${icon}</span> ${title}</div><p>${body}</p></div>`;
  }
  function runBench() {
    const bk = LAB.bk; if (!bk) return;
    if (bk.busy) return;
    const j = judge(LAB.items, LAB.cond);
    const out = $('#lab-res');
    const castBtn = '';
    if (j.kind === 'ok') {
      const first = award(j.r);
      const card = $('.lab-card'); if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      bk.react(j.r, () => {
        if (first) { APP.fx.play('build'); APP.fx.confetti({ n: 40 }); APP.toast(`🎉 واکنش تازه کشف شد! (${fa(countFound())} از ${fa(TOTAL)})`); }
        const o2 = $('#lab-res'); if (o2) o2.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      LAB.res = { r: j.r, isNew: first };
      const sp = j.spectators.length ? `<p class="small muted">⚪ این مواد در واکنش شرکت نکردند: ${j.spectators.map(x => esc(nm(x))).join('، ')}</p>` : '';
      out.innerHTML = resultHTML(j.r, { isNew: first, extra: sp + castBtnHTML(j.r) });
      refreshHead();
    } else {
      bk.stop(); APP.fx.play('bad'); LAB.res = null;
      const m = explain(j);
      out.innerHTML = msgCard(m.icon, m.title, m.body, m.tone);
    }
    castSync(true);
  }
  // متن توضیح برای نتیجه‌های «واکنش نداد/ناقص» (هم در آزمایشگاه و هم روی نمایشگر کلاس)
  function explain(j) {
    if (j.kind === 'empty') return { icon: '🫙', title: 'بشر خالی است', body: 'از قفسه چند ماده انتخاب کنید و در بشر بریزید.' };
    if (j.kind === 'cond') return { icon: '💡', title: 'نزدیک شدید!', body: `این مواد می‌توانند با هم واکنش بدهند، ولی برای شروع‌شدن به یک شرط نیاز دارند: <b>${condName(j.r.cond)}</b>.`, tone: 'warn' };
    if (j.kind === 'cat') return { icon: '💡', title: 'نزدیک شدید!', body: `برای انجام این واکنش یک ماده برای تندکردن آن لازم است (کاتالیزگر): <b>${j.miss.map(c => esc(nm(c))).join('، ')}</b>. کاتالیزگر خودش مصرف نمی‌شود.`, tone: 'warn' };
    if (j.kind === 'none') return { icon: '🚫', title: 'واکنشی رخ نداد', body: esc(j.why), tone: 'bad' };
    if (j.kind === 'single') return { icon: '🤔', title: 'تغییری دیده نشد', body: 'این ماده به‌تنهایی تغییری نمی‌کند. یک ماده دیگر یا یک شرط (مثل گرما) هم اضافه کنید.' };
    return { icon: '🤔', title: 'واکنشی دیده نشد', body: 'با این ترکیب واکنش آشکاری رخ نمی‌دهد (یا در کتابخانهٔ این برنامه نیست). مواد یا شرط دیگری امتحان کنید.' };
  }
  // همگام‌سازی با نمایشگر کلاس (فقط برای استادِ متصل)
  let runN = 0;
  function castSync(run) {
    if (!isT() || !APP.cast || !APP.cast.active()) return;
    if (run) runN++;
    APP.cast.syncBench(LAB.items.slice(), LAB.cond, runN);
  }
  const castBtnHTML = r => (isT() ? `<button class="btn sm" data-act="cast-rx" data-k="${esc(r.key)}">📺 نمایش روی تلویزیون/پروژکتور</button>` : '');

  /* ---------- نمای آزمایشگاه ---------- */
  function tabsHTML() {
    const t = [['bench', '🧪', 'میز آزمایش'], ['lib', '📚', 'کتابخانه'], ['bal', '⚖️', 'موازنه'], ['pred', '🎯', 'پیش‌بینی']];
    return `<div class="lab-tabs" role="tablist">${t.map(([k, ic, n]) => `<button role="tab" data-act="lab-tab" data-v="${k}" aria-selected="${LAB.tab === k}"><span>${ic}</span>${n}</button>`).join('')}</div>`;
  }
  function headHTML() {
    return `<div class="row"><button class="btn sm ghost" data-go="#/${isT() ? 'tools' : 'home'}">→ ${isT() ? 'ابزار تدریس' : 'جدول'}</button>
      <h2 class="grow" style="font-size:20px;font-weight:800">⚗️ آزمایشگاه واکنش‌ها</h2>
      <span class="badge" id="lab-badge">${isT() ? fa(TOTAL) + ' واکنش' : fa(countFound()) + ' از ' + fa(TOTAL)}</span></div>`;
  }
  function refreshHead() { const b = $('#lab-badge'); if (b && !isT()) b.textContent = fa(countFound()) + ' از ' + fa(TOTAL); }

  APP.views.lab = function () {
    if (LAB.bk) { LAB.bk.destroy(); LAB.bk = null; }
    let body = '';
    if (LAB.tab === 'bench') body = benchHTML();
    else if (LAB.tab === 'lib') body = libHTML();
    else if (LAB.tab === 'bal') body = balHTML();
    else body = predHTML();
    APP.onLeave = () => { if (LAB.bk) { LAB.bk.destroy(); LAB.bk = null; } };
    APP.afterRender = () => {
      if (LAB.tab === 'bench') {
        const h = $('#bk-host');
        if (h) { LAB.bk = APP.beaker.create(h); LAB.bk.setItems(LAB.items); LAB.bk.setProps(LAB.cond); }
      }
    };
    return `<div class="stack">${headHTML()}${tabsHTML()}${body}</div>`;
  };
  APP.onLeaveLab = () => { if (LAB.bk) { LAB.bk.destroy(); LAB.bk = null; } };

  APP.acts['lab-tab'] = t => { LAB.tab = t.dataset.v; APP.render(); };

  /* ----- میز آزمایش ----- */
  const CATS_ORDER = ['m', 'n', 'x', 'o', 'a', 'b', 's', 'c'];
  function shelfHTML() {
    const q = LAB.q.trim().toLowerCase();
    const list = R.SPECIES_LIST.filter(sp => (q ? (sp.n.includes(LAB.q.trim()) || sp.f.toLowerCase().includes(q) || sp.id.toLowerCase().includes(q)) : sp.g === LAB.cat));
    return list.map(sp => {
      const on = LAB.items.includes(sp.id);
      return `<button class="sub-tile" data-act="lab-add" data-id="${esc(sp.id)}" aria-pressed="${on}"><i style="background:${sp.c}"></i><b class="sym">${R.fmtF(sp.f || sp.n)}</b><span>${esc(sp.n)}</span><em>${STATE_IC[sp.s]}</em></button>`;
    }).join('') || '<p class="muted small">ماده‌ای پیدا نشد.</p>';
  }
  function itemsHTML() {
    if (!LAB.items.length) return '<span class="muted small">بشر خالی است — از قفسه ماده بردارید.</span>';
    return LAB.items.map(id => `<button class="item-chip" data-act="lab-rm" data-id="${esc(id)}" aria-label="برداشتن ${esc(nm(id))}"><i style="background:${R.SP[id].c}"></i>${esc(nm(id))} <b>✕</b></button>`).join('');
  }
  function benchHTML() {
    const cats = CATS_ORDER.map(k => `<button class="chip" data-act="lab-cat" data-v="${k}" aria-pressed="${!LAB.q && LAB.cat === k}">${R.GROUPS[k]}</button>`).join('');
    const conds = [['', '❌ بدون شرط']].concat(Object.keys(R.CONDS).map(k => [k, condName(k)]));
    const casting = isT() && APP.cast && APP.cast.active() ? '<div class="cast-banner">📺 بشر همین حالا روی صفحهٔ نمایش کلاس دیده می‌شود. <button class="btn sm" data-go="#/cast">کنترل نمایش</button></div>' : '';
    return `
      ${casting}
      <p class="small muted">مواد را در بشر بریزید (تا ۴ ماده)، در صورت لزوم گرما یا شرط دیگر را بگذارید و «واکنش بده!» را بزنید. هر واکنش تازه امتیاز دارد.</p>
      <div class="card lab-card">
        <div id="bk-host" class="bk-host"></div>
        <div class="item-row" id="lab-items">${itemsHTML()}</div>
        <div class="chips wrap" id="lab-conds" style="justify-content:center">${conds.map(([k, t]) => `<button class="chip" data-act="lab-cond" data-v="${k}" aria-pressed="${LAB.cond === k}">${t}</button>`).join('')}</div>
        <div class="row" style="margin-top:6px"><button class="btn primary grow" data-act="lab-go" style="min-height:50px;font-size:18px">▶ واکنش بده!</button><button class="btn" data-act="lab-clear">🗑️ از نو</button></div>
      </div>
      <div id="lab-res">${LAB.res ? resultHTML(LAB.res.r, { extra: castBtnHTML(LAB.res.r) }) : ''}</div>
      <div class="card stack" style="gap:8px">
        <div class="section-title" style="margin:0">🧴 قفسهٔ مواد</div>
        <input id="lab-search" type="search" class="selectable" placeholder="جست‌وجوی ماده: نام یا فرمول…" value="${esc(LAB.q)}" autocomplete="off">
        <div class="chips" id="lab-cats">${cats}</div>
        <div class="shelf" id="lab-shelf">${shelfHTML()}</div>
      </div>`;
  }
  function syncBench() {
    const it = $('#lab-items'); if (it) it.innerHTML = itemsHTML();
    const sh = $('#lab-shelf'); if (sh) sh.innerHTML = shelfHTML();
    $$('#lab-conds [data-act="lab-cond"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === LAB.cond)));
    $$('#lab-cats [data-act="lab-cat"]').forEach(b => b.setAttribute('aria-pressed', String(!LAB.q && b.dataset.v === LAB.cat)));
    if (LAB.bk) { LAB.bk.setItems(LAB.items); LAB.bk.setProps(LAB.cond); }
  }
  APP.acts['lab-add'] = t => {
    const id = t.dataset.id, i = LAB.items.indexOf(id);
    if (i >= 0) LAB.items.splice(i, 1);
    else { if (LAB.items.length >= 4) { APP.toast('بشر فقط جای ۴ ماده دارد'); return; } LAB.items.push(id); }
    const sp = R.SP[id]; APP.fx.play(sp && sp.s === 'g' ? 'tap' : 'drip');
    LAB.res = null; const o = $('#lab-res'); if (o) o.innerHTML = '';
    syncBench(); castSync();
  };
  APP.acts['lab-rm'] = t => { LAB.items = LAB.items.filter(x => x !== t.dataset.id); LAB.res = null; const o = $('#lab-res'); if (o) o.innerHTML = ''; syncBench(); castSync(); };
  APP.acts['lab-cat'] = t => { LAB.cat = t.dataset.v; LAB.q = ''; const s = $('#lab-search'); if (s) s.value = ''; syncBench(); };
  APP.acts['lab-cond'] = t => { LAB.cond = t.dataset.v; syncBench(); castSync(); };
  APP.acts['lab-clear'] = () => { LAB.items = []; LAB.cond = ''; LAB.res = null; if (LAB.bk) LAB.bk.reset(); const o = $('#lab-res'); if (o) o.innerHTML = ''; syncBench(); castSync(); };
  APP.acts['lab-go'] = () => runBench();
  document.addEventListener('input', ev => {
    if (ev.target.id === 'lab-search') { LAB.q = ev.target.value; const sh = $('#lab-shelf'); if (sh) sh.innerHTML = shelfHTML(); $$('#lab-cats [data-act="lab-cat"]').forEach(b => b.setAttribute('aria-pressed', String(!LAB.q && b.dataset.v === LAB.cat))); }
    else if (ev.target.id === 'lib-search') { LIB.q = ev.target.value; const l = $('#lib-list'); if (l) l.innerHTML = libListHTML(); }
  });

  // از کتابخانه یا آزمون: مواد را در بشر بگذار
  function loadInBench(r, withAll) {
    LAB.tab = 'bench';
    LAB.items = r.left.map(x => x.id).concat(withAll ? r.cats : []).slice(0, 4);
    LAB.cond = withAll ? r.cond : '';
    LAB.res = null;
    APP.closeSheet();
    if (APP.route().name === 'lab') APP.render(); else location.hash = '#/lab';
  }

  /* ----- کتابخانه ----- */
  function libListHTML() {
    const q = LIB.q.trim().toLowerCase();
    let n = 0;
    const html = R.RX.map((r, i) => {
      if (LIB.type && r.t !== LIB.type) return '';
      if (LIB.grade && r.g !== +LIB.grade) return '';
      const open = isOpen(r);
      if (q) {
        const hay = (r.left.concat(r.right)).map(x => nm(x.id) + ' ' + R.fOf(x.id)).join(' ').toLowerCase();
        const hayL = r.left.map(x => nm(x.id) + ' ' + R.fOf(x.id)).join(' ').toLowerCase();
        if (!(open ? hay : hayL).includes(q)) return '';
      }
      n++;
      const ty = R.TYPES[r.t];
      const eq = open ? R.eqHTML(r) : `<span class="rx-eq" dir="ltr">${r.left.map(x => `<span class="rx-t">${R.fmtF(R.fOf(x.id))}</span>`).join(' + ')} <span class="rx-arrow"><b>→</b></span> <span class="rx-t">❓</span></span>`;
      return `<button class="lib-row ${open ? 'open' : 'lock'}" data-act="lib-open" data-i="${i}">
        <span class="lib-ic">${open ? ty.ic : '🔒'}</span>
        <span class="lib-main">${eq}<span class="small muted lib-names">${r.left.map(x => esc(nm(x.id))).join(' + ')}</span></span>
        <span class="badge">${fa(r.g)}</span></button>`;
    }).join('');
    return (n ? `<p class="small muted">${fa(n)} واکنش</p>` : '') + (html || '<p class="muted">واکنشی با این فیلتر پیدا نشد.</p>');
  }
  function libHTML() {
    const types = Object.keys(R.TYPES).map(k => `<button class="chip" data-act="lib-type" data-v="${k}" aria-pressed="${LIB.type === k}">${R.TYPES[k].ic} ${R.TYPES[k].t}</button>`).join('');
    const grades = [8, 9, 10, 11, 12].map(g => `<button class="chip" data-act="lib-grade" data-v="${g}" aria-pressed="${+LIB.grade === g}">پایهٔ ${fa(g)}</button>`).join('');
    return `
      <p class="small muted">${isT() ? 'همهٔ واکنش‌ها باز است؛ روی هر کدام بزنید تا جزئیات را ببینید یا در بشر اجرا کنید.' : '🔒 واکنش‌های قفل‌شده را در «میز آزمایش» کشف کنید؛ مواد اولیه‌شان برایتان نوشته شده و فراورده‌ها را باید خودتان پیدا کنید!'}</p>
      <input id="lib-search" type="search" class="selectable" placeholder="جست‌وجو: نام یا فرمول ماده…" value="${esc(LIB.q)}" autocomplete="off">
      <div class="chips" id="lib-types"><button class="chip" data-act="lib-type" data-v="" aria-pressed="${!LIB.type}">همه</button>${types}</div>
      <div class="chips" id="lib-grades"><button class="chip" data-act="lib-grade" data-v="" aria-pressed="${!LIB.grade}">همهٔ پایه‌ها</button>${grades}</div>
      <div class="lib-list" id="lib-list">${libListHTML()}</div>`;
  }
  function syncLib() {
    $$('#lib-types [data-act="lib-type"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === LIB.type)));
    $$('#lib-grades [data-act="lib-grade"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === String(LIB.grade))));
    const l = $('#lib-list'); if (l) l.innerHTML = libListHTML();
  }
  APP.acts['lib-type'] = t => { LIB.type = t.dataset.v; syncLib(); };
  APP.acts['lib-grade'] = t => { LIB.grade = t.dataset.v; syncLib(); };
  APP.acts['lib-open'] = t => {
    const r = R.RX[+t.dataset.i]; if (!r) return;
    const open = isOpen(r);
    const body = open
      ? resultHTML(r, { extra: `<div class="row"><button class="btn primary grow" data-act="lib-run" data-i="${t.dataset.i}">🧪 اجرا در بشر</button>${castBtnHTML(r)}</div>` })
      : `<div class="card stack" style="gap:10px"><div class="rx-bigeq">${R.eqHTML(Object.assign({}, r, { right: [], cats: [], cond: '' })).replace('<b>→</b>', '<b>→ ❓</b>')}</div>
          <p>این واکنش را هنوز کشف نکرده‌اید. موادش: <b>${r.left.map(x => esc(nm(x.id))).join(' + ')}</b>${r.cats.length ? '؛ و یک ماده کمکی (کاتالیزگر) هم لازم است' : ''}.</p>
          <p class="small muted">${R.TYPES[r.t].ic} نوع واکنش: ${R.TYPES[r.t].t} — پایهٔ ${fa(r.g)}. در بشر بریزید و ببینید چه می‌شود!</p>
          <button class="btn primary block" data-act="lib-run" data-i="${t.dataset.i}">🧪 امتحان در بشر</button></div>`;

  function balPool() {

/* سازندهٔ کد QR (بدون کتابخانه و بدون اینترنت): حالت بایت، سطح تصحیح M، نسخهٔ ۱ تا ۱۰ (تا ۲۱۳ بایت).

(function () {

    1: [10, [[1, 16]]], 2: [16, [[1, 28]]], 3: [26, [[1, 44]]], 4: [18, [[2, 32]]], 5: [24, [[2, 43]]],
    6: [16, [[4, 27]]], 7: [18, [[4, 31]]], 8: [22, [[2, 38], [2, 39]]], 9: [22, [[3, 36], [2, 37]]], 10: [26, [[4, 43], [1, 44]]]

      const ng = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= mul(g[j], EXP[i]); }
      g = ng;
    }

    put(4, 4); put(bytes.length, v < 10 ? 8 : 16);
    bytes.forEach(b => put(b, 8));

      const saveM = m.map(r => r.slice());

        if (m.s && m.s.sid) D.sid = m.s.sid;
        if (s.n && s.n <= D.lastN) return;
        D.lastN = s.n || D.lastN;
        D.peerSeen = Date.now(); stage.show(s); upd();
      } else if (m.k === 'hi' || m.k === 'ping') {
        D.peerSeen = Date.now(); D.link.send({ k: m.k === 'hi' ? 'ack' : 'pong' }); upd();
      }
    }, () => upd());
    if (window.opener && window.opener !== window) D.link.attach(window.opener);
    stage.show({ scene: 'wait' });
    D.link.send({ k: 'hi' });
    D.hb = setInterval(() => { upd(); if (Date.now() - D.peerSeen > 20000) D.link.send({ k: 'hi' }); }, 8000);
    D.onRz = () => stage.resize(); window.addEventListener('resize', D.onRz);
    D.onKey = e => { if (e.key === 'f' || e.key === 'F') APP.acts['d-fs'](); };
    document.addEventListener('keydown', D.onKey);
    wakeLock(); upd();
    // اشاره‌گر ماوس بعد از چند ثانیه پنهان شود
    let mt; const rootEl = $('#display-root');
    const wake = () => { rootEl.classList.remove('idle'); clearTimeout(mt); mt = setTimeout(() => rootEl && rootEl.classList.add('idle'), 3000); };
    rootEl.addEventListener('pointermove', wake); wake();
  }
  APP.acts['d-fs'] = () => {
    const d = document;
    if (d.fullscreenElement) d.exitFullscreen();
    else if (d.documentElement.requestFullscreen) d.documentElement.requestFullscreen().catch(() => APP.toast('مرورگر اجازهٔ تمام‌صفحه نداد'));
  };

  /* =====================================================================
     کنترل (گوشی یا لپ‌تاپ استاد)
     ===================================================================== */
  const C = { link: null, code: '', st: { relay: 'off', bc: 'off', wins: 0 }, peerSeen: 0, state: { scene: 'table', spec: '', cover: false, mass: false, names: true }, n: 0, sid: rid(), stage: null, tab: 'table', q: null, compQ: '', rxQ: '', rxType: '', timer: { total: 300, left: 300, running: false, at: 0 }, text: '', hb: 0, sendT: 0, win: null };
  const connected = () => !!C.link && Date.now() - C.peerSeen < 45000;
  APP.cast = {
    active: () => !!C.link,
    connected,
    syncBench(items, cond, run) { C.state = { scene: 'bench', items, cond, run }; push(); },
    showReaction(key) { C.state = { scene: 'reaction', k: key, run: 0 }; C.tab = 'reaction'; push(); }
  };

  function push(now) {
    C.n = Date.now() * 1000 % 1e12 + (++C.n % 1000);  // افزایشی و یکتا
    const s = Object.assign({}, C.state, { n: C.n, sid: C.sid });
    if (C.stage) C.stage.show(s);
    saveState();
    if (!C.link) return;
    clearTimeout(C.sendT);
    const go = () => C.link && C.link.send({ k: 'st', s });
    if (now) go(); else C.sendT = setTimeout(go, 90);
  }
  function saveState() { try { sessionStorage.setItem('sb.cast', JSON.stringify({ code: C.code, state: C.state, tab: C.tab, live: !!C.link })); } catch (e) { /* */ } }
  function loadState() {
    try { const j = JSON.parse(sessionStorage.getItem('sb.cast') || 'null'); if (j) { C.state = cleanState(j.state); C.tab = j.tab || 'table'; if (okCode(j.code || '')) C.code = j.code; } } catch (e) { /* */ }
  }

  function connect(code) {
    code = normCode(code);
    if (!okCode(code)) { APP.toast('کد باید ۸ حرف باشد (مثل ABCD-2345)'); return false; }
    disconnect(true);
    C.code = code; C.peerSeen = 0;
    C.link = Link(code, 'c', m => {
      C.peerSeen = Date.now();
      if (m.k === 'hi') { C.link.send({ k: 'ack' }); push(true); }
      else if (m.k === 'ack') push(true);
      updStat();
    }, st => { C.st = st; updStat(); });
    if (C.win && !C.win.closed) C.link.attach(C.win);
    C.link.send({ k: 'hi' });
    clearInterval(C.hb); C.hb = setInterval(() => { if (C.link) { C.link.send({ k: 'ping' }); if (Date.now() - C.peerSeen > 30000) C.link.send({ k: 'hi' }); updStat(); } }, 10000);
    saveState(); return true;
  }
  function disconnect(silent) {
    if (C.link) { try { C.link.close(); } catch (e) { /* */ } C.link = null; }
    clearInterval(C.hb); C.peerSeen = 0;
    if (!silent) { updStat(); saveState(); }
  }
  function updStat() {
    const el = $('#cast-stat'); if (!el) return;
    const ok = connected();
    const rel = C.st.relay === 'ok' ? 'رله ✓' : C.st.relay === 'err' ? 'رله ✗' : C.st.relay === 'try' ? 'رله …' : 'رله خاموش';
    el.className = 'cast-stat ' + (ok ? 'ok' : C.link ? 'wait' : 'off');
    el.innerHTML = C.link
      ? `<b>${ok ? '🟢 به صفحهٔ نمایش وصل است' : '🟡 منتظر صفحهٔ نمایش…'}</b><span dir="ltr" class="cast-code">${prettyCode(C.code)}</span><small>${rel}${C.st.wins ? ' · پنجرهٔ مستقیم ✓' : ''}</small>`
      : '<b>🔴 وصل نیست</b>';
  }

  /* ---------- نمای کنترل ---------- */
  const TABS = [['table', '🧪', 'جدول'], ['element', '⚛️', 'عنصر'], ['compound', '🔬', 'ترکیب'], ['reaction', '⚗️', 'واکنش'], ['bench', '🧫', 'بشر زنده'], ['q', '❓', 'سؤال'], ['timer', '⏱', 'زمان'], ['text', '💬', 'متن'], ['blank', '⬛', 'خاموش']];

  APP.views.cast = function (r) {
    if (!C.code) loadState();
    const rc = r && r.id ? normCode(r.id) : '';
    if (okCode(rc)) {   // آمده از QR یا لینک: خودکار وصل شو و آدرس را تمیز کن
      setTimeout(() => {
        if (!C.link || C.code !== rc) connect(rc);
        C.showLink = false;
        try { history.replaceState(null, '', '#/cast'); } catch (e) { /* */ }
        APP.render(); setTimeout(updStat, 60);
      }, 0);
    }
    APP.onLeave = () => { if (C.stage) { C.stage.destroy(); C.stage = null; } };
    APP.afterRender = () => {
      const p = $('#cast-prev');
      if (p) { C.stage = Stage(p, {}); C.stage.show(Object.assign({}, C.state, { n: 0 })); }
      updStat(); mountTab();
    };
    const conn = C.link ? `
        <div class="row"><button class="btn sm" data-act="cast-disc">قطع ارتباط</button><button class="btn sm" data-act="cast-open-win">🖥️ صفحهٔ نمایش در همین دستگاه</button></div>`
      : `
        <ol class="small cast-steps"><li>روی دستگاهی که به تلویزیون/پروژکتور وصل است همین برنامه را باز کنید و در صفحهٔ اول «این دستگاه تلویزیون/پروژکتور است» را بزنید.</li>
        <li>کد ۸ حرفی که می‌بینید را اینجا بنویسید:</li></ol>
        <div class="row"><input id="cast-code" class="selectable" dir="ltr" placeholder="ABCD-2345" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${C.code ? prettyCode(C.code) : ''}" style="flex:1;text-align:center;letter-spacing:2px;font-weight:800"><button class="btn primary" data-act="cast-conn">اتصال</button></div>
        <div class="row"><button class="btn sm grow" data-act="cast-open-win">🖥️ یا: صفحهٔ نمایش را در یک پنجرهٔ جدید همین دستگاه باز کن</button></div>`;
    const linkBox = C.code && C.showLink ? linkHTML(C.code) : '';
    return `
      <div class="stack">
        <div class="row"><button class="btn sm ghost" data-go="#/tools">→ ابزار تدریس</button><h2 class="grow" style="font-size:20px;font-weight:800">📺 نمایش روی تلویزیون</h2></div>
        <div class="card stack" style="gap:10px">
          <div id="cast-stat" class="cast-stat"></div>
          ${conn}
          <div class="cast-link"><button class="btn accent block" data-act="cast-mklink">🔗 ساخت لینک برای تلویزیون</button>${linkBox}</div>
          <details class="small"><summary>⚙️ تنظیم پیشرفته</summary>
            <p class="muted">پیام‌ها از طریق یک سرور رلهٔ عمومی (پیش‌فرض: ntfy.sh) بین دو دستگاه می‌رسند؛ فقط وضعیت نمایش (مثلاً «گروه ۱۷») ارسال می‌شود و کد ۸ حرفی مثل رمز اتاق است. اگر اینترنت مدرسه این سرویس را نمی‌پذیرد، آدرس سرور ntfy خودتان را بنویسید یا «فقط همین دستگاه» را روشن کنید.</p>
            <input id="cast-relay" class="selectable" dir="ltr" value="${esc(S().castRelay || DEFAULT_RELAY)}" placeholder="${DEFAULT_RELAY}">
            <div class="chips wrap" style="margin-top:6px"><button class="chip" data-act="cast-local" aria-pressed="${!!S().castLocalOnly}">فقط همین دستگاه (بدون اینترنت)</button><button class="chip" data-act="cast-relay-save">ذخیرهٔ آدرس رله</button></div>
          </details>
        </div>
        <div class="stage-wrap"><div class="stage" id="cast-prev"></div><div class="small muted center">پیش‌نمایشِ آنچه روی صفحهٔ نمایش دیده می‌شود</div></div>
        <div class="cast-tabs" id="cast-tabs">${TABS.map(([k, ic, n]) => `<button data-act="cast-tab" data-v="${k}" aria-selected="${C.tab === k}"><span>${ic}</span>${n}</button>`).join('')}</div>
        <div id="cast-ctl" class="card stack" style="gap:10px"></div>
      </div>`;
  };

  function mountTab() {
    const el = $('#cast-ctl'); if (!el) return;
    $$('#cast-tabs [data-act="cast-tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === C.tab)));
    const k = C.tab;
    if (k === 'table') el.innerHTML = tableCtl();
    else if (k === 'element') { el.innerHTML = elementCtl(); const m = $('#cast-mini'); if (m) m.addEventListener('click', ev => { const b = ev.target.closest('.el'); if (b) { ev.stopPropagation(); pickEl(+b.dataset.z); } }, true); }
    else if (k === 'compound') { el.innerHTML = compCtl(); }
    else if (k === 'reaction') { el.innerHTML = rxCtl(); }
    else if (k === 'bench') el.innerHTML = benchCtl();
    else if (k === 'q') el.innerHTML = qCtl();
    else if (k === 'timer') el.innerHTML = timerCtl();
    else if (k === 'text') el.innerHTML = textCtl();
    else el.innerHTML = '<p class="muted">صفحهٔ نمایش سیاه می‌شود؛ مناسب وقتی می‌خواهید توجه دانش‌آموزان به شما باشد.</p><button class="btn primary block" data-act="cast-blank">⬛ خاموش‌کردن صفحه</button>';
  }
  APP.acts['cast-tab'] = t => { C.tab = t.dataset.v; mountTab(); const s = C.state.scene; if (C.tab === 'blank' || C.tab === s) return; };

  /* جدول */
  function tableCtl() {
    const st = C.state.scene === 'table' ? C.state : { spec: '', cover: false, mass: false, names: true };
    const chips = (APP.BOARD_CHIPS || []).map(([sp, t]) => `<button class="chip" data-act="cast-spec" data-v="${sp}" aria-pressed="${st.spec === sp}">${t}</button>`).join('');
    const grp = Array.from({ length: 18 }, (_, i) => i + 1).map(g => `<button class="chip" data-act="cast-spec" data-v="group:${g}" aria-pressed="${st.spec === 'group:' + g}">${fa(g)}</button>`).join('');
    const per = Array.from({ length: 7 }, (_, i) => i + 1).map(g => `<button class="chip" data-act="cast-spec" data-v="period:${g}" aria-pressed="${st.spec === 'period:' + g}">${fa(g)}</button>`).join('');
    return `<button class="btn primary block" data-act="cast-table">🧪 نمایش جدول روی صفحه</button>
      <div class="chips wrap"><button class="chip" data-act="cast-spec" data-v="" aria-pressed="${!st.spec}">همه</button>${chips}</div>
      <div><div class="small muted">گروه</div><div class="chips">${grp}</div></div>
      <div><div class="small muted">دوره</div><div class="chips">${per}</div></div>
      <div class="chips wrap"><button class="chip" data-act="cast-tog" data-k="names" aria-pressed="${st.names !== false}">نام عنصر</button><button class="chip" data-act="cast-tog" data-k="mass" aria-pressed="${!!st.mass}">جرم</button><button class="chip" data-act="cast-tog" data-k="cover" aria-pressed="${!!st.cover}">🙈 پنهان‌کردن نام‌ها</button></div>`;
  }
  function curTable() { return C.state.scene === 'table' ? Object.assign({}, C.state) : { scene: 'table', spec: '', cover: false, mass: false, names: true }; }
  APP.acts['cast-table'] = () => { C.state = curTable(); push(true); mountTab(); };
  APP.acts['cast-spec'] = t => { const s = curTable(); s.spec = s.spec === t.dataset.v ? '' : t.dataset.v; C.state = s; push(); mountTab(); };
  APP.acts['cast-tog'] = t => { const s = curTable(); const k = t.dataset.k; s[k] = k === 'names' ? !(s.names !== false) : !s[k]; C.state = s; push(); mountTab(); };

  /* عنصر */
  function elementCtl() {
    const cell = Math.max(12, Math.min(26, Math.floor((Math.min(window.innerWidth, 560) - 70) / 18.6)));
    return `<p class="small muted">روی یک عنصر بزنید تا کاملش روی صفحه نمایش داده شود.</p>
      <div class="pt-scroll" id="cast-mini">${APP.tableHTML({ mode: 'static', cell })}</div>
      <div class="row"><button class="btn grow" data-act="cast-el-step" data-d="-1">→ قبلی</button><span class="badge" id="cast-elname">${C.state.scene === 'element' ? esc(E[C.state.z - 1].fa) + ' (' + E[C.state.z - 1].sym + ')' : '—'}</span><button class="btn grow" data-act="cast-el-step" data-d="1">بعدی ←</button></div>`;
  }
  function pickEl(z) { C.state = { scene: 'element', z }; push(true); const n = $('#cast-elname'); if (n) n.textContent = E[z - 1].fa + ' (' + E[z - 1].sym + ')'; APP.fx.play('el', z); }
  APP.acts['cast-el-step'] = t => { const z = C.state.scene === 'element' ? C.state.z : 0; pickEl(Math.max(1, Math.min(118, z + +t.dataset.d || 1))); };

  /* ترکیب */
  function compCtl() {
    const q = C.compQ.trim().toLowerCase();
    const list = APP.compounds.ALL.map((c, i) => [c, i]).filter(([c]) => !q || c.n.includes(C.compQ.trim()) || c.f.toLowerCase().includes(q));
    return `<input id="cast-cq" type="search" class="selectable" placeholder="جست‌وجوی ترکیب: نام یا فرمول" value="${esc(C.compQ)}" autocomplete="off">
      <div class="cast-list" id="cast-clist">${list.map(([c, i]) => `<button class="cast-item ${C.state.scene === 'compound' && C.state.k === i ? 'on' : ''}" data-act="cast-comp" data-k="${i}"><b class="sym" dir="ltr">${APP.subHTML(c.f)}</b><span>${esc(c.n.split(' (')[0])}</span></button>`).join('') || '<p class="muted small">پیدا نشد.</p>'}</div>`;
  }
  APP.acts['cast-comp'] = t => { C.state = { scene: 'compound', k: +t.dataset.k }; push(true); const l = $('#cast-clist'); if (l) $$('.cast-item', l).forEach(b => b.classList.toggle('on', b.dataset.k === t.dataset.k)); };

  /* واکنش */
  function rxCtl() {
    const q = C.rxQ.trim().toLowerCase();
    const types = Object.keys(R.TYPES).map(k => `<button class="chip" data-act="cast-rxtype" data-v="${k}" aria-pressed="${C.rxType === k}">${R.TYPES[k].ic} ${R.TYPES[k].t}</button>`).join('');
    const list = R.RX.filter(r => (!C.rxType || r.t === C.rxType) && (!q || r.left.concat(r.right).some(x => (R.nameOf(x.id) + ' ' + R.fOf(x.id)).toLowerCase().includes(q)))).slice(0, 80);
    const cur = C.state.scene === 'reaction' ? C.state : null;
    return `<input id="cast-rq" type="search" class="selectable" placeholder="جست‌وجوی واکنش: نام یا فرمول ماده" value="${esc(C.rxQ)}" autocomplete="off">
      <div class="chips"><button class="chip" data-act="cast-rxtype" data-v="" aria-pressed="${!C.rxType}">همه</button>${types}</div>
      <button class="btn accent block" data-act="cast-rxrun" ${cur ? '' : 'disabled'} id="cast-rxrun">▶ اجرای واکنش روی صفحه</button>
      <p class="small muted">اول مواد اولیه روی صفحه دیده می‌شود تا دانش‌آموزان پیش‌بینی کنند؛ بعد «اجرا» را بزنید.</p>
      <div class="cast-list" id="cast-rlist">${list.map(r => `<button class="cast-item ${cur && cur.k === r.key ? 'on' : ''}" data-act="cast-rxsel" data-k="${esc(r.key)}"><b class="sym" dir="ltr">${R.eqPlain(r)}</b><span>${R.TYPES[r.t].ic} پایهٔ ${fa(r.g)}</span></button>`).join('') || '<p class="muted small">پیدا نشد.</p>'}</div>`;
  }
  APP.acts['cast-rxtype'] = t => { C.rxType = t.dataset.v; mountTab(); };
  APP.acts['cast-rxsel'] = t => { C.state = { scene: 'reaction', k: t.dataset.k, run: 0 }; push(true); const l = $('#cast-rlist'); if (l) $$('.cast-item', l).forEach(b => b.classList.toggle('on', b.dataset.k === t.dataset.k)); const b = $('#cast-rxrun'); if (b) b.disabled = false; };
  APP.acts['cast-rxrun'] = () => { if (C.state.scene !== 'reaction') return; C.state = Object.assign({}, C.state, { run: (C.state.run || 0) + 1 }); push(true); APP.fx.play('open'); };
  APP.acts['cast-rx'] = t => { // از آزمایشگاه یا کتابخانه
    if (!APP.cast.active()) { APP.toast('اول در «نمایش روی تلویزیون» وصل شوید'); location.hash = '#/cast'; return; }
    C.state = { scene: 'reaction', k: t.dataset.k, run: 0 }; C.tab = 'reaction'; push(true); APP.toast('روی صفحهٔ نمایش گذاشته شد');
  };

  /* بشر زنده */
  function benchCtl() {
    return `<p>مواد را در صفحهٔ «آزمایشگاه» بریزید؛ هر چه در بشر می‌گذارید و هر واکنشی که اجرا می‌کنید <b>هم‌زمان</b> روی صفحهٔ نمایش دیده می‌شود.</p>
      <button class="btn primary block" data-act="cast-bench">🧫 رفتن به آزمایشگاه و نمایش بشر</button>`;
  }
  APP.acts['cast-bench'] = () => {
    if (!C.link) { APP.toast('اول وصل شوید'); return; }
    C.state = { scene: 'bench', items: [], cond: '', run: 0 }; push(true);
    APP.lab.openBench && APP.lab.openBench();
    location.hash = '#/lab';
  };

  /* سؤال */
  function qCtl() {
    const q = C.q;
    if (!q) {
      return `<p class="small muted">بخشی از جدول و نوع سؤال را انتخاب کنید؛ سؤال‌ها روی صفحه با نوشتهٔ بزرگ می‌آیند.</p>
        ${APP.selectorHTML('', 'از کدام قسمت جدول سؤال بسازم؟')}${APP.teachCfg.configHTML('cast-q-start', 'شروع نمایش سؤال‌ها')}`;
    }
    const it = q.items[q.i];
    return `<div class="small muted center">سؤال ${fa(q.i + 1)} از ${fa(q.items.length)}</div>
      <div class="cast-q"><b>${esc(it.p)}</b> <span class="${it.ltr ? 'ltr' : ''}">${esc(it.b)}</span></div>
      <div class="small muted">پاسخ: ${esc(it.a)}</div>
      <div class="row"><button class="btn" data-act="cast-q-prev" ${q.i ? '' : 'disabled'}>قبلی</button><button class="btn accent grow" data-act="cast-q-show">${q.show ? 'پنهان‌کردن پاسخ' : 'نمایش پاسخ'}</button><button class="btn primary" data-act="cast-q-next" ${q.i < q.items.length - 1 ? '' : 'disabled'}>بعدی</button></div>
      <button class="btn sm" data-act="cast-q-end">پایان و ساخت سؤال تازه</button>`;
  }
  function pushQ() {
    const q = C.q, it = q.items[q.i];
    C.state = { scene: 'q', p: it.p, b: it.b, a: it.a, e: plainText(it.explain), l: !!it.ltr, i: q.i + 1, cnt: q.items.length, show: q.show };
    push(true);
  }
  const plainText = h => String(h || '').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  APP.acts['cast-q-start'] = () => {
    const T = APP.teachCfg;
    if (!T.checkCfg()) return;
    if (!APP.quizSel.size && !T.CFG.comp) { APP.toast('اول بخشی از جدول را انتخاب کنید'); return; }
    const items = T.makeItems(false);
    if (!items.length) { APP.toast('سؤالی ساخته نشد'); return; }
    C.q = { items, i: 0, show: false }; pushQ(); mountTab();
  };
  APP.acts['cast-q-next'] = () => { if (C.q.i < C.q.items.length - 1) { C.q.i++; C.q.show = false; pushQ(); mountTab(); } };
  APP.acts['cast-q-prev'] = () => { if (C.q.i > 0) { C.q.i--; C.q.show = false; pushQ(); mountTab(); } };
  APP.acts['cast-q-show'] = () => { C.q.show = !C.q.show; pushQ(); mountTab(); };
  APP.acts['cast-q-end'] = () => { C.q = null; mountTab(); };

  /* زمان‌سنج */
  function timerCtl() {
    const T = C.timer;
    return `<div class="timer-disp" id="cast-tdisp">${mmss(T.left)}</div>
      <div class="chips wrap" style="justify-content:center">${[1, 2, 5, 10, 15, 20].map(m => `<button class="chip" data-act="cast-t-set" data-v="${m}">${fa(m)} دقیقه</button>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="cast-t-go">${T.running ? 'توقف' : 'شروع'}</button><button class="btn" data-act="cast-t-reset">از نو</button></div>`;
  }
  function timerLeft() { const T = C.timer; return T.running ? Math.max(0, T.left - (Date.now() - T.at) / 1000) : T.left; }
  function pushTimer() { const T = C.timer; C.state = { scene: 'timer', total: T.total, left: T.left, running: T.running }; push(true); }
  APP.acts['cast-t-set'] = t => { C.timer = { total: +t.dataset.v * 60, left: +t.dataset.v * 60, running: false, at: 0 }; pushTimer(); mountTab(); };

  APP.acts['cast-t-reset'] = () => { C.timer.left = C.timer.total; C.timer.running = false; pushTimer(); mountTab(); };
  const tdTick = setInterval(() => { const d = $('#cast-tdisp'); if (d) d.textContent = mmss(timerLeft()); }, 500);
  void tdTick;

  /* متن */
  function textCtl() {
    const ems = ['📖', '✍️', '🤔', '👏', '🎉', '⏰', '🔬', '⚠️'];

      <button class="btn primary block" data-act="cast-text-go">💬 نمایش روی صفحه</button>

  APP.acts['cast-open-win'] = () => {

  APP.acts['cast-local'] = t => { S().castLocalOnly = !S().castLocalOnly; APP.save(); t.setAttribute('aria-pressed', String(!!S().castLocalOnly)); if (C.link) C.link.reopen(); };

    else if (id === 'cast-rq') { C.rxQ = ev.target.value; const keep = ev.target.selectionStart; mountTab(); const n = $('#cast-rq'); if (n) { n.focus(); try { n.setSelectionRange(keep, keep); } catch (e) { /* */ } } }
  });
  window.addEventListener('resize', () => { if (C.stage) C.stage.resize(); });
  // اگر صفحهٔ استاد به‌اشتباه تازه‌سازی شد، ارتباط خودکار برقرار می‌شود

<style>
/* ============ پایه ============ */
/* فونت وزیرمتن از Google Fonts (در index.html) بارگذاری می‌شود؛ بدون اینترنت از فونت‌های سیستم استفاده می‌شود. */

:root {
  --bg: #f5f2ec;
  --surface: #ffffff;
  --surface-2: #efebe3;
  --ink: #1d2733;
  --ink-2: #566272;
  --line: #ddd7ca;
  --brand: #134e6f;
  --brand-ink: #ffffff;
  --accent: #e8590c;
  --good: #2f9e44;
  --bad: #d6336c;
  --shadow: 0 1px 2px rgba(20, 30, 40, .08), 0 6px 20px rgba(20, 30, 40, .07);
  --radius: 14px;
  --nav-h: 64px;

  /* رنگ دسته‌ها */
  --c-alkali: #ff9e8f;
  --c-alkaline: #ffc27a;
  --c-transition: #9ec9ee;
  --c-post: #8fd3c4;
  --c-metalloid: #c9e29a;
  --c-nonmetal: #fbe77d;
  --c-halogen: #f5a6c6;
  --c-noble: #cfa8ec;
  --c-lanthanide: #86d9e6;
  --c-actinide: #cdb7a8;

  /* پیشرفت */
  --m0: #d9d4c8;
  --m1: #f3c969;
  --m2: #f0a85a;
  --m3: #b8d982;
  --m4: #5fbf7a;
  --m5: #2f9e44;
}

[data-theme='dark'] {
  --bg: #0f1822;
  --surface: #17232f;
  --surface-2: #1e2d3b;
  --ink: #e8eef4;
  --ink-2: #9db0c2;
  --line: #2b3d4e;
  --brand: #5fb4e0;
  --brand-ink: #0b1620;
  --accent: #ff8a4c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .3);
  --m0: #34444f;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Vazirmatn', Tahoma, 'Segoe UI', system-ui, -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.7;
  direction: rtl;
  overscroll-behavior-y: contain;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
a { color: var(--brand); }

.sym, .latin { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* ============ چیدمان کلی ============ */
#app { min-height: 100%; display: flex; flex-direction: column; }

.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .logo {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #134e6f, #2b8a9e);
  color: #fff; display: grid; place-items: center;
  font-weight: 800; font-size: 14px; direction: ltr;
}
.topbar h1 { font-size: 18px; font-weight: 800; flex: 1; }
.topbar .sub { font-size: 12px; font-weight: 500; color: var(--ink-2); display: block; line-height: 1.2; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; font-size: 18px;
}

main#view { flex: 1; padding: 14px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); max-width: 1280px; width: 100%; margin: 0 auto; }

.bottom-nav {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface);
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 20px rgba(0, 0, 0, .05);
}
.bottom-nav button {
  border: 0; background: none; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; color: var(--ink-2); font-weight: 600;
}
.bottom-nav button .ni { font-size: 22px; line-height: 1; filter: grayscale(.7); transition: transform .15s; }
.bottom-nav button[aria-current='page'] { color: var(--brand); }
.bottom-nav button[aria-current='page'] .ni { filter: none; transform: translateY(-2px) scale(1.1); }

/* ============ عناصر عمومی ============ */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
}
.stack { display: grid; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.grow { flex: 1; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.center { text-align: center; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 700;
  transition: transform .1s, background .15s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.accent { background: var(--accent); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 34px;
  padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap;
}
.chip[aria-pressed='true'], .chip.on { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.chip .dot { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }

.section-title { font-size: 17px; font-weight: 800; margin-bottom: 8px; }
.badge {
  display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--surface-2); color: var(--ink-2);
}

input[type='search'], input[type='text'] {
  width: 100%; min-height: 44px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit;
}
input:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 45%, transparent); outline-offset: 2px; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.seg button[aria-pressed='true'] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

/* ============ جدول تناوبی ============ */
.stack > *, .grid-2 > * { min-width: 0; }
.pt-scroll {
  direction: ltr; max-width: 100%;
  overflow: auto; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--surface); padding: 10px; box-shadow: var(--shadow);
  -webkit-overflow-scrolling: touch;
}
.pt {
  --cell: 40px;
  --gap: 3px;
  direction: ltr;
  display: grid;
  grid-template-columns: 22px repeat(18, var(--cell));
  grid-template-rows: 20px repeat(7, var(--cell)) calc(var(--cell) * .3) repeat(2, var(--cell));
  gap: var(--gap);
  width: max-content;
  margin-inline: auto;
}
.pt .lab {
  display: grid; place-items: center; font-size: calc(var(--cell) * .26);
  color: var(--ink-2); font-weight: 700; border: 0; background: none; padding: 0;
  border-radius: 6px; direction: rtl;
}
.pt .lab.btn-lab:hover, .pt .lab.on { background: var(--surface-2); color: var(--ink); }
.pt .lab.on { background: var(--brand); color: var(--brand-ink); }

.el, .ph {
  position: relative; border-radius: calc(var(--cell) * .14); border: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 0; color: #1d2733; line-height: 1; text-align: center; overflow: hidden;
  transition: transform .12s, opacity .2s, box-shadow .12s, filter .2s;
}
.el { cursor: pointer; }
.el:hover { transform: scale(1.12); z-index: 3; box-shadow: 0 6px 16px rgba(0, 0, 0, .25); }
.el:active { transform: scale(.96); }
.el i { position: absolute; top: 8%; inset-inline-start: 11%; font-style: normal; font-size: calc(var(--cell) * .2); font-weight: 600; opacity: .75; direction: rtl; }
.el b { font-size: calc(var(--cell) * .42); font-weight: 800; direction: ltr; margin-top: 4%; }
.el small { font-size: calc(var(--cell) * .16); margin-top: 6%; font-weight: 600; opacity: .85; white-space: nowrap; display: none; direction: rtl; }
.el em { font-size: calc(var(--cell) * .14); font-style: normal; opacity: .7; display: none; direction: rtl; margin-top: 2%; }
.pt.show-name .el small { display: block; }
.pt.show-mass .el em { display: block; }
.pt.tiny .el i { display: none; }
.pt.tiny .el b { font-size: calc(var(--cell) * .5); margin: 0; }

.ph { font-size: calc(var(--cell) * .2); font-weight: 700; opacity: .75; direction: rtl; }

.c-alkali { background: var(--c-alkali); }
.c-alkaline { background: var(--c-alkaline); }
.c-transition { background: var(--c-transition); }
.c-post { background: var(--c-post); }
.c-metalloid { background: var(--c-metalloid); }
.c-nonmetal { background: var(--c-nonmetal); }
.c-halogen { background: var(--c-halogen); }
.c-noble { background: var(--c-noble); }
.c-lanthanide { background: var(--c-lanthanide); }
.c-actinide { background: var(--c-actinide); }

.el.dim, .ph.dim { opacity: .18; filter: saturate(.3); }
.el.out { opacity: .5; }
.el.hit { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 2; }

/* نمایش پیشرفت روی خانه‌ها */
.pt.mastery .el::after {
  content: ''; position: absolute; inset-inline: 0; bottom: 0; height: 18%;
  background: var(--m0);
}
.pt.mastery .el[data-m='1']::after { background: var(--m1); }
.pt.mastery .el[data-m='2']::after { background: var(--m2); }
.pt.mastery .el[data-m='3']::after { background: var(--m3); }
.pt.mastery .el[data-m='4']::after { background: var(--m4); }
.pt.mastery .el[data-m='5']::after { background: var(--m5); }

/* حالت نمایش پیشرفت (کل خانه رنگی) */
.pt.heat .el { color: #1d2733; background: var(--m0); }
.pt.heat .el[data-m='1'] { background: var(--m1); }
.pt.heat .el[data-m='2'] { background: var(--m2); }
.pt.heat .el[data-m='3'] { background: var(--m3); }
.pt.heat .el[data-m='4'] { background: var(--m4); }
.pt.heat .el[data-m='5'] { background: var(--m5); color: #fff; }

/* حالت انتخاب محدوده */
.pt.select .el { background: var(--surface-2); color: var(--ink-2); }
.pt.select .el.sel { color: #1d2733; }
.pt.select .el.sel.c-alkali { background: var(--c-alkali); }
.pt.select .el.sel.c-alkaline { background: var(--c-alkaline); }
.pt.select .el.sel.c-transition { background: var(--c-transition); }
.pt.select .el.sel.c-post { background: var(--c-post); }
.pt.select .el.sel.c-metalloid { background: var(--c-metalloid); }
.pt.select .el.sel.c-nonmetal { background: var(--c-nonmetal); }
.pt.select .el.sel.c-halogen { background: var(--c-halogen); }
.pt.select .el.sel.c-noble { background: var(--c-noble); }
.pt.select .el.sel.c-lanthanide { background: var(--c-lanthanide); }
.pt.select .el.sel.c-actinide { background: var(--c-actinide); }
.pt.select .el:not(.sel) { opacity: .55; }
.pt.select .el:hover { transform: none; box-shadow: none; }

/* حالت جای‌یابی */
.pt.place .el { background: var(--surface-2); color: transparent; }
.pt.place .el i, .pt.place .el small, .pt.place .el em { display: none; }
.pt.place .el:hover { background: var(--line); transform: none; box-shadow: none; }
.pt.place .el.good { background: var(--good); color: #fff; }
.pt.place .el.bad { background: var(--bad); animation: shake .35s; }
.pt.place .el.reveal { background: var(--good); color: #fff; }
.pt.place .ph { opacity: .35; }
.pt.place .el.good b, .pt.place .el.reveal b { color: #fff; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* برای حالت‌های بدون تعامل (درس‌ها) */
.pt.static .el { cursor: default; }
.pt.static .el:hover { transform: none; box-shadow: none; }

.pt-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pt-tools .search { flex: 1 1 180px; position: relative; }

.legend { display: flex; gap: 6px; flex-wrap: wrap; }

/* ============ جزئیات عنصر ============ */
.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(8, 16, 24, .55);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .15s ease-out;
}
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: min(680px, 100%); max-height: 92vh; overflow: auto;
  background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
  animation: up .22s cubic-bezier(.2, .9, .3, 1);
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@media (min-width: 720px) {
  .overlay { align-items: center; }
  .sheet { border-radius: 22px; }
}
.sheet-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.sheet-head h2 { font-size: 19px; flex: 1; }

.el-hero { display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center; margin-bottom: 14px; }
.big-tile {
  aspect-ratio: 1; border-radius: 18px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; color: #1d2733; position: relative; box-shadow: var(--shadow);
}
.big-tile i { position: absolute; top: 10px; inset-inline-start: 12px; font-style: normal; font-weight: 700; font-size: 18px; }
.big-tile b { font-size: 48px; line-height: 1; direction: ltr; }
.big-tile span { font-size: 13px; font-weight: 700; margin-top: 4px; }
.el-hero h3 { font-size: 24px; font-weight: 800; }
.el-hero .en { direction: ltr; text-align: right; color: var(--ink-2); font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.fact span { display: block; font-size: 12px; color: var(--ink-2); }
.fact b { font-size: 16px; }
.fact.wide { grid-column: 1 / -1; }
.cfg { direction: ltr; text-align: left; font-family: 'Cascadia Mono', Consolas, Menlo, monospace; font-size: 14px; word-spacing: 2px; line-height: 1.8; }

.bohr { width: 100%; max-width: 260px; margin-inline: auto; display: block; }
.bohr .ring { fill: none; stroke: var(--line); stroke-width: 1.2; }
.bohr .nuc { fill: var(--brand); }
.bohr .nuc-t { fill: var(--brand-ink); font-weight: 800; font-size: 15px; text-anchor: middle; dominant-baseline: central; font-family: inherit; }
.bohr .e { fill: var(--accent); }
.bohr .count { fill: var(--ink-2); font-size: 9px; text-anchor: middle; font-family: inherit; }

/* ============ آموزش ============ */
.lesson-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.lesson-card { display: flex; gap: 12px; align-items: center; text-align: right; width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.lesson-card .ico { width: 48px; height: 48px; flex: none; border-radius: 14px; background: var(--surface-2); display: grid; place-items: center; font-size: 24px; }
.lesson-card h3 { font-size: 16px; font-weight: 800; }
.lesson-card .done { color: var(--good); font-weight: 800; }

.lesson h2 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.lesson .lead { color: var(--ink-2); margin-bottom: 14px; }
.lesson .sec { margin-bottom: 18px; }
.lesson .sec h3 { font-size: 17px; font-weight: 800; margin-bottom: 6px; color: var(--brand); }
.lesson .sec p { margin-bottom: 8px; }
.lesson .viz { margin: 10px 0; }
.lesson sup, .lesson sub { line-height: 0; }
.mini-q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.mini-q h4 { margin: 0 0 8px; font-size: 15px; }
.opts { display: grid; gap: 8px; }
.opt {
  min-height: 46px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--surface); text-align: right; font-weight: 600; transition: background .15s, border-color .15s;
}
.opt:hover { border-color: var(--brand); }
.opt.good { background: color-mix(in srgb, var(--good) 22%, var(--surface)); border-color: var(--good); }
.opt.bad { background: color-mix(in srgb, var(--bad) 20%, var(--surface)); border-color: var(--bad); }
.opt[disabled] { pointer-events: none; }
.opt .latin { font-weight: 800; }
.opts.grid2 { grid-template-columns: repeat(2, 1fr); }

/* ============ آزمون ============ */
.setup-step { margin-bottom: 18px; }
.setup-step h3 { font-size: 16px; font-weight: 800; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.num-dot { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: inline-grid; place-items: center; font-size: 13px; font-weight: 800; }
.mode-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.mode {
  text-align: right; padding: 12px; border-radius: 14px; border: 2px solid var(--line);
  background: var(--surface); display: grid; gap: 2px;
}
.mode[aria-pressed='true'] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 10%, var(--surface)); }
.mode .mi { font-size: 24px; }
.mode b { font-size: 15px; }
.mode span { font-size: 12px; color: var(--ink-2); line-height: 1.5; }

.q-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; flex: 1; }
.bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .3s; }
.bar.time > i { background: var(--accent); transition: width 1s linear; }
.q-card { text-align: center; padding: 22px 16px; }
.q-prompt { font-size: 15px; color: var(--ink-2); margin-bottom: 8px; }
.q-big { font-size: 54px; font-weight: 800; line-height: 1.2; margin-bottom: 6px; }
.q-big.fa { font-size: 40px; }
.q-card .opts { margin-top: 14px; text-align: right; }
.type-input { text-align: center; font-size: 22px; font-weight: 700; margin-top: 12px; }
.feedback { margin-top: 14px; padding: 12px; border-radius: 12px; text-align: right; font-weight: 600; }
.feedback.good { background: color-mix(in srgb, var(--good) 18%, var(--surface)); }
.feedback.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.feedback .more { font-weight: 500; font-size: 14px; color: var(--ink-2); display: block; margin-top: 2px; }

.flash {
  perspective: 900px; margin: 6px auto 14px; width: 100%; max-width: 420px;
}
.flash-in {
  position: relative; min-height: 280px; transition: transform .45s; transform-style: preserve-3d; cursor: pointer;
}
.flash.flipped .flash-in { transform: rotateY(180deg); }
.flash .face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 18px; text-align: center;
}
.flash .back { transform: rotateY(180deg); }
.flash .face .q-big { margin: 0; }
.flash .hint { font-size: 13px; color: var(--ink-2); margin-top: 8px; }

.result-score { font-size: 64px; font-weight: 800; color: var(--brand); line-height: 1.1; }
.wrong-list { display: grid; gap: 6px; }
.wrong-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--surface-2); border-radius: 10px; border: 0; text-align: right; }
.wrong-item .tile { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; color: #1d2733; direction: ltr; flex: none; }

.sel-count { font-weight: 800; color: var(--brand); }

/* ============ پیشرفت ============ */
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 720px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: center; }
.stat b { display: block; font-size: 26px; line-height: 1.3; font-weight: 800; color: var(--brand); }
.stat span { font-size: 13px; color: var(--ink-2); }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 70px 1fr 44px; gap: 8px; align-items: center; font-size: 13px; }
.bar-row .bar { height: 10px; }
.bar-row .bar > i { background: var(--m4); }
.mastery-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.mastery-legend span::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: var(--c); margin-inline-end: 5px; vertical-align: -2px; }
.grid-2 { display: grid; gap: 14px; }
@media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; } }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));
  z-index: 100; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow);
  animation: up .2s ease-out;
}

.hero-card { background: linear-gradient(135deg, #134e6f, #2b8a9e); color: #fff; border: 0; }
.hero-card .btn { background: #fff; color: #134e6f; border: 0; }
.hero-card p { opacity: .9; }

@media (max-width: 560px) {
  .el-hero { grid-template-columns: 96px 1fr; }
  .big-tile b { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* =====================================================================
   نسخهٔ ۲: طراوت، انیمیشن، سیاه‌وسفید، موبایل، ترکیبات، راهنما
   ===================================================================== */
html { -webkit-text-size-adjust: 100%; }
body { min-height: 100dvh; }
#app { position: relative; z-index: 1; min-height: 100dvh; }

/* پس‌زمینهٔ زنده */
body::before {
  content: ''; position: fixed; inset: -10%; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 12% 8%, color-mix(in srgb, #2b8a9e 20%, transparent), transparent 38%),
    radial-gradient(circle at 90% 26%, color-mix(in srgb, var(--accent) 15%, transparent), transparent 36%),
    radial-gradient(circle at 40% 98%, color-mix(in srgb, #7a3e9d 14%, transparent), transparent 42%);
  animation: drift 20s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: scale(1.1) translate(14px, -18px); } }

/* سربرگ رنگی */
.topbar {
  background: linear-gradient(120deg, #134e6f, #1f7a8c 55%, #2f9e8f);
  border-bottom: 0; color: #fff; box-shadow: 0 4px 18px rgba(19, 78, 111, .25);
}
.topbar .sub { color: rgba(255, 255, 255, .8); }
.topbar .icon-btn { background: rgba(255, 255, 255, .16); border-color: rgba(255, 255, 255, .28); color: #fff; transition: transform .2s; }
.topbar .icon-btn:hover { transform: rotate(40deg); }
.topbar .logo { background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3); }
.logo svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 1.7; animation: spin 14s linear infinite; }
.logo svg circle { fill: #ffd43b; stroke: none; }
.logo svg .o2 { transform: rotate(60deg); transform-origin: 20px 20px; }
.logo svg .o3 { transform: rotate(120deg); transform-origin: 20px 20px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* نوار پایین */
.bottom-nav button { position: relative; transition: color .2s; }
.bottom-nav button::before {
  content: ''; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 4px 4px;
  background: var(--brand); transform: scaleX(0); transition: transform .25s;
}
.bottom-nav button[aria-current='page']::before { transform: scaleX(1); }
.bottom-nav button[aria-current='page'] .ni { animation: bounce .5s; }
@keyframes bounce { 40% { transform: translateY(-9px) scale(1.2); } }

/* ورود صفحه‌ها */
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@keyframes pop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
#view.enter > .stack > *, #view.enter > .lesson > * { animation: rise .5s cubic-bezier(.2, .8, .3, 1) backwards; }
#view.enter > .stack > :nth-child(2), #view.enter > .lesson > :nth-child(2) { animation-delay: .06s; }
#view.enter > .stack > :nth-child(3), #view.enter > .lesson > :nth-child(3) { animation-delay: .12s; }
#view.enter > .stack > :nth-child(4), #view.enter > .lesson > :nth-child(4) { animation-delay: .18s; }
#view.enter > .stack > :nth-child(n+5), #view.enter > .lesson > :nth-child(n+5) { animation-delay: .24s; }
#view.enter .pt .el { animation: pop .5s cubic-bezier(.3, 1.4, .5, 1) backwards; animation-delay: var(--d, 0ms); }
.lesson-list .lesson-card, .coll { animation: rise .45s backwards; }
.lesson-list .lesson-card:nth-child(2n) { animation-delay: .05s; }
.lesson-list .lesson-card:nth-child(3n) { animation-delay: .1s; }

.card, .lesson-card, .btn, .chip, .mode, .opt { transition: transform .18s, box-shadow .18s, background .2s, border-color .2s; }
@media (hover: hover) {
  .lesson-card:hover, .mode:hover, .compound-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(20, 30, 40, .16); }
  .btn:hover { transform: translateY(-1px); }
  .chip:hover { transform: translateY(-1px); }
}
@media (hover: none) { .el:hover { transform: none; box-shadow: none; } }
.btn.primary { background: linear-gradient(135deg, #134e6f, #2b8a9e); }
.btn.accent { background: linear-gradient(135deg, #e8590c, #f59f00); }
.chip[aria-pressed='true'], .chip.on { background: linear-gradient(135deg, #134e6f, #2b8a9e); color: #fff; }

/* پاسخ درست و غلط */
@keyframes shakeX { 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes pulseG { 0% { box-shadow: 0 0 0 0 rgba(47, 158, 68, .55); } 100% { box-shadow: 0 0 0 22px rgba(47, 158, 68, 0); } }
.shake { animation: shakeX .42s; }
.pulse { animation: pulseG .7s; }
.feedback { animation: rise .3s; }
.opt.good { animation: pop .35s; }
.result-score { animation: pop .7s cubic-bezier(.3, 1.4, .5, 1); }
.bar > i { background-image: linear-gradient(90deg, var(--brand), #2b8a9e); }

/* ---------- جدول روی گوشی ---------- */
.home-tools { display: grid; gap: 8px; }
.home-tools .search input { box-shadow: var(--shadow); }
.pt .lab { font-size: max(8px, calc(var(--cell) * .26)); }
.pt.nano .el { border-radius: 4px; }
.pt.nano .el b { font-size: max(8.5px, calc(var(--cell) * .5)); letter-spacing: -.3px; }
.el.picked { box-shadow: 0 0 0 2.5px var(--accent) inset; }
.el .cnt {
  position: absolute; bottom: 0; inset-inline-end: 0; direction: rtl; z-index: 2;
  background: var(--accent); color: #fff; font-size: max(8px, calc(var(--cell) * .3)); font-weight: 800; line-height: 1.25;
  padding: 0 calc(var(--cell) * .12); border-radius: 6px 0 0 0; animation: pop .3s;
}
.el.bump { animation: bumpA .3s; }
@keyframes bumpA { 50% { transform: scale(.82); } }
.pt.build .el { cursor: grab; }

@media (max-width: 639px) {
  main#view { padding: 10px 8px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
  .topbar { padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top)); }
  .topbar h1 { font-size: 17px; }
  .card { padding: 12px; }
  .pt { --gap: 2px; grid-template-columns: 14px repeat(18, var(--cell)); grid-template-rows: 14px repeat(7, var(--cell)) calc(var(--cell) * .3) repeat(2, var(--cell)); }
  .pt-scroll { padding: 6px 4px; }
  .mode-grid { grid-template-columns: repeat(2, 1fr); }
  .mode span { font-size: 11px; }
  .sheet { max-height: 94dvh; }
  .q-big { font-size: 46px; }
  .opts.grid2 .opt { font-size: 14px; padding: 6px 8px; }
  .lesson-list { grid-template-columns: 1fr; }
  .stat b { font-size: 22px; }
}
@media (min-width: 640px) { .pt { grid-template-columns: 22px repeat(18, var(--cell)); } }

/* ---------- ترکیبات ---------- */
.compound-card {
  display: flex; align-items: center; gap: 14px; text-align: right; width: 100%; border: 0;
  padding: 14px 16px; border-radius: var(--radius); color: #fff; box-shadow: var(--shadow);
  background: linear-gradient(135deg, #7a3e9d, #be185d 55%, #e8590c);
  position: relative; overflow: hidden;
}
.compound-card::after { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255, 255, 255, .1); inset-inline-start: -50px; top: -60px; }
.compound-card h3 { font-size: 19px; font-weight: 800; margin-bottom: 2px; }
.compound-card p { font-size: 13px; opacity: .95; margin-bottom: 6px; line-height: 1.7; }
.compound-card .badge { background: rgba(255, 255, 255, .22); color: #fff; }
.compound-card .go-arrow { font-size: 34px; opacity: .85; animation: nudge 1.6s ease-in-out infinite; }
@keyframes nudge { 50% { transform: translateX(-6px); } }
.micro { width: 84px; height: 84px; flex: none; color: #fff; animation: floaty 4s ease-in-out infinite; }
.micro.sm { width: 54px; height: 54px; color: var(--brand); animation: none; }
@keyframes floaty { 50% { transform: translateY(-7px) rotate(-3deg); } }
.micro .spark { animation: twinkle 1.6s ease-in-out infinite; }
.micro .spark.s2 { animation-delay: .8s; }
@keyframes twinkle { 50% { opacity: .1; transform: scale(.4); } }

.lab-card { padding: 14px; }
.lab-head { display: flex; align-items: center; gap: 10px; }
.formula-bar { flex: 1; min-width: 0; text-align: center; }
.formula { font-size: 32px; font-weight: 800; direction: ltr; unicode-bidi: isolate; min-height: 46px; line-height: 1.4; color: var(--brand); word-break: break-all; }
.formula sub { font-size: .6em; }
.build-btn { min-height: 50px; font-size: 16px; padding: 0 16px; flex: none; }
.lens {
  position: relative; margin: 12px auto; width: min(100%, 340px); aspect-ratio: 1; border-radius: 50%;
  display: grid; place-items: center; overflow: hidden; border: 10px solid #26323f;
  background:
    linear-gradient(rgba(255, 255, 255, .22) 1px, transparent 1px) 0 0 / 100% 12.5%,
    linear-gradient(90deg, rgba(255, 255, 255, .22) 1px, transparent 1px) 0 0 / 12.5% 100%,
    radial-gradient(circle at 50% 45%, #d6f3f8 0%, #8fd3dd 55%, #4aa8b8 100%);
  box-shadow: inset 0 0 40px rgba(0, 0, 0, .35), 0 8px 22px rgba(0, 0, 0, .25);
  transition: outline-color .2s;
}
.lens.over { outline: 4px dashed var(--accent); outline-offset: 4px; }
.lens-hint { position: absolute; color: rgba(20, 50, 70, .55); font-weight: 700; font-size: 15px; }
.atoms { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-content: center; width: 100%; height: 100%; padding: 15%; direction: ltr; }
.atom {
  width: var(--sz, 44px); height: var(--sz, 44px); flex: none; border-radius: 50%; border: 0; font-weight: 800;
  font-size: calc(var(--sz, 44px) * .4); color: #1d2733; font-family: inherit; padding: 0;
  box-shadow: inset -4px -5px 8px rgba(0, 0, 0, .2), inset 3px 3px 6px rgba(255, 255, 255, .6), 0 3px 6px rgba(0, 0, 0, .3);
  animation: bob 3s ease-in-out var(--d, 0s) infinite;
}
.atom.born { animation: bob 3s ease-in-out var(--d, 0s) infinite, atomIn .5s cubic-bezier(.3, 1.7, .5, 1); }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes atomIn { 0% { transform: scale(0) rotate(-120deg); } 100% { transform: scale(1) rotate(0); } }
.lens.shake { animation: shakeX .42s; }
.c-msg { border-radius: 12px; font-weight: 600; font-size: 14px; overflow: hidden; max-height: 0; transition: max-height .3s, padding .3s; padding: 0 12px; margin-top: 0; }
.c-msg.show { max-height: 200px; padding: 10px 12px; margin-top: 10px; }
.c-msg.bad { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); }
.c-msg.hint { background: color-mix(in srgb, #4dabf7 22%, var(--surface)); }

.coll-sec { margin-bottom: 14px; }
.coll-sec h4 { margin: 0 0 6px; font-size: 14px; }
.coll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.coll {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center;
  min-height: 62px; padding: 6px 4px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface-2); font-size: 11.5px; line-height: 1.5;
}
.coll b { font-size: 17px; line-height: 1.3; direction: ltr; }
.coll.got { background: color-mix(in srgb, var(--good) 18%, var(--surface)); border-color: var(--good); }
.coll.lock { opacity: .8; }
.coll:active { transform: scale(.95); }

.made { font-size: 19px; text-align: center; margin-bottom: 4px; }
.big-formula { display: block; font-size: 50px; font-weight: 800; text-align: center; direction: ltr; color: var(--brand); line-height: 1.2; animation: pop .6s cubic-bezier(.3, 1.5, .5, 1); }
.big-formula sub { font-size: .55em; }
.mol { width: 100%; max-width: 320px; display: block; margin: 4px auto; }
.mol line { stroke: var(--ink-2); stroke-width: 3; stroke-linecap: round; opacity: .7; }
.mol circle { stroke: rgba(0, 0, 0, .25); stroke-width: 1.2; }
.mol text { font-size: 11px; font-weight: 800; text-anchor: middle; dominant-baseline: central; fill: #1d2733; direction: ltr; font-family: inherit; }
.mol .at { animation: atomIn .55s cubic-bezier(.3, 1.6, .5, 1) backwards; transform-box: fill-box; transform-origin: center; }

.onb {
  position: fixed; inset: 0; z-index: 150; color: #fff; display: flex; flex-direction: column;
  background: linear-gradient(160deg, var(--g1, #134e6f), var(--g2, #2b8a9e)); transition: background .5s;

.onb::before, .onb::after { content: ''; position: absolute; border-radius: 50%; background: rgba(255, 255, 255, .08); pointer-events: none; }
.onb::before { width: 320px; height: 320px; top: -110px; inset-inline-end: -90px; animation: floaty 7s ease-in-out infinite; }
.onb::after { width: 240px; height: 240px; bottom: -80px; inset-inline-start: -70px; animation: floaty 9s ease-in-out infinite reverse; }
.onb-top { display: flex; justify-content: space-between; align-items: center; opacity: .9; position: relative; z-index: 1; }
.onb-skip { background: none; border: 0; color: #fff; font-weight: 700; padding: 8px 4px; }
.onb-slide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; width: 100%; max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }
.onb-slide.from-left { animation: inL .45s cubic-bezier(.2, .8, .3, 1); }
.onb-slide.from-right { animation: inR .45s cubic-bezier(.2, .8, .3, 1); }
@keyframes inL { from { opacity: 0; transform: translateX(-50px); } }
@keyframes inR { from { opacity: 0; transform: translateX(50px); } }
.onb h2 { font-size: 26px; font-weight: 800; }
.onb p { font-size: 16px; line-height: 1.9; opacity: .96; max-width: 460px; }
.onb-art { min-height: 200px; display: grid; place-items: center; max-width: 100%; }
.onb-atom { width: min(60vw, 250px); }
.onb .bohr .ring { stroke: rgba(255, 255, 255, .45); }
.onb .bohr .nuc { fill: #fff; }
.onb .bohr .nuc-t { fill: #134e6f; }
.onb .bohr .e { fill: #ffd43b; }
.onb-table { background: rgba(255, 255, 255, .94); border-radius: 14px; padding: 6px; max-width: 100%; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
.onb-table .pt { margin: 0; }
.onb-emoji { font-size: 112px; line-height: 1; animation: floaty 3s ease-in-out infinite; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .25)); }
.onb-micro { width: min(52vw, 210px); height: auto; }
.onb-credit {
  margin-top: 6px; padding: 12px 22px; border-radius: 999px; font-weight: 800; font-size: 18px;
  background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .45); animation: glow 2.2s ease-in-out infinite;

@keyframes glow { 50% { box-shadow: 0 0 26px rgba(255, 255, 255, .45); } }
.onb-dots { display: flex; justify-content: center; gap: 7px; margin: 8px 0 14px; position: relative; z-index: 1; }
.onb-dots i { width: 8px; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .4); transition: width .3s, background .3s; }
.onb-dots i.on { width: 24px; background: #fff; }
.onb-actions { display: flex; justify-content: space-between; gap: 10px; max-width: 560px; width: 100%; margin: 0 auto; position: relative; z-index: 1; }
.onb-btn { min-height: 50px; min-width: 110px; font-size: 16px; }
.onb-btn.solid { background: #fff; color: #134e6f; border: 0; flex: 1; max-width: 240px; margin-inline-start: auto; }
.onb-btn.ghost { color: #fff; border-color: rgba(255, 255, 255, .5); background: transparent; }

.credit { text-align: center; padding: 12px; border-radius: 12px; background: var(--surface-2); font-weight: 800; color: var(--brand); border: 1px dashed var(--line); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
.confetti i { position: absolute; display: block; }

html[data-anim='off'] *, html[data-anim='off'] *::before, html[data-anim='off'] *::after { animation: none !important; transition: none !important; }

      if (total !== z) {
        const keys = Object.keys(out).filter(k => !(k in exc));
        const last = keys[keys.length - 1];
        if (last) out[last] += z - total;

/* ===== fx.js ===== */
/* صدا (WebAudio، بدون فایل صوتی) و جلوه‌های تصویری */
(function () {
  'use strict';
  const S = () => APP.S();

  /* ---------- صدا ---------- */
  let ctx = null, master = null;
  function ensure() {
    if (!S().sound) return null;
    if (!ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.32;
        master.connect(ctx.destination);
      } catch (e) { return null; }
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, at, dur, type, vol, slideTo) {
    const c = ctx, o = c.createOscillator(), g = c.createGain();
    const t0 = c.currentTime + at;
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.4, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(at, dur, vol, hp) {
    const c = ctx, len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp || 1800;
    g.gain.value = vol || 0.15;
    s.connect(f); f.connect(g); g.connect(master);
    s.start(c.currentTime + at);
  }
  const PENTA = [0, 2, 4, 7, 9];
  const noteHz = z => 261.63 * Math.pow(2, (PENTA[z % 5] + 12 * (Math.floor(z / 5) % 3)) / 12);

  const SOUNDS = {
    tap: () => tone(620, 0, 0.06, 'triangle', 0.18),
    nav: () => { tone(520, 0, 0.07, 'triangle', 0.2); tone(780, 0.05, 0.09, 'triangle', 0.16); },
    el: z => tone(noteHz(z || 1), 0, 0.22, 'sine', 0.4),
    pop: z => { const f = noteHz(z || 1); tone(f * 0.8, 0, 0.12, 'sine', 0.38, f * 1.5); },
    remove: () => tone(420, 0, 0.1, 'triangle', 0.2, 240),
    good: () => { tone(523.25, 0, 0.14, 'sine', 0.4); tone(659.25, 0.09, 0.14, 'sine', 0.4); tone(783.99, 0.18, 0.26, 'sine', 0.4); },
    bad: () => { tone(220, 0, 0.22, 'sawtooth', 0.2, 130); tone(165, 0.1, 0.25, 'sawtooth', 0.16, 100); },
    flip: () => { noise(0, 0.14, 0.14, 2500); tone(700, 0, 0.1, 'triangle', 0.1, 1100); },
    win: () => {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.1, 0.3, 'triangle', 0.36));
      tone(1318.5, 0.42, 0.5, 'sine', 0.3);
    },
    build: () => {
      [392, 523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.085, 0.28, 'triangle', 0.34));
      noise(0.3, 0.4, 0.07, 5000);
      tone(1568, 0.45, 0.6, 'sine', 0.26);
    },
    open: () => tone(480, 0, 0.12, 'sine', 0.2, 700),
    close: () => tone(600, 0, 0.1, 'sine', 0.18, 380),
    next: () => tone(660, 0, 0.1, 'triangle', 0.22, 880)
  };
  function play(name, arg) {
    if (!ensure()) return;
    const f = SOUNDS[name];
    if (f) try { f(arg); } catch (e) { /* صدا اختیاری است */ }
  }

  /* ---------- کنفتی ---------- */
  function confetti(opts) {
    if (!S().anim) return;
    const n = (opts && opts.n) || 46;
    const cx = (opts && opts.x != null) ? opts.x : innerWidth / 2;
    const cy = (opts && opts.y != null) ? opts.y : innerHeight * 0.4;
    const layer = document.createElement('div');
    layer.className = 'confetti';
    document.body.appendChild(layer);
    const colors = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#4dabf7', '#b197fc', '#f783ac'];
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      const size = 6 + Math.random() * 7;
      p.style.cssText = `left:${cx}px;top:${cy}px;width:${size}px;height:${size * (Math.random() < .5 ? 1 : .45)}px;background:${colors[i % colors.length]};border-radius:${Math.random() < .3 ? '50%' : '2px'}`;
      layer.appendChild(p);
      const ang = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
      const dx = Math.cos(ang) * v, dy = Math.sin(ang) * v - 120;
      p.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: `translate(${dx}px,${dy}px) rotate(${Math.random() * 540 - 270}deg)`, opacity: 1, offset: 0.45 },
        { transform: `translate(${dx * 1.25}px,${dy + 380}px) rotate(${Math.random() * 900 - 450}deg)`, opacity: 0 }
      ], { duration: 1300 + Math.random() * 900, easing: 'cubic-bezier(.2,.7,.4,1)', fill: 'forwards' });
    }
    setTimeout(() => layer.remove(), 2400);
  }

  APP.fx = { play, confetti, unlock: ensure };

  // صدای کلیک عمومی برای دکمه‌هایی که صدای اختصاصی ندارند
  const SILENT = new Set(['el', 'lq', 'q-pick', 'q-submit', 'q-skip', 'q-hint', 'place-pick', 'flash-rate', 'flip', 'build-add', 'build-rm', 'build-go', 'close-sheet', 'onb-next', 'onb-prev', 'onb-skip', 'onb-done', 'set', 'toggle-sound']);
  document.addEventListener('click', ev => {
    const t = ev.target.closest('[data-act],[data-go]');
    if (!t) return;
    if (t.dataset.go) { play('nav'); return; }
    if (!SILENT.has(t.dataset.act)) play('tap');
  }, true);
  // برخی مرورگرها فقط بعد از اولین لمس اجازهٔ صدا می‌دهند
  ['pointerdown', 'keydown'].forEach(n => document.addEventListener(n, () => { if (S().sound) ensure(); }, { once: true, passive: true }));
})();

/* ===== views.js ===== */
/* صفحه‌های خانه، آموزش و پیشرفت */
(function () {
  'use strict';
  const { E, CATS, u } = APP;
  const { $, $$, fa, shuffle, normFa } = u;
  const S = () => APP.S();

  /* ============ خانه ============ */
  const home = { cat: null, q: '' };

  APP.views.home = function () {
    const s = S();
    const cell = APP.cellSize();
    const table = APP.tableHTML({
      mode: 'home', cell, showName: s.showName, showMass: s.showMass, overlay: s.overlay,

    });

      `<button class="chip" data-act="home-cat" data-v="${k}" aria-pressed="${home.cat === k}"><span class="dot c-${k}"></span>${CATS[k].short}</button>`).join('');

      ? '<p class="small muted center">برای دیدن نام عنصرها روی «+» بزنید تا جدول بزرگ‌تر شود.</p>'

            <button class="chip" data-act="home-tog" data-k="showMass" aria-pressed="${s.showMass}">جرم</button>
            <button class="chip" data-act="home-tog" data-k="overlay" aria-pressed="${s.overlay}">پیشرفت</button>
            <button class="chip" data-act="home-zoom" data-v="-4" aria-label="کوچک‌تر" style="min-width:44px;justify-content:center;font-size:18px">−</button>
            <button class="chip" data-act="home-zoom" data-v="4" aria-label="بزرگ‌تر" style="min-width:44px;justify-content:center;font-size:18px">+</button>
            <button class="chip" data-act="home-fit" aria-label="متناسب با صفحه" style="min-width:44px;justify-content:center;font-size:16px">⤢</button>

        </div>

        <div class="pt-scroll" id="pt-scroll">${table}</div>
        ${hint}
        ${APP.homeCompoundCard()}
      </div>`;
  };

  function matchQ(e, q) {
    const x = q.trim().toLowerCase();
    if (!x) return true;
    if (/^[0-9۰-۹]+$/.test(x)) return e.z === +normFa(x);
    return e.sym.toLowerCase() === x || e.sym.toLowerCase().startsWith(x) || e.en.toLowerCase().includes(x) || normFa(e.fa).includes(normFa(x));
  }
  function applyFilter() {
    const q = home.q, cat = home.cat;
    const anyF = !!(q.trim() || cat);
    $$('#pt-scroll .el').forEach(b => {
      const e = E[+b.dataset.z - 1];
      const okCat = !cat || e.cat === cat;
      const okQ = !q.trim() || matchQ(e, q);
      const on = okCat && okQ;
      b.classList.toggle('dim', anyF && !on);
      b.classList.toggle('hit', !!q.trim() && on);
    });
    $$('#pt-scroll .ph').forEach(p => p.classList.toggle('dim', anyF));
  }
  document.addEventListener('input', ev => {
    if (ev.target.id === 'search') { home.q = ev.target.value; applyFilter(); }
  });
  APP.acts['home-cat'] = t => { home.cat = home.cat === t.dataset.v ? null : t.dataset.v; APP.render(); };
  APP.acts['home-tog'] = t => { const k = t.dataset.k; S()[k] = !S()[k]; APP.save(); APP.render(); };
  APP.acts['home-zoom'] = t => {
    const s = S(); const cur = APP.cellSize();
    s.cell = u.clamp(cur + +t.dataset.v, 14, 80); APP.save(); APP.render();
  };
  APP.acts['home-fit'] = () => { S().cell = null; APP.save(); APP.render(); };

  /* ============ آموزش ============ */
  APP.views.learn = function () {
    const done = Object.keys(S().lessons).length;
    const cards = LESSONS.map(l => {
      const d = S().lessons[l.id];
      return `<button class="lesson-card" data-go="#/lesson/${l.id}">
        <div class="ico" aria-hidden="true">${l.icon}</div>
        <div class="grow">
          <h3>${l.title}</h3>
          <div class="small muted"><span class="badge">پایهٔ ${l.grade}</span> ${d ? `<span class="done">✓ انجام شد (${fa(d.score)}٪)</span>` : ''}</div>
        </div>
      </button>`;
    }).join('');
    return `
      <div class="stack">
        <div class="card">
          <div class="section-title">مسیر یادگیری</div>
          <p class="small muted">از اتم و عدد اتمی شروع کنید و تا روندهای جدول بروید. هر درس یک تمرین کوتاه دارد. <b>${fa(done)} از ${fa(LESSONS.length)}</b> درس را کامل کرده‌اید.</p>
          <div class="bar" style="margin-top:10px"><i style="width:${Math.round(done / LESSONS.length * 100)}%"></i></div>
        </div>
        <div class="lesson-list">${cards}</div>
      </div>`;
  };

  function hlPredicate(spec) {
    const [k, v] = spec.split(':');
    switch (k) {
      case 'group': return e => e.group === +v;
      case 'period': return e => e.row === +v;
      case 'cat': return e => e.cat === v;
      case 'block': return e => e.block === v;
      case 'z': { const [a, b] = v.split('-').map(Number); return e => e.z >= a && e.z <= b; }
      case 'metal': return e => ['alkali', 'alkaline', 'transition', 'post', 'lanthanide', 'actinide'].includes(e.cat);
      default: return () => true;
    }
  }
  function vizHTML(v) {
    if (v.t === 'atom') {
      const e = E[v.z - 1];
      return `<div class="viz card">${APP.atomSVG(v.z)}<p class="center small muted">مدل لایه‌ای اتم ${e.fa} (<span class="sym">${e.sym}</span>): ${e.shells.map(fa).join('، ')}</p></div>`;
    }
    const p = hlPredicate(v.hl);
    const cell = Math.min(28, Math.max(18, Math.floor((Math.min(window.innerWidth, 720) - 100) / 19)));
    return `<div class="viz pt-scroll">${APP.tableHTML({ mode: 'static', cell, cls: e => (e.ph ? 'dim' : (p(e) ? '' : 'dim')) })}</div>`;
  }

  let LQ = null; // وضعیت تمرین درس جاری

  APP.views.lesson = function (r) {
    const l = LESSONS.find(x => x.id === r.id);
    if (!l) return APP.views.learn();
    LQ = { id: l.id, answered: 0, right: 0, total: l.quiz.length, qs: l.quiz.map(q => ({ q: q.q, opts: shuffle(q.o.map((t, i) => ({ t, ok: i === q.a }))), done: false })) };
    const idx = LESSONS.indexOf(l);
    const nxt = LESSONS[idx + 1];
    const secs = l.sections.map(s => `
      <section class="sec"><h3>${s.h}</h3>${s.p.map(x => `<p>${x}</p>`).join('')}${s.viz ? vizHTML(s.viz) : ''}</section>`).join('');
    const quiz = LQ.qs.map((q, qi) => `
      <div class="mini-q" data-qi="${qi}"><h4>${fa(qi + 1)}. ${q.q}</h4>
        <div class="opts">${q.opts.map((o, oi) => `<button class="opt" data-act="lq" data-qi="${qi}" data-oi="${oi}">${o.t}</button>`).join('')}</div>
      </div>`).join('');
    return `
      <article class="lesson stack">
        <div class="row"><button class="btn sm ghost" data-go="#/learn">→ همهٔ درس‌ها</button><span class="badge">پایهٔ ${l.grade}</span></div>
        <div><h2>${l.icon} ${l.title}</h2><p class="lead">${l.intro}</p></div>
        ${secs}
        <div class="card"><div class="section-title">تمرین کوتاه</div>${quiz}<div id="lq-result"></div></div>
        <div class="row">
          ${nxt ? `<button class="btn primary grow" data-go="#/lesson/${nxt.id}">درس بعد: ${nxt.title}</button>` : '<button class="btn primary grow" data-go="#/quiz">برو به آزمون‌ها 🎯</button>'}
        </div>
      </article>`;
  };
  APP.acts.lq = t => {
    if (!LQ) return;
    const qi = +t.dataset.qi, oi = +t.dataset.oi;
    const q = LQ.qs[qi]; if (q.done) return;
    q.done = true; LQ.answered++;
    const ok = q.opts[oi].ok; if (ok) LQ.right++;
    APP.fx.play(ok ? 'good' : 'bad');
    const wrap = t.closest('.mini-q');
    $$('.opt', wrap).forEach((b, i) => {
      b.disabled = true;
      if (q.opts[i].ok) b.classList.add('good');
    });
    if (!ok) t.classList.add('bad');
    if (LQ.answered === LQ.total) {
      const score = Math.round(LQ.right / LQ.total * 100);
      const s = S(); const first = !s.lessons[LQ.id];
      const prev = s.lessons[LQ.id];
      s.lessons[LQ.id] = { score: prev ? Math.max(prev.score, score) : score };
      if (first) APP.addXP(20);
      APP.touchStreak(); APP.save();
      if (score === 100) { APP.fx.play('win'); APP.fx.confetti(); }
      $('#lq-result').innerHTML = `<div class="feedback ${score >= 67 ? 'good' : 'bad'}">${score === 100 ? '🎉 عالی بود! همهٔ پاسخ‌ها درست بود.' : score >= 67 ? '👍 خوب بود! نتیجه: ' + fa(LQ.right) + ' از ' + fa(LQ.total) : 'نتیجه: ' + fa(LQ.right) + ' از ' + fa(LQ.total) + '. یک بار دیگر متن درس را بخوانید و دوباره امتحان کنید.'}
        <span class="more">${first ? '۲۰ امتیاز گرفتید.' : ''}</span>
        <div style="margin-top:8px"><button class="btn sm" data-act="lq-retry">تلاش دوباره</button></div></div>`;
    }
  };
  APP.acts['lq-retry'] = () => { const id = LQ && LQ.id; APP.render(); void id; };

  /* ============ پیشرفت ============ */
  function pct(list) {
    if (!list.length) return 0;
    return Math.round(list.reduce((a, e) => a + APP.box(e.z), 0) / (5 * list.length) * 100);
  }
  function barRows(items) {
    return items.map(([label, list]) => {
      const p = pct(list);
      return `<div class="bar-row"><span>${label}</span><div class="bar"><i style="width:${p}%"></i></div><span>${fa(p)}٪</span></div>`;
    }).join('');
  }
  APP.weakest = function (n, limitToScope) {
    const s = S();
    const list = E.filter(e => !limitToScope || e.z <= s.scope);
    const score = e => {
      const m = s.mastery[e.z];
      if (!m) return 2.5; // هنوز دیده نشده: متوسط
      return APP.box(e.z) - Math.min(2, m.wrong * 0.4);
    };
    return list.map(e => ({ e, w: score(e) + Math.random() * 0.8 })).sort((a, b) => a.w - b.w).slice(0, n).map(x => x.e);
  };

  APP.views.progress = function () {
    const s = S();
    const inScope = E.filter(e => e.z <= s.scope);
    const mastered = inScope.filter(e => APP.box(e.z) >= 4).length;
    const learning = inScope.filter(e => APP.box(e.z) >= 1 && APP.box(e.z) < 4).length;
    const acc = s.stats.answered ? Math.round(s.stats.correct / s.stats.answered * 100) : 0;
    const table = APP.tableHTML({ mode: 'heat', cell: APP.cellSize({ auto: true, min: 14, max: 46 }), overlay: false, cls: e => (e.z > s.scope ? 'out' : '') });
    const groups = []; for (let g = 1; g <= 18; g++) groups.push([`گروه ${fa(g)}`, E.filter(e => e.group === g)]);
    const periods = []; for (let p = 1; p <= 7; p++) periods.push([`دورهٔ ${fa(p)}`, E.filter(e => e.row === p)]);
    periods.push(['لانتانیدها', E.filter(e => e.cat === 'lanthanide')], ['اکتینیدها', E.filter(e => e.cat === 'actinide')]);
    const weak = inScope.filter(e => s.mastery[e.z] && s.mastery[e.z].wrong > 0)
      .sort((a, b) => (APP.box(a.z) - APP.box(b.z)) || (s.mastery[b.z].wrong - s.mastery[a.z].wrong)).slice(0, 6);
    const lessonsDone = Object.keys(s.lessons).length;
    const last = s.sessions.slice(-5).reverse();
    return `
      <div class="stack">
        <div class="stat-grid">
          <div class="stat"><b>${fa(mastered)}<small class="muted" style="font-size:14px"> از ${fa(inScope.length)}</small></b><span>عنصر مسلط‌شده</span></div>
          <div class="stat"><b>${fa(learning)}</b><span>در حال یادگیری</span></div>
          <div class="stat"><b>${fa(acc)}٪</b><span>دقت پاسخ‌ها</span></div>
          <div class="stat"><b>${fa(s.xp)}</b><span>امتیاز ⭐ ${APP.streakNow() ? '· 🔥' + fa(APP.streakNow()) + ' روز' : ''}</span></div>
        </div>

        <div class="card stack" style="gap:10px">
          <div class="section-title" style="margin:0">نقشهٔ یادگیری شما</div>
          <div class="mastery-legend">
            <span style="--c:var(--m0)">هنوز تمرین نشده</span><span style="--c:var(--m1)">شروع یادگیری</span>
            <span style="--c:var(--m2)">در حال یادگیری</span><span style="--c:var(--m3)">نزدیک به تسلط</span>
            <span style="--c:var(--m4)">مسلط</span><span style="--c:var(--m5)">کاملاً مسلط</span>
          </div>
          <div class="pt-scroll">${table}</div>
          <p class="small muted">هر چه پاسخ درست بدهید خانه سبزتر می‌شود؛ پاسخ اشتباه آن را یک‌ــدو پله پایین می‌آورد. روی هر خانه بزنید تا جزئیاتش را ببینید.</p>
        </div>

        ${weak.length ? `<div class="card"><div class="section-title">عنصرهایی که بیشتر به مرور نیاز دارند</div>
          <div class="chips wrap">${weak.map(e => `<button class="chip" data-act="detail-open" data-z="${e.z}"><span class="dot c-${e.cat}"></span>${e.fa} <span class="sym">${e.sym}</span></button>`).join('')}</div>
          <button class="btn primary block" style="margin-top:12px" data-act="practice-weak">تمرین همین عنصرها</button></div>` : ''}

        <div class="grid-2">
          <div class="card"><div class="section-title">پیشرفت در هر گروه</div><div class="bars">${barRows(groups)}</div></div>
          <div class="card stack" style="gap:14px">
            <div><div class="section-title">پیشرفت در هر دوره</div><div class="bars">${barRows(periods)}</div></div>
            <div><div class="section-title">درس‌ها</div>
              <p class="small muted">${fa(lessonsDone)} از ${fa(LESSONS.length)} درس انجام شده است.</p>
              <div class="bar" style="margin-top:6px"><i style="width:${Math.round(lessonsDone / LESSONS.length * 100)}%"></i></div></div>
          </div>
        </div>

        ${last.length ? `<div class="card"><div class="section-title">آخرین آزمون‌ها</div>
          <div class="bars">${last.map(x => `<div class="bar-row" style="grid-template-columns:1fr auto"><span>${x.mode} — ${fa(x.right)} از ${fa(x.total)}</span><span class="muted">${fa(Math.round(x.right / Math.max(1, x.total) * 100))}٪</span></div>`).join('')}</div></div>` : ''}
      </div>`;
  };
  APP.acts['detail-open'] = t => APP.openSheet(APP.detailHTML(+t.dataset.z));
})();

/* ===== quiz.js ===== */
/* بخش آزمون: انتخاب محدوده، چهار نوع تمرین، نتیجه */
(function () {
  'use strict';
  const { E, CATS, u } = APP;
  const { $, $$, fa, shuffle, rand, normFa, matchesName } = u;
  const S = () => APP.S();

  const MODES = {
    mc:    { ic: '🔘', t: 'چهارگزینه‌ای', d: 'از بین چهار گزینه درست را انتخاب کنید.' },
    type:  { ic: '⌨️', t: 'نوشتنی', d: 'پاسخ را خودتان بنویسید؛ بهترین روش برای حفظ.' },
    place: { ic: '🧩', t: 'جای عنصر در جدول', d: 'روی جدول خالی، خانهٔ درست عنصر را پیدا کنید.' },
    flash: { ic: '🃏', t: 'کارت حفظی', d: 'عنصرهای سخت‌تر بیشتر تکرار می‌شوند.' }
  };
  const KIND_GROUPS = {
    names:    { t: 'نام و نماد', kinds: ['sym2fa', 'fa2sym'] },
    numbers:  { t: 'عدد اتمی', kinds: ['num2fa', 'fa2num'] },
    position: { t: 'گروه و دوره', kinds: ['group', 'period'] },
    props:    { t: 'دسته و الکترون ظرفیت', kinds: ['cat', 'valence'] }
  };

  /* ---------- انتخاب محدوده ---------- */
  function initSel() {
    if (!APP.quizSel) APP.quizSel = new Set(E.filter(e => e.z <= S().scope).map(e => e.z));
    return APP.quizSel;
  }
  function syncSel() {
    const sel = initSel();
    $$('#view .pt.select .el').forEach(b => b.classList.toggle('sel', sel.has(+b.dataset.z)));
    const c = $('#sel-count'); if (c) c.textContent = fa(sel.size);
    const go = $('#start-btn'); if (go) go.disabled = sel.size === 0;
  }
  function toggleSet(zs) {
    const sel = initSel();
    const all = zs.every(z => sel.has(z));
    zs.forEach(z => (all ? sel.delete(z) : sel.add(z)));
    syncSel();
  }
  function setSel(zs) { APP.quizSel = new Set(zs); syncSel(); }

  APP.acts['sel-cell'] = t => toggleSet([+t.dataset.z]);
  APP.acts['sel-group'] = t => toggleSet(E.filter(e => e.group === +t.dataset.v).map(e => e.z));
  APP.acts['sel-period'] = t => toggleSet(E.filter(e => e.row === +t.dataset.v).map(e => e.z));
  APP.acts['sel-f'] = t => toggleSet(E.filter(e => e.cat === (t.dataset.v === 'lan' ? 'lanthanide' : 'actinide')).map(e => e.z));
  APP.acts['sel-cat'] = t => toggleSet(E.filter(e => e.cat === t.dataset.v).map(e => e.z));
  APP.acts['sel-preset'] = t => {
    const v = t.dataset.v;
    if (v === 'none') setSel([]);
    else if (v === 'all') setSel(E.map(e => e.z));
    else if (v === '20') setSel(E.filter(e => e.z <= 20).map(e => e.z));
    else if (v === '36') setSel(E.filter(e => e.z <= 36).map(e => e.z));
    else if (v === 'weak') setSel(APP.weakest(20, true).map(e => e.z));
    else if (v === 'new') setSel(E.filter(e => e.z <= S().scope && !S().mastery[e.z]).map(e => e.z));
  };
  APP.acts['q-mode'] = t => { S().quizPrefs.mode = t.dataset.v; APP.save(); APP.render(); };
  APP.acts['q-kind'] = t => {
    const k = t.dataset.v, arr = S().quizPrefs.kinds, i = arr.indexOf(k);
    if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); } else arr.push(k);
    APP.save(); t.setAttribute('aria-pressed', arr.includes(k));
  };
  APP.acts['q-count'] = t => {
    const v = t.dataset.v;
    const p = S().quizPrefs;
    if (v === 'timed') { p.timed = true; } else { p.timed = false; p.count = +v; }
    APP.save(); APP.render();
  };

  APP.views.quiz = function () {
    const p = S().quizPrefs;
    initSel();
    const cell = APP.cellSize({ auto: true, min: 14, max: 40 });
    const table = APP.tableHTML({ mode: 'select', labels: 'select', cell, cls: e => (e.ph ? '' : (APP.quizSel.has(e.z) ? 'sel' : '')) });
    const catChips = Object.keys(CATS).map(k => `<button class="chip" data-act="sel-cat" data-v="${k}"><span class="dot c-${k}"></span>${CATS[k].short}</button>`).join('');
    const modes = Object.keys(MODES).map(k => `<button class="mode" data-act="q-mode" data-v="${k}" aria-pressed="${p.mode === k}"><span class="mi">${MODES[k].ic}</span><b>${MODES[k].t}</b><span>${MODES[k].d}</span></button>`).join('');
    const showKinds = p.mode === 'mc' || p.mode === 'type';
    const kinds = Object.keys(KIND_GROUPS).filter(k => p.mode === 'mc' || KIND_GROUPS[k].kinds.some(x => KINDS[x].typeable))
      .map(k => `<button class="chip" data-act="q-kind" data-v="${k}" aria-pressed="${p.kinds.includes(k)}">${KIND_GROUPS[k].t}</button>`).join('');
    const counts = [[10, '۱۰ سؤال'], [20, '۲۰ سؤال'], [30, '۳۰ سؤال']].map(([n, t]) => `<button class="chip" data-act="q-count" data-v="${n}" aria-pressed="${!p.timed && p.count === n}">${t}</button>`).join('')
      + `<button class="chip" data-act="q-count" data-v="timed" aria-pressed="${p.timed}">⏱ زمان‌دار (۶۰ ثانیه)</button>`;
    return `
      <div class="stack">
        <div class="setup-step card">
          <h3><span class="num-dot">۱</span> کدام قسمت جدول را می‌خواهید تمرین کنید؟</h3>
          <p class="small muted" style="margin-bottom:8px">روی خانه‌ها بزنید یا روی شمارهٔ گروه (بالا) و دوره (کنار) بزنید تا کل آن ستون یا ردیف انتخاب شود. <span class="sel-count" id="sel-count">${fa(APP.quizSel.size)}</span> عنصر انتخاب شده است.</p>
          <div class="chips" style="margin-bottom:8px">
            <button class="chip" data-act="sel-preset" data-v="20">۲۰ عنصر اول</button>
            <button class="chip" data-act="sel-preset" data-v="36">۳۶ عنصر اول</button>
            <button class="chip" data-act="sel-preset" data-v="all">همه</button>
            <button class="chip" data-act="sel-preset" data-v="weak">ضعیف‌ترین‌ها</button>
            <button class="chip" data-act="sel-preset" data-v="new">تمرین‌نشده‌ها</button>
            <button class="chip" data-act="sel-preset" data-v="none">پاک‌کردن</button>
          </div>
          <div class="chips" style="margin-bottom:8px">${catChips}</div>
          <div class="pt-scroll">${table}</div>
        </div>

        <div class="setup-step card">
          <h3><span class="num-dot">۲</span> نوع تمرین</h3>
          <div class="mode-grid">${modes}</div>
        </div>

        <div class="setup-step card stack" style="gap:12px">
          <h3 style="margin:0"><span class="num-dot">۳</span> تنظیم سؤال‌ها</h3>
          ${showKinds ? `<div><div class="small muted" style="margin-bottom:6px">چه نوع سؤالی بیاید؟</div><div class="chips wrap">${kinds}</div></div>` : ''}
          <div><div class="small muted" style="margin-bottom:6px">تعداد</div><div class="chips wrap">${counts}</div></div>
        </div>

        <button class="btn primary block" id="start-btn" data-act="q-start" style="min-height:52px;font-size:18px" ${APP.quizSel.size ? '' : 'disabled'}>شروع تمرین</button>
      </div>`;
  };

  /* ---------- سؤال‌ها ---------- */
  const lat = s => `<span class="latin">${s}</span>`;
  function pickNames(e, field, n) {
    const same = shuffle(E.filter(x => x.z !== e.z && x.cat === e.cat));
    const other = shuffle(E.filter(x => x.z !== e.z && x.cat !== e.cat));
    const out = [];
    for (const x of same.slice(0, 2).concat(other)) { if (out.length >= n) break; if (!out.some(y => y[field] === x[field])) out.push(x); }
    return out;
  }
  function nearNums(z, lo, hi, n, spread) {
    const set = new Set();
    let guard = 0;
    while (set.size < n && guard++ < 200) {
      const d = (1 + rand(spread)) * (Math.random() < .5 ? -1 : 1);
      const v = z + d;
      if (v >= lo && v <= hi && v !== z) set.add(v);
    }
    for (let v = lo; set.size < n && v <= hi; v++) if (v !== z) set.add(v);
    return [...set];
  }
  const where = e => `${e.fa} (${e.sym}) — عدد اتمی ${fa(e.z)}${e.group ? '، گروه ' + fa(e.group) : ''}، دورهٔ ${fa(e.period)}`;

  const KINDS = {
    sym2fa: { typeable: true, make(e) {
      return { prompt: 'نام فارسی این عنصر چیست؟', big: lat(e.sym), input: 'fa', answer: e.fa, check: v => matchesName(v, e),
        opts: shuffle([e, ...pickNames(e, 'fa', 3)]).map(x => ({ html: x.fa, ok: x.z === e.z })), explain: where(e) };
    } },
    fa2sym: { typeable: true, make(e) {
      return { prompt: 'نماد شیمیایی این عنصر کدام است؟', big: e.fa, bigCls: 'fa', input: 'sym', answer: e.sym, check: v => v.trim().toLowerCase() === e.sym.toLowerCase(),
        opts: shuffle([e, ...pickNames(e, 'sym', 3)]).map(x => ({ html: lat(x.sym), ok: x.z === e.z })), explain: where(e) };
    } },
    num2fa: { typeable: true, make(e) {
      return { prompt: `عنصر شمارهٔ ${fa(e.z)} کدام است؟`, big: fa(e.z), input: 'fa', answer: e.fa, check: v => matchesName(v, e),
        opts: shuffle([e, ...pickNames(e, 'fa', 3)]).map(x => ({ html: `${x.fa} (${lat(x.sym)})`, ok: x.z === e.z })), explain: where(e) };
    } },
    fa2num: { typeable: true, make(e) {
      return { prompt: 'عدد اتمی این عنصر چند است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', input: 'num', answer: fa(e.z), check: v => +normFa(v) === e.z,
        opts: shuffle([e.z, ...nearNums(e.z, 1, 118, 3, 6)]).map(n => ({ html: fa(n), ok: n === e.z })), explain: where(e) };
    } },
    group: { typeable: true, ok: e => !!e.group, make(e) {
      return { prompt: 'این عنصر در کدام گروه جدول است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', input: 'num', answer: fa(e.group), check: v => +normFa(v) === e.group,
        opts: shuffle([e.group, ...nearNums(e.group, 1, 18, 3, 4)]).map(n => ({ html: 'گروه ' + fa(n), ok: n === e.group })), explain: where(e) };
    } },
    period: { typeable: true, make(e) {
      return { prompt: 'این عنصر در کدام دورهٔ جدول است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', input: 'num', answer: fa(e.period), check: v => +normFa(v) === e.period,
        opts: shuffle([e.period, ...nearNums(e.period, 1, 7, 3, 3)]).map(n => ({ html: 'دورهٔ ' + fa(n), ok: n === e.period })), explain: where(e) };
    } },
    cat: { typeable: false, make(e) {
      const others = shuffle(Object.keys(CATS).filter(k => k !== e.cat)).slice(0, 3);
      return { prompt: 'این عنصر جزو کدام دسته است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', answer: CATS[e.cat].fa,
        opts: shuffle([e.cat, ...others]).map(k => ({ html: CATS[k].fa, ok: k === e.cat })), explain: `${e.fa} جزو «${CATS[e.cat].fa}» است.` };
    } },
    valence: { typeable: false, ok: e => !['transition', 'lanthanide', 'actinide'].includes(e.cat), make(e) {
      return { prompt: 'شمار الکترون‌های لایهٔ آخر این عنصر چند است؟', big: `${e.fa} (${lat(e.sym)})`, bigCls: 'fa', answer: fa(e.valence),
        opts: shuffle([e.valence, ...nearNums(e.valence, 1, 8, 3, 3)]).map(n => ({ html: fa(n), ok: n === e.valence })),
        explain: `${e.fa}: آرایش لایه‌ای ${e.shells.map(fa).join('، ')} و ${fa(e.valence)} الکترون در لایهٔ آخر دارد.` };
    } }
  };

  function makeQuestion(z, mode) {
    const e = E[z - 1];
    const enabled = [];
    S().quizPrefs.kinds.forEach(g => KIND_GROUPS[g].kinds.forEach(k => enabled.push(k)));
    let ks = enabled.filter(k => (mode === 'mc' || KINDS[k].typeable) && (!KINDS[k].ok || KINDS[k].ok(e)));
    if (!ks.length) ks = ['sym2fa', 'fa2sym'];
    const kind = ks[rand(ks.length)];
    return Object.assign({ kind, z }, KINDS[kind].make(e));
  }

  // نمونه‌گیری وزنی: عنصرهای ضعیف‌تر شانس بیشتری دارند
  function sample(zs, n) {
    const keyed = zs.map(z => ({ z, k: Math.pow(Math.random(), 1 / (1 / (1 + APP.box(z)) + 0.05)) }));
    keyed.sort((a, b) => b.k - a.k);
    let out = keyed.map(x => x.z).slice(0, n);
    while (out.length < n && zs.length) out = out.concat(shuffle(zs)).slice(0, n);
    return out;
  }

  /* ---------- جریان تمرین ---------- */
  let P = null; // وضعیت تمرین جاری
  let timerId = null;
  const stopTimer = () => { if (timerId) { clearInterval(timerId); timerId = null; } };

  function begin(mode, pool, opts) {
    const p = S().quizPrefs;
    const timed = opts && opts.timed != null ? opts.timed : p.timed;
    const count = opts && opts.count || p.count;
    P = { mode, pool, timed, count, i: 0, right: 0, wrong: [], seen: 0, q: null, done: false, locked: false, timeLeft: 60, requeued: new Set() };
    if (mode === 'flash') {
      P.deck = sample(pool, Math.min(pool.length, timed ? 40 : count));
      P.total = P.deck.length;
    } else {
      P.items = timed ? null : sample(pool, count);
      P.total = timed ? 0 : count;
    }
    APP.go('#/play');
  }

  APP.acts['q-start'] = () => {
    const pool = [...initSel()].sort((a, b) => a - b);
    if (!pool.length) { APP.toast('اول بخشی از جدول را انتخاب کنید'); return; }
    begin(S().quizPrefs.mode, pool);
  };
  APP.acts['practice-weak'] = () => begin('mc', APP.weakest(10, true).map(e => e.z), { count: 10, timed: false });
  const goPractice = zs => { APP.quizSel = new Set(zs); APP.closeSheet(); APP.go('#/quiz'); };
  APP.acts['practice-group'] = t => { const g = E[+t.dataset.z - 1].group; goPractice(E.filter(e => e.group === g).map(e => e.z)); };
  APP.acts['practice-period'] = t => { const p = E[+t.dataset.z - 1].row; goPractice(E.filter(e => e.row === p).map(e => e.z)); };
  APP.acts['practice-cat'] = t => { const c = E[+t.dataset.z - 1].cat; goPractice(E.filter(e => e.cat === c).map(e => e.z)); };

  APP.views.play = function () {
    if (!P) { setTimeout(() => APP.go('#/quiz'), 0); return ''; }
    APP.onLeave = () => { stopTimer(); };
    if (P.done) return resultHTML();
    if (P.mode === 'flash') return flashHTML();
    nextQuestion(true);
    APP.afterRender = () => APP.afterPlayRender();
    return playHTML();
  };

  function topBar() {
    const total = P.timed ? '∞' : fa(P.total);
    const pr = P.timed ? 0 : Math.round(P.i / P.total * 100);
    return `<div class="q-top">
      <button class="icon-btn" data-act="q-quit" aria-label="خروج">✕</button>
      <div class="bar ${P.timed ? 'time' : ''}"><i id="q-bar" style="width:${P.timed ? (P.timeLeft / 60 * 100) : pr}%"></i></div>
      <span class="badge" id="q-count">${P.timed ? '⏱ ' + fa(P.timeLeft) : fa(Math.min(P.i + 1, P.total)) + ' / ' + total}</span>
    </div>`;
  }

  function nextQuestion(first) {
    if (!P.timed && P.i >= P.total) return finish();
    const z = P.timed ? sample(P.pool, 1)[0] : P.items[P.i];
    P.q = P.mode === 'place' ? { kind: 'place', z } : makeQuestion(z, P.mode);
    P.locked = false;
    if (P.timed && first && !timerId) {
      timerId = setInterval(() => {
        P.timeLeft--;
        const b = $('#q-bar'), c = $('#q-count');
        if (b) b.style.width = (P.timeLeft / 60 * 100) + '%';
        if (c) c.textContent = '⏱ ' + fa(Math.max(0, P.timeLeft));
        if (P.timeLeft <= 0) finish();
      }, 1000);
    }
  }

  function playHTML() {
    const q = P.q, e = E[q.z - 1];
    if (P.mode === 'place') {
      const cell = APP.cellSize({ auto: true, min: 20, max: 46 });
      return `<div class="stack">${topBar()}
        <div class="card center"><div class="q-prompt">جای این عنصر را روی جدول نشان بدهید</div>
          <div class="q-big fa">${e.fa} <span class="sym" style="color:var(--ink-2)">(${e.sym})</span></div></div>
        <div id="fb"></div>
        <div class="pt-scroll">${APP.tableHTML({ mode: 'place', cell })}</div></div>`;
    }
    let body;
    if (P.mode === 'type') {
      body = `<input id="ans" class="type-input" type="text" inputmode="${q.input === 'num' ? 'numeric' : 'text'}" dir="${q.input === 'sym' ? 'ltr' : 'rtl'}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${q.input === 'fa' ? 'نام فارسی را بنویسید' : q.input === 'sym' ? 'نماد (مثل Na)' : 'یک عدد بنویسید'}" aria-label="پاسخ">
        <div class="row" style="margin-top:12px;justify-content:center"><button class="btn primary grow" data-act="q-submit">ثبت پاسخ</button><button class="btn" data-act="q-hint">راهنمایی</button><button class="btn ghost" data-act="q-skip">نمی‌دانم</button></div>`;
    } else {
      body = `<div class="opts ${q.opts.some(o => o.html.length > 14) ? '' : 'grid2'}">${q.opts.map((o, i) => `<button class="opt" data-act="q-pick" data-i="${i}">${o.html}</button>`).join('')}</div>`;
    }
    return `<div class="stack">${topBar()}
      <div class="card q-card"><div class="q-prompt">${q.prompt}</div><div class="q-big ${q.bigCls || ''}">${q.big}</div>${body}<div id="fb"></div></div></div>`;
  }
  APP.afterPlayRender = () => { const a = $('#ans'); if (a) a.focus(); };

  function feedback(ok, q, extra) {
    const fb = $('#fb'); if (!fb) return;
    const last = !P.timed && P.i + 1 >= P.total;
    fb.innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? '✅ درست!' : '❌ پاسخ درست: ' + (q.answer || '')}<span class="more">${(extra || '') + q.explain}</span>
      ${P.timed ? '' : `<button class="btn primary block" style="margin-top:10px" data-act="q-next" id="next-btn">${last ? 'دیدن نتیجه' : 'سؤال بعدی'}</button>`}</div>`;
    const nb = $('#next-btn'); if (nb) nb.focus({ preventScroll: true });
  }

  function settle(ok, q, extra) {
    if (P.locked) return;
    P.locked = true; P.seen++;
    APP.fx.play(ok ? 'good' : 'bad');
    if (!ok) { const card = $('.q-card') || $('.pt.place'); if (card) { card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); } }
    else { const card = $('.q-card'); if (card) { card.classList.remove('pulse'); void card.offsetWidth; card.classList.add('pulse'); } }
    APP.record(q.z, ok);
    if (ok) { P.right++; APP.addXP(10); } else if (!P.wrong.includes(q.z)) P.wrong.push(q.z);
    APP.save();
    if (q.kind === 'place') placeFeedback(ok, q); else feedback(ok, q, extra);
    if (P.timed) setTimeout(() => { if (P && !P.done) { P.i++; nextQuestion(); rerenderPlay(); } }, ok ? 450 : 1400);
  }
  function placeFeedback(ok, q) {
    const e = E[q.z - 1];
    const fb = $('#fb'); if (!fb) return;
    const last = !P.timed && P.i + 1 >= P.total;
    fb.innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}">${ok ? '✅ درست!' : '❌ اینجا نبود؛ جای درست با رنگ سبز نشان داده شد.'}<span class="more">${where(e)}</span>
      ${P.timed ? '' : `<button class="btn primary block" style="margin-top:10px" data-act="q-next" id="next-btn">${last ? 'دیدن نتیجه' : 'سؤال بعدی'}</button>`}</div>`;
  }
  function rerenderPlay() {
    if (APP.route().name !== 'play') return;
    $('#view').innerHTML = P.done ? resultHTML() : P.mode === 'flash' ? flashHTML() : playHTML();
    APP.afterPlayRender();
  }

  APP.acts['q-pick'] = t => {
    const q = P.q; if (P.locked) return;
    const i = +t.dataset.i;
    $$('.opt').forEach((b, k) => { b.disabled = true; if (q.opts[k].ok) b.classList.add('good'); });
    if (!q.opts[i].ok) t.classList.add('bad');
    settle(q.opts[i].ok, q);
  };
  APP.acts['q-submit'] = () => {
    const q = P.q; if (P.locked) return;
    const inp = $('#ans'); const v = inp.value;
    if (!v.trim()) { inp.focus(); return; }
    inp.disabled = true;
    settle(!!q.check(v), q, v.trim() && !q.check(v) ? `پاسخ شما: ${v.trim()}. ` : '');
  };
  APP.acts['q-skip'] = () => { if (P.locked) return; const inp = $('#ans'); if (inp) inp.disabled = true; settle(false, P.q, 'اشکالی ندارد؛ این‌بار یاد می‌گیرید. '); };
  APP.acts['q-hint'] = () => {
    const q = P.q, inp = $('#ans'); if (!inp || P.locked) return;
    const a = String(q.answer).replace(/<[^>]+>/g, '');
    inp.placeholder = 'حرف اول: ' + a[0] + ' — تعداد حروف: ' + fa(a.length);
    P.hinted = true; inp.focus();
  };
  APP.acts['q-next'] = () => { P.i++; nextQuestion(); if (P.done) return; rerenderPlay(); };
  APP.acts['q-quit'] = () => {
    if (P && P.seen && !P.done && !confirm('تمرین نیمه‌کاره بماند؟ نتیجه‌ها تا همین‌جا ثبت می‌شود.')) return;
    if (P && P.seen && !P.done) finish(); else { stopTimer(); P = null; APP.go('#/quiz'); }
  };
  APP.acts['place-pick'] = t => {
    if (!P || P.mode !== 'place' || P.locked) return;
    const z = +t.dataset.z, target = P.q.z;
    const ok = z === target;
    const tiles = $$('.pt.place .el');
    t.classList.add(ok ? 'good' : 'bad');
    if (!ok) { const r = tiles.find(b => +b.dataset.z === target); if (r) r.classList.add('reveal'); }
    settle(ok, P.q);
  };
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && P && !P.done && APP.route().name === 'play') {
      if (P.locked) { const nb = $('#next-btn'); if (nb) nb.click(); }
      else if ($('#ans')) APP.acts['q-submit']();
    }
  });

  /* ---------- کارت حفظی ---------- */
  function flashHTML() {
    const z = P.deck[P.i], e = E[z - 1];
    P.fz = z;
    const pr = Math.round(P.i / P.deck.length * 100);
    return `<div class="stack">
      <div class="q-top"><button class="icon-btn" data-act="q-quit" aria-label="خروج">✕</button><div class="bar"><i style="width:${pr}%"></i></div><span class="badge">${fa(Math.min(P.i + 1, P.deck.length))} / ${fa(P.deck.length)}</span></div>
      <div class="flash" id="flash" data-act="flip" role="button" tabindex="0" aria-label="برگرداندن کارت">
        <div class="flash-in">
          <div class="face front"><div class="q-prompt">این عنصر چیست؟</div><div class="q-big">${lat(e.sym)}</div><div class="hint">برای دیدن پاسخ بزنید</div></div>
          <div class="face back c-${e.cat}" style="color:#1d2733">
            <div class="q-big fa" style="margin:0">${e.fa}</div>
            <div class="latin" style="opacity:.75">${e.en}</div>
            <div style="margin-top:8px;font-weight:700">عدد اتمی ${fa(e.z)} · ${e.group ? 'گروه ' + fa(e.group) + ' · ' : ''}دورهٔ ${fa(e.period)}</div>
            <div class="small" style="opacity:.8">${CATS[e.cat].fa}</div>
          </div>
        </div>
      </div>
      <div class="row" id="flash-btns" style="visibility:hidden">
        <button class="btn grow" data-act="flash-rate" data-v="0">😕 نمی‌دانستم</button>
        <button class="btn primary grow" data-act="flash-rate" data-v="1">😃 می‌دانستم</button>
      </div></div>`;
  }
  APP.acts.flip = () => {
    const f = $('#flash'); if (!f) return;
    APP.fx.play('flip');
    f.classList.toggle('flipped');
    const b = $('#flash-btns'); if (b) b.style.visibility = 'visible';
  };
  APP.acts['flash-rate'] = t => {
    const ok = t.dataset.v === '1', z = P.fz;
    APP.fx.play(ok ? 'good' : 'tap');
    APP.record(z, ok); P.seen++;
    if (ok) { P.right++; APP.addXP(5); }
    else {
      if (!P.wrong.includes(z)) P.wrong.push(z);
      if (!P.requeued.has(z)) { P.requeued.add(z); P.deck.push(z); }
    }
    APP.save();
    P.i++;
    if (P.i >= P.deck.length) return finish();
    rerenderPlay();
  };

  /* ---------- نتیجه ---------- */
  function finish() {
    if (!P || P.done) return;
    stopTimer();
    P.done = true;
    const total = P.mode === 'flash' ? P.seen : P.seen;
    S().sessions.push({ mode: MODES[P.mode].t + (P.timed ? ' (زمان‌دار)' : ''), right: P.right, total, t: Date.now() });
    if (S().sessions.length > 30) S().sessions.shift();
    if (P.seen) APP.touchStreak();
    APP.save();
    rerenderPlay();
    if (P.seen && P.right / P.seen >= 0.8) { APP.fx.play('win'); APP.fx.confetti(); } else if (P.seen) APP.fx.play('nav');
  }
  function resultHTML() {
    const total = P.seen, pct = total ? Math.round(P.right / total * 100) : 0;
    const msg = !total ? 'هنوز پاسخی ثبت نشد.' : pct === 100 ? 'بی‌نقص بود! 🏆' : pct >= 80 ? 'عالی! 🎉' : pct >= 50 ? 'خوب پیش می‌روید 👍' : 'ناامید نشوید؛ تکرار، کلید یادگیری است 💪';
    const wrong = P.wrong.map(z => { const e = E[z - 1]; return `<button class="wrong-item" data-act="detail-open" data-z="${z}"><span class="tile c-${e.cat}">${e.sym}</span><span class="grow"><b>${e.fa}</b><br><span class="small muted">عدد اتمی ${fa(e.z)}${e.group ? ' · گروه ' + fa(e.group) : ''} · دورهٔ ${fa(e.period)}</span></span></button>`; }).join('');
    return `<div class="stack">
      <div class="card center"><div class="muted">نتیجهٔ تمرین</div><div class="result-score">${fa(pct)}٪</div>
        <p><b>${fa(P.right)}</b> پاسخ درست از <b>${fa(total)}</b> — ${msg}</p>

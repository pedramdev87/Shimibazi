/* ===== pdf.js ===== */
/* ساخت PDF بدون هیچ کتابخانه‌ای:
   صفحه‌های A4 روی canvas (با همان فونت برنامه و راست‌به‌چپ درست) کشیده می‌شوند و به‌صورت تصویر JPEG
   در یک فایل PDF معتبر قرار می‌گیرند؛ پس کاملاً آفلاین کار می‌کند و فارسی هم خراب نمی‌شود. */
(function () {
  'use strict';
  const { fa } = APP.u;

  const PW = 1654, PH = 2339;           // A4 با ۲۰۰ نقطه در اینچ
  const M = 140, CW = PW - 2 * M;       // حاشیه و عرض محتوا
  const BOTTOM = PH - M - 40;           // پایین‌ترین جای مجاز برای متن
  const INK = '#14202b', MUTED = '#5b6b78', LINE = '#7d8b96';

  const fontFam = () => (getComputedStyle(document.body).fontFamily || 'Tahoma, sans-serif');
  const F = (px, w) => `${w || 400} ${px}px ${fontFam()}`;

  function wrap(x, text, font, maxW) {
    x.font = font;
    const out = [];
    String(text).split('\n').forEach(par => {
      const words = par.split(/\s+/).filter(Boolean);
      let cur = '';
      words.forEach(w => {
        const t = cur ? cur + ' ' + w : w;
        if (cur && x.measureText(t).width > maxW) { out.push(cur); cur = w; } else cur = t;
      });
      out.push(cur);
    });
    return out;
  }

  function Doc() { this.pages = []; this.newPage(); }
  Doc.prototype.newPage = function () {
    const c = document.createElement('canvas');
    c.width = PW; c.height = PH;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, PW, PH);
    x.direction = 'rtl'; x.textBaseline = 'alphabetic'; x.textAlign = 'right';
    this.c = c; this.x = x; this.y = M; this.pages.push(c);
  };
  Doc.prototype.ensure = function (h) { if (this.y + h > BOTTOM) this.newPage(); };
  Doc.prototype.text = function (str, xr, y, font, color, align) {
    const x = this.x;
    x.font = font; x.fillStyle = color || INK; x.textAlign = align || 'right';
    x.fillText(str, xr, y);
  };
  Doc.prototype.width = function (str, font) { this.x.font = font; return this.x.measureText(str).width; };
  Doc.prototype.hline = function (x1, x2, y, w, color, dash) {
    const x = this.x;
    x.strokeStyle = color || LINE; x.lineWidth = w || 2; x.setLineDash(dash || []);
    x.beginPath(); x.moveTo(x1, y); x.lineTo(x2, y); x.stroke(); x.setLineDash([]);
  };

  /* ---------- سربرگ ---------- */
  Doc.prototype.header = function (spec) {
    const mid = PW / 2;
    this.y += 56;
    this.text(spec.title, mid, this.y, F(66, 800), '#0f3d57', 'center');
    this.y += 24;
    if (spec.sub) { this.y += 50; this.text(spec.sub, mid, this.y, F(38, 500), MUTED, 'center'); }
    this.y += 76;
    if (spec.kind === 'q') {
      // نام و تاریخ و نمره
      const GAP = 34, fields = [['نام و نام خانوادگی:', .52], ['تاریخ:', .30], ['نمره:', .18]];
      const lw = fields.map(([t]) => this.width(t, F(36, 600)) + 16);
      const free = CW - lw.reduce((a, b) => a + b, 0) - GAP * (fields.length - 1);
      let xr = PW - M;
      fields.forEach(([t, share], i) => {
        this.text(t, xr, this.y, F(36, 600), INK);
        const len = free * share;
        this.hline(xr - lw[i], xr - lw[i] - len, this.y + 6, 2, LINE, [3, 7]);
        xr -= lw[i] + len + GAP;
      });
      this.y += 62;
      if (spec.teacher) { this.text('دبیر: ' + spec.teacher, PW - M, this.y, F(34, 500), MUTED); this.y += 30; }
    } else if (spec.teacher) {
      this.text('دبیر: ' + spec.teacher, mid, this.y - 28, F(34, 500), MUTED, 'center'); this.y += 10;
    }
    this.hline(M, PW - M, this.y, 5, '#0f3d57');
    this.y += 50;
  };

  /* ---------- سؤال‌ها ---------- */
  const LH = 68, NUMW = 96;
  Doc.prototype.question = function (it, i, style) {
    const x = this.x, tw = CW - NUMW, xr = PW - M - NUMW;
    const pf = F(42, 400), bf = F(46, 700);
    const lines = wrap(x, it.p, pf, tw);
    let bigLine = false;
    if (it.b) {
      const lastW = this.width(lines[lines.length - 1], pf), bw = this.width(it.b, bf);
      if (lastW + 34 + bw > tw) bigLine = true;
    }
    // گزینه‌ها
    let optRows = [], twoCols = false;
    if (style === 'test' && it.opts && it.opts.length) {
      const of = F(40, 400);
      const half = tw / 2 - 110;
      twoCols = it.opts.every(o => this.width(o.t, of) <= half);
      optRows = twoCols ? [[0, 1], [2, 3]].map(r => r.filter(k => it.opts[k])) : it.opts.map((_, k) => [k]);
    }
    const lineCount = lines.length + (bigLine ? 1 : 0);
    const optH = optRows.length * (LH - 4) + (optRows.length ? 14 : 0);
    const ansH = style === 'test' ? optH : 92;
    const h = lineCount * LH + ansH + 40;
    this.ensure(h);
    let y = this.y + 46;
    this.text(fa(i + 1) + '.', PW - M, y, F(44, 800), '#0f3d57');
    lines.forEach((ln, k) => {
      this.text(ln, PW - M - NUMW, y, pf, INK);
      if (k === lines.length - 1 && it.b && !bigLine) {
        const w = this.width(ln, pf);
        this.text(it.b, PW - M - NUMW - w - 34, y, bf, '#0f3d57');
      }
      y += LH;
    });
    if (bigLine) { this.text(it.b, PW - M - NUMW - 20, y - 2, bf, '#0f3d57'); y += LH; }
    if (style === 'test') {
      y -= 8;
      const of = F(40, 400);
      optRows.forEach(row => {
        row.forEach((k, ci) => {
          const ox = twoCols ? xr - 10 - ci * (tw / 2) : xr - 10;
          this.text('(' + fa(k + 1) + ')', ox, y, F(40, 700), MUTED);
          this.text(it.opts[k].t, ox - 96, y, of, INK);
        });
        y += LH - 4;
      });
    } else {
      this.hline(M, PW - M - NUMW, y + 30, 2, '#a9b4bc', [2, 8]);
      y += 92 - 24;
    }
    this.y = y + 26;
  };

  /* ---------- پاسخنامه ---------- */
  Doc.prototype.answers = function (items, style) {
    const af = F(40, 500);
    const texts = items.map(it => (style === 'test' && it.opts ? '(' + fa(it.opts.findIndex(o => o.ok) + 1) + ')  ' : '') + it.a);
    const widest = Math.max(...texts.map(t => this.width(t, af)));
    const colW0 = widest + NUMW + 50;
    const cols = Math.max(1, Math.min(3, Math.floor(CW / colW0)));
    const colW = CW / cols;
    const rowsN = Math.ceil(items.length / cols);
    for (let r = 0; r < rowsN; r++) {
      this.ensure(LH + 8);
      const y = this.y + 48;
      for (let c = 0; c < cols; c++) {
        const k = r * cols + c; if (k >= items.length) break;
        const xr = PW - M - c * colW;
        this.text(fa(k + 1) + '.', xr, y, F(40, 800), '#0f3d57');
        this.text(texts[k], xr - NUMW, y, af, INK);
      }
      this.hline(M, PW - M, y + 20, 1.5, '#e3e8ec');
      this.y += LH + 6;
    }
  };

  Doc.prototype.footers = function (label) {
    const n = this.pages.length;
    this.pages.forEach((c, i) => {
      const x = c.getContext('2d');
      x.direction = 'rtl'; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
      x.strokeStyle = '#d3dbe1'; x.lineWidth = 2;
      x.beginPath(); x.moveTo(M, PH - M + 10); x.lineTo(PW - M, PH - M + 10); x.stroke();
      x.font = F(30, 500); x.fillStyle = MUTED;
      x.fillText(`${label}  ·  شیمی بازی  ·  صفحهٔ ${fa(i + 1)} از ${fa(n)}`, PW / 2, PH - M + 62);
    });
  };

  /* ---------- نوشتن فایل PDF ---------- */
  const toJpeg = c => new Promise((res, rej) => c.toBlob(b => (b ? b.arrayBuffer().then(a => res(new Uint8Array(a))) : rej(new Error('jpeg'))), 'image/jpeg', 0.92));

  function writePDF(jpegs) {
    const enc = new TextEncoder();
    const chunks = [], offs = [];
    let len = 0;
    const put = d => { const u8 = typeof d === 'string' ? enc.encode(d) : d; chunks.push(u8); len += u8.length; };
    const obj = (id, body) => { offs[id] = len; put(`${id} 0 obj\n`); put(body); put('\nendobj\n'); };
    const n = jpegs.length, W = 595, H = 842;
    put('%PDF-1.4\n');
    put(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    const kids = jpegs.map((_, i) => `${3 + i * 3} 0 R`).join(' ');
    obj(2, `<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
    jpegs.forEach((j, i) => {
      const pg = 3 + i * 3, ct = pg + 1, im = pg + 2;
      obj(pg, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${im} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${ct} 0 R >>`);
      const cs = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
      obj(ct, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
      offs[im] = len;
      put(`${im} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${PW} /Height ${PH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`);
      put(j); put('\nendstream\nendobj\n');
    });
    const total = 3 + n * 3;
    const xref = len;
    let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
    put(x);
    put(`trailer\n<< /Size ${total} /Root 1 0 R /Info << /Title (Shimi Bazi) /Producer (Shimi Bazi) >> >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(chunks, { type: 'application/pdf' });
  }

  async function fontsReady() {
    try {
      if (document.fonts && document.fonts.load) {
        await Promise.race([
          Promise.all([document.fonts.load('400 40px Vazirmatn'), document.fonts.load('700 40px Vazirmatn'), document.fonts.load('800 40px Vazirmatn')]),
          new Promise(r => setTimeout(r, 1500))
        ]);
      }
    } catch (e) { /* فونت سیستم جایگزین می‌شود */ }
  }

  // spec: { kind: 'q' | 'key', title, sub, teacher, style: 'written' | 'test', items: [{ p, b, opts, a }] }
  async function make(spec) {
    await fontsReady();
    const d = new Doc();
    d.header(Object.assign({}, spec, { title: spec.kind === 'key' ? 'پاسخنامه' : spec.title, sub: spec.kind === 'key' ? spec.title : spec.sub }));
    if (spec.kind === 'key') d.answers(spec.items, spec.style);
    else spec.items.forEach((it, i) => d.question(it, i, spec.style));
    d.footers(spec.kind === 'key' ? 'پاسخنامه' : 'سؤال‌ها');
    const jpegs = [];
    for (const c of d.pages) jpegs.push(await toJpeg(c));
    const pages = d.pages.length;
    d.pages.forEach(c => { c.width = 1; c.height = 1; }); // آزادسازی حافظه
    return { blob: writePDF(jpegs), pages };
  }

  function save(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  APP.pdf = { make, save, _Doc: Doc };
})();

/* ===== teacher.js ===== */
/* بخش استاد: پنل پیشرفت دانش‌آموزان + ابزار تدریس */
(function () {
  'use strict';
  const { E, CATS, u } = APP;
  const { $, $$, fa, shuffle, rand, esc, normFa } = u;
  const S = () => APP.S();
  const dateFa = t => { try { return new Date(t).toLocaleDateString('fa-IR'); } catch (e) { return ''; } };
  const timeFa = t => { try { const d = new Date(t); return `<bdi>${d.toLocaleDateString('fa-IR')}</bdi> <bdi>${d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' })}</bdi>`; } catch (e) { return ''; } };
  const fitCell = (w, min, max) => {
    const phone = window.innerWidth < 640;
    const v = Math.floor((w - (phone ? 14 : 22) - 18 * (phone ? 2 : 3)) / 18);
    return u.clamp(v, min || 12, max || 40);
  };

  /* =====================================================================
     دانش‌آموزان (پنل استاد)
     ===================================================================== */
  const pctOf = m => { let sum = 0; for (let i = 0; i < m.length; i++) sum += +m[i]; return Math.round(sum / (5 * m.length) * 100); };
  const accOf = r => (r.a[0] ? Math.round(r.a[1] / r.a[0] * 100) : 0);

  function sanitize(r) {
    if (!r || r.v !== 1 || typeof r.n !== 'string' || typeof r.m !== 'string' || !/^[0-5]{118}$/.test(r.m)) return null;
    const num = x => (isFinite(+x) ? +x : 0);
    return {
      v: 1, n: r.n.replace(/[<>]/g, '').slice(0, 60), t: num(r.t) || Date.now(), x: num(r.x), y: num(r.y),
      a: [num(r.a && r.a[0]), num(r.a && r.a[1])], m: r.m,
      c: (r.c || []).filter(a => Array.isArray(a) && a[0] >= 1 && a[0] <= 118).map(a => [num(a[0]), num(a[1]), num(a[2])]),
      l: (r.l || []).filter(a => Array.isArray(a) && a[0] >= 0 && a[0] < LESSONS.length).map(a => [num(a[0]), num(a[1])]),
      k: (r.k || []).filter(i => Number.isInteger(i) && i >= 0 && i < APP.compounds.ALL.length),
      rx: Math.max(0, Math.min(num(r.rx), 1000)), rb: Math.max(0, Math.min(num(r.rb), 100000)),
      q: (r.q || []).slice(-8).map(a => [String(a[0] || '').slice(0, 40), num(a[1]), num(a[2]), num(a[3])])
    };
  }
  function addReport(r) {
    const roster = S().roster;
    const key = normFa(r.n);
    const e = roster[key] || { name: r.n, hist: [] };
    if (e.last && e.last.t >= r.t) return 'dup';
    e.name = r.n; e.last = r;
    e.hist.push({ t: r.t, p: pctOf(r.m), a: accOf(r), x: r.x });
    if (e.hist.length > 40) e.hist.shift();
    roster[key] = e;
    return 'ok';
  }
  const students = () => Object.keys(S().roster).map(k => Object.assign({ key: k }, S().roster[k]));

  /* ---------- نمای پنل ---------- */
  let sortBy = 'name';
  let panelMsg = '';

  APP.views.panel = function () {
    const list = students();
    const n = list.length;
    let overview = '';
    if (n) {
      const avgP = Math.round(list.reduce((a, s) => a + pctOf(s.last.m), 0) / n);
      const avgAcc = Math.round(list.reduce((a, s) => a + accOf(s.last), 0) / n);
      const avgBox = z => list.reduce((a, s) => a + (+s.last.m[z - 1]), 0) / n;
      const weakest = E.map(e => ({ e, b: avgBox(e.z) })).sort((a, b) => a.b - b.b).slice(0, 8);
      const cell = fitCell(Math.min(window.innerWidth, 1100) - 66, 12, 34);
      const table = APP.tableHTML({ mode: 'heat', cell, overlay: false, boxOf: z => Math.round(avgBox(z)) });
      overview = `
        <div class="stat-grid">
          <div class="stat"><b>${fa(n)}</b><span>دانش‌آموز</span></div>
          <div class="stat"><b>${fa(avgP)}٪</b><span>میانگین تسلط کلاس</span></div>
          <div class="stat"><b>${fa(avgAcc)}٪</b><span>میانگین دقت پاسخ‌ها</span></div>
          <div class="stat"><b>${dateFa(Math.max(...list.map(s => s.last.t)))}</b><span>آخرین گزارش</span></div>
        </div>
        <div class="card stack" style="gap:10px">
          <div class="section-title" style="margin:0">نقشهٔ ضعف کلاس</div>
          <p class="small muted">میانگین تسلط همهٔ دانش‌آموزان روی هر عنصر؛ هر چه سبزتر، کلاس بهتر بلد است.</p>
          <div class="mastery-legend">
            <span style="--c:var(--m0)">کم</span><span style="--c:var(--m2)">متوسط</span><span style="--c:var(--m4)">خوب</span><span style="--c:var(--m5)">عالی</span>
          </div>
          <div class="pt-scroll">${table}</div>
          <div class="small muted">ضعیف‌ترین عنصرهای کلاس:</div>
          <div class="chips wrap">${weakest.map(w => `<span class="chip"><span class="dot c-${w.e.cat}"></span>${w.e.fa} <span class="sym">${w.e.sym}</span></span>`).join('')}</div>
        </div>`;
    }
    const sorted = list.slice().sort((a, b) => {
      if (sortBy === 'p') return pctOf(b.last.m) - pctOf(a.last.m);
      if (sortBy === 'low') return pctOf(a.last.m) - pctOf(b.last.m);
      if (sortBy === 't') return b.last.t - a.last.t;
      return a.name.localeCompare(b.name, 'fa');
    });
    const rows = sorted.map(s => {
      const p = pctOf(s.last.m);
      return `<button class="stu-row" data-act="panel-open" data-k="${esc(s.key)}">
        <span class="stu-ava">${esc(s.name.trim()[0] || '؟')}</span>
        <span class="grow"><b>${esc(s.name)}</b><br><span class="small muted">آخرین گزارش: ${dateFa(s.last.t)} · دقت ${fa(accOf(s.last))}٪ · ${fa(s.last.x)} امتیاز</span>
          <span class="bar" style="display:block;margin-top:6px"><i style="width:${p}%"></i></span></span>
        <span class="stu-pct">${fa(p)}٪</span></button>`;
    }).join('');
    return `
      <div class="stack">
        <div class="card hero-card">
          <div class="section-title" style="margin:0;color:#fff">🧑‍🏫 پنل استاد</div>
          <p class="small">متن رمزگذاری‌شده‌ای که دانش‌آموزان از بخش «پیشرفت برای استاد» می‌فرستند را اینجا بچسبانید تا روند یادگیری‌شان را ببینید.</p>
        </div>

        <div class="card stack" style="gap:10px">
          <div class="section-title" style="margin:0">افزودن گزارش دانش‌آموز</div>
          <textarea id="p-paste" class="selectable report-text" rows="4" dir="ltr" placeholder="متن (یا چند متن پشت‌سرهم) را اینجا بچسبانید…" aria-label="چسباندن گزارش"></textarea>
          <button class="btn primary block" data-act="panel-add">افزودن به فهرست</button>
          <div id="p-msg" class="c-msg ${panelMsg ? 'show' : ''}" role="status">${panelMsg}</div>
        </div>

        ${n ? overview : '<div class="card center muted"><div style="font-size:42px">📭</div><p>هنوز گزارشی اضافه نکرده‌اید. وقتی دانش‌آموزی متنش را فرستاد، اینجا بچسبانید.</p></div>'}

        ${n ? `<div class="card stack" style="gap:10px">
          <div class="row"><div class="section-title grow" style="margin:0">دانش‌آموزان (${fa(n)})</div>
            <div class="seg" role="group">
              ${[['name', 'نام'], ['p', 'بهترین'], ['low', 'ضعیف‌ترین'], ['t', 'تازه‌ترین']].map(([v, t]) => `<button data-act="panel-sort" data-v="${v}" aria-pressed="${sortBy === v}">${t}</button>`).join('')}
            </div></div>
          <div class="stu-list">${rows}</div>
        </div>` : ''}

        <div class="card stack" style="gap:10px">
          <div class="section-title" style="margin:0">پشتیبان فهرست</div>
          <p class="small muted">فهرست دانش‌آموزان فقط روی همین دستگاه ذخیره می‌شود. برای انتقال به دستگاه دیگر، پشتیبان بسازید و آن را در پنل آن دستگاه بچسبانید.</p>
          <div class="row"><button class="btn sm grow" data-act="roster-backup" ${n ? '' : 'disabled'}>ساخت متن پشتیبان</button>
            <button class="btn sm grow" data-act="roster-clear" style="color:var(--bad)" ${n ? '' : 'disabled'}>پاک‌کردن فهرست</button></div>
          <div id="backup-out"></div>
        </div>
      </div>`;
  };

  APP.acts['panel-sort'] = t => { sortBy = t.dataset.v; panelMsg = ''; APP.render(); };
  APP.acts['panel-add'] = () => {
    const ta = $('#p-paste'); if (!ta) return;
    const tokens = APP.secure.findTokens(ta.value);
    let ok = 0, dup = 0, bad = 0, restored = 0;
    const roster = S().roster;
    tokens.forEach(tk => {
      if (tk.startsWith('SBR.')) {
        const d = APP.secure.open(tk, 'SBR');
        if (d && d.r && typeof d.r === 'object') {
          Object.keys(d.r).forEach(k => {
            const e = d.r[k], last = e && sanitize(e.last);
            if (!last) return;
            const mine = roster[k];
            if (!mine || mine.last.t < last.t) { roster[k] = { name: last.n, last, hist: Array.isArray(e.hist) ? e.hist.slice(-40) : [] }; restored++; }
          });
        } else bad++;
        return;
      }
      const r = sanitize(APP.secure.open(tk, 'SB1'));
      if (!r) { bad++; return; }
      addReport(r) === 'ok' ? ok++ : dup++;
    });
    if (!tokens.length) { panelMsg = 'متنی شبیه گزارش پیدا نشد. متن کامل را بچسبانید.'; APP.fx.play('bad'); }
    else {
      APP.save();
      const parts = [];
      if (ok) parts.push(`${fa(ok)} گزارش اضافه شد`);
      if (restored) parts.push(`${fa(restored)} دانش‌آموز از پشتیبان بازیابی شد`);
      if (dup) parts.push(`${fa(dup)} گزارش تکراری یا قدیمی‌تر بود`);
      if (bad) parts.push(`${fa(bad)} متن نامعتبر یا دست‌کاری‌شده بود`);
      panelMsg = parts.join('، ') + '.';
      APP.fx.play(ok || restored ? 'build' : 'bad');
      if (ok || restored) APP.fx.confetti({ n: 24 });
    }
    APP.render();
  };

  function detailHTML(k) {
    const st = S().roster[k]; if (!st) return '';
    const r = st.last, p = pctOf(r.m), acc = accOf(r);
    const mastered = [...r.m].filter(c => +c >= 4).length;
    const learning = [...r.m].filter(c => +c >= 1 && +c < 4).length;
    const cell = fitCell(Math.min(window.innerWidth, 680) - 70, 12, 24);
    const table = APP.tableHTML({ mode: 'heat', cell, overlay: false, boxOf: z => +r.m[z - 1] });
    const wrongBy = {}; r.c.forEach(c => (wrongBy[c[0]] = c));
    const weak = E.filter(e => wrongBy[e.z] && wrongBy[e.z][2] > 0 && +r.m[e.z - 1] <= 2)
      .sort((a, b) => (+r.m[a.z - 1]) - (+r.m[b.z - 1]) || wrongBy[b.z][2] - wrongBy[a.z][2]).slice(0, 10);
    const lessons = LESSONS.map((L, i) => { const f = r.l.find(a => a[0] === i); return `<div class="les-row ${f ? 'done' : ''}"><span>${f ? '✓' : '○'}</span><span class="grow">${L.title}</span><span class="small muted">${f ? fa(f[1]) + '٪' : ''}</span></div>`; }).join('');
    const comps = r.k.map(i => APP.compounds.ALL[i]).map(c => `<span class="chip"><b class="sym">${APP.subHTML(c.f)}</b> ${esc(c.n.split(' (')[0])}</span>`).join('');
    const quizzes = r.q.slice().reverse().map(q => `<div class="les-row"><span class="grow">${esc(q[0])}</span><span class="small muted">${fa(q[1])} از ${fa(q[2])} · ${fa(q[2] ? Math.round(q[1] / q[2] * 100) : 0)}٪</span></div>`).join('');
    return `
      <div class="sheet-head"><h2>${esc(st.name)}</h2><button class="icon-btn" data-act="close-sheet" aria-label="بستن">✕</button></div>
      <p class="small muted" style="margin-bottom:10px">آخرین گزارش: ${timeFa(r.t)} · ${fa(st.hist.length)} گزارش ثبت‌شده</p>
      <div class="stat-grid" style="margin-bottom:12px">
        <div class="stat"><b>${fa(p)}٪</b><span>تسلط کلی</span></div>
        <div class="stat"><b>${fa(acc)}٪</b><span>دقت پاسخ‌ها</span></div>
        <div class="stat"><b>${fa(mastered)}</b><span>عنصر مسلط</span></div>
        <div class="stat"><b>${fa(r.x)}</b><span>امتیاز${r.y ? ' · 🔥' + fa(r.y) : ''}</span></div>
      </div>
      <div class="card stack" style="gap:8px;margin-bottom:12px">
        <div class="section-title" style="margin:0">نقشهٔ یادگیری</div>
        <div class="mastery-legend"><span style="--c:var(--m0)">تمرین‌نشده</span><span style="--c:var(--m2)">در حال یادگیری</span><span style="--c:var(--m4)">مسلط</span><span style="--c:var(--m5)">کاملاً مسلط</span></div>
        <div class="pt-scroll">${table}</div>
        <p class="small muted">${fa(learning)} عنصر در حال یادگیری · ${fa(118 - mastered - learning)} عنصر هنوز تمرین نشده</p>
      </div>
      <div class="card stack" style="gap:8px;margin-bottom:12px"><div class="section-title" style="margin:0">روند پیشرفت</div>${spark(st.hist)}</div>
      ${weak.length ? `<div class="card stack" style="gap:8px;margin-bottom:12px"><div class="section-title" style="margin:0">نیاز به مرور</div><div class="chips wrap">${weak.map(e => `<span class="chip"><span class="dot c-${e.cat}"></span>${e.fa} <span class="sym">${e.sym}</span></span>`).join('')}</div></div>` : ''}
      <div class="card stack" style="gap:6px;margin-bottom:12px"><div class="section-title" style="margin:0">درس‌ها (${fa(r.l.length)} از ${fa(LESSONS.length)})</div>${lessons}</div>
      <div class="card stack" style="gap:8px;margin-bottom:12px"><div class="section-title" style="margin:0">ترکیب‌های ساخته‌شده (${fa(r.k.length)} از ${fa(APP.compounds.ALL.length)})</div>${comps ? `<div class="chips wrap">${comps}</div>` : '<p class="small muted">هنوز ترکیبی نساخته است.</p>'}</div>
      <div class="card stack" style="gap:6px;margin-bottom:12px"><div class="section-title" style="margin:0">آزمایشگاه واکنش‌ها</div>
        ${r.rx || r.rb ? `<p>🧪 ${fa(r.rx)} واکنش کشف‌شده از ${fa(APP.rx.RX.length)} · ⚖️ ${fa(r.rb)} معادلهٔ موازنه‌شده</p>` : '<p class="small muted">هنوز واکنشی را امتحان نکرده است (یا گزارش از نسخهٔ قدیمی‌تر برنامه است).</p>'}</div>
      ${quizzes ? `<div class="card stack" style="gap:6px;margin-bottom:12px"><div class="section-title" style="margin:0">آخرین آزمون‌ها</div>${quizzes}</div>` : ''}
      <div class="row"><button class="btn grow" data-act="panel-summary" data-k="${esc(k)}">📋 کپی خلاصه</button>
        <button class="btn grow" data-act="panel-del" data-k="${esc(k)}" style="color:var(--bad)">🗑 حذف</button></div>`;
  }
  function spark(h) {
    if (h.length < 2) return '<p class="small muted">برای دیدن روند، دانش‌آموز باید حداقل دو بار گزارش بفرستد.</p>';
    const W = 320, H = 110, pad = 18, n = h.length;
    const X = i => pad + i * (W - 2 * pad) / (n - 1), Y = v => H - pad - v / 100 * (H - 2 * pad);
    const pts = h.map((d, i) => `${X(i).toFixed(1)},${Y(d.p).toFixed(1)}`).join(' ');
    const dots = h.map((d, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(d.p).toFixed(1)}" r="3.5"/>`).join('');
    const last = h[n - 1];
    return `<svg class="spark-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="روند تسلط">
      <line x1="${pad}" y1="${Y(0)}" x2="${W - pad}" y2="${Y(0)}" class="sg"/><line x1="${pad}" y1="${Y(50)}" x2="${W - pad}" y2="${Y(50)}" class="sg"/><line x1="${pad}" y1="${Y(100)}" x2="${W - pad}" y2="${Y(100)}" class="sg"/>
      <polyline points="${pts}" class="sl"/>${dots}
      <text x="${X(n - 1)}" y="${Y(last.p) - 8}" class="st">${fa(last.p)}٪</text></svg>
      <div class="small muted" style="display:flex;justify-content:space-between"><span>${dateFa(h[0].t)}</span><span>${dateFa(last.t)}</span></div>`;
  }
  APP.acts['panel-open'] = t => { APP.fx.play('open'); APP.openSheet(detailHTML(t.dataset.k)); };
  APP.acts['panel-del'] = t => {
    const k = t.dataset.k, st = S().roster[k]; if (!st) return;
    if (!confirm('«' + st.name + '» از فهرست حذف شود؟')) return;
    delete S().roster[k]; APP.save(); APP.closeSheet(); panelMsg = ''; APP.render(); APP.toast('حذف شد');
  };
  APP.acts['panel-summary'] = t => {
    const st = S().roster[t.dataset.k]; if (!st) return;
    const r = st.last;
    const text = `گزارش ${st.name} (${dateFa(r.t)})\nتسلط کلی: ${fa(pctOf(r.m))}٪ · دقت پاسخ‌ها: ${fa(accOf(r))}٪ · امتیاز: ${fa(r.x)}\nدرس‌های انجام‌شده: ${fa(r.l.length)} از ${fa(LESSONS.length)} · ترکیب‌های ساخته‌شده: ${fa(r.k.length)} از ${fa(APP.compounds.ALL.length)}${r.rx ? ` · واکنش‌های کشف‌شده: ${fa(r.rx)} از ${fa(APP.rx.RX.length)}` : ''}`;
    APP.copyText(text).then(() => APP.toast('خلاصه کپی شد')).catch(() => APP.toast('کپی نشد'));
  };
  APP.acts['roster-backup'] = () => {
    const token = APP.secure.seal({ v: 1, r: S().roster }, 'SBR');
    const out = $('#backup-out'); if (!out) return;
    out.innerHTML = `<textarea id="report-text" class="selectable report-text" readonly rows="5" dir="ltr">${token}</textarea>
      <button class="btn accent block" data-act="report-copy" style="margin-top:8px">📋 کپی پشتیبان</button>`;
  };
  APP.acts['roster-clear'] = () => {
    if (!confirm('همهٔ دانش‌آموزان از فهرست پاک شوند؟ این کار برگشت‌پذیر نیست (مگر پشتیبان داشته باشید).')) return;
    S().roster = {}; APP.save(); panelMsg = ''; APP.render();
  };

  /* =====================================================================
     ابزار تدریس
     ===================================================================== */
  const T = { total: 300, left: 300, running: false, id: null, done: false };
  const PK = { picked: [], current: '' };

  function mmss(sec) { const m = Math.floor(sec / 60), s = sec % 60; return fa(String(m).padStart(2, '0')) + ':' + fa(String(s).padStart(2, '0')); }

  APP.views.tools = function () {
    const n = students().length;
    const tools = [
      ['#/board', '🖥️', 'تخته', 'جدول بزرگ برای کلاس؛ گروه، دوره یا دسته را پررنگ کنید.'],
      ['#/cast', '📺', 'نمایش روی تلویزیون', 'جدول، عنصر، ترکیب، واکنش و سؤال را روی پروژکتور نشان دهید و با گوشی کنترل کنید.'],
      ['#/lab', '⚗️', 'آزمایشگاه واکنش‌ها', `${fa(APP.rx.RX.length)} واکنش با بشر انیمیشنی؛ مناسب نمایش در کلاس.`],
      ['#/compounds', '🔬', 'ترکیبات و میکروسکوپ', `همهٔ ${fa(APP.compounds.ALL.length)} ترکیب با شکل مولکول؛ ساخت زنده با اتم‌ها.`],
      ['#/live', '❓', 'کوییز زنده', 'سؤال را روی تخته نشان دهید و پاسخ را وقتی خواستید باز کنید.'],
      ['#/worksheet', '🖨️', 'برگهٔ تمرین', 'برگهٔ چاپی با پاسخنامه برای تکلیف یا امتحان کوتاه.'],
      ['#/learn', '📖', 'درس‌ها', 'درس‌های آمادهٔ اتم، جدول، آرایش الکترونی و …']
    ];
    return `
      <div class="stack">
        <div class="card hero-card"><div class="section-title" style="margin:0;color:#fff">🧰 ابزار تدریس</div>
          <p class="small">هر چه برای آموزش دادن به دانش‌آموزان لازم دارید، یک‌جا.</p></div>
        <div class="tool-grid">${tools.map(([h, ic, t, d]) => `<button class="tool-card" data-go="${h}"><span class="tool-ic">${ic}</span><b>${t}</b><span class="small muted">${d}</span></button>`).join('')}</div>

        <div class="card stack" style="gap:10px">
          <div class="section-title" style="margin:0">⏱ زمان‌سنج کلاس</div>
          <div class="timer-disp ${T.done ? 'end' : ''}" id="tm-disp">${mmss(T.left)}</div>
          <div class="chips wrap" style="justify-content:center">
            ${[1, 2, 5, 10, 15].map(m => `<button class="chip" data-act="tm-set" data-v="${m}">${fa(m)} دقیقه</button>`).join('')}
          </div>
          <div class="row" style="justify-content:center">
            <button class="btn primary" data-act="tm-toggle" id="tm-btn">${T.running ? 'توقف' : 'شروع'}</button>
            <button class="btn" data-act="tm-reset">از نو</button>
          </div>
        </div>

        <div class="card stack" style="gap:10px">
          <div class="section-title" style="margin:0">🎲 انتخاب تصادفی دانش‌آموز</div>
          ${n ? `<div class="pick-name" id="pk-name">${PK.current ? esc(PK.current) : '؟'}</div>
          <button class="btn accent block" data-act="pk-go">انتخاب کن!</button>
          <div class="small muted">این دور تا حالا: ${PK.picked.length ? PK.picked.map(esc).join('، ') : '—'}</div>`

  function compWrong(c, field, n) {

    const seen = new Set([field(c)]), out = [];
    for (const x of same.concat(rest)) {

      if (seen.has(t)) continue;

  }

            <div class="ws-meta"><span>نام و نام خانوادگی: ........................................</span><span>تاریخ: ................</span><span>نمره: ........</span></div>
            ${who ? `<div class="small ws-teacher">دبیر: ${esc(who)}</div>` : ''}
          </header>
          <div class="ws-list">${q || '<p class="muted center">سؤالی نمانده است؛ «سؤال‌های تازه» را بزنید.</p>'}</div>
        </article>
        <article class="ws-paper ws-key">
          <header class="ws-head"><h2>پاسخنامه</h2><div class="ws-sub">${esc(WS.title || 'برگهٔ تمرین شیمی')}</div></header>
          <div class="ws-answers">${a}</div>
        </article>
      </div>`;
  }
  APP.acts['ws-start'] = () => {
    if (!checkCfg()) return;
    if (!APP.quizSel.size && !CFG.comp) { APP.toast('اول بخشی از جدول را انتخاب کنید'); return; }
    const t = $('#ws-title'), sb = $('#ws-sub');
    CFG.title = t ? t.value.trim().slice(0, 80) : ''; CFG.sub = sb ? sb.value.trim().slice(0, 80) : '';
    const items = makeItems(CFG.style === 'test');
    if (!items.length) { APP.toast('سؤالی ساخته نشد؛ انتخاب‌ها را بیشتر کنید'); return; }
    WS = { items, title: CFG.title, sub: CFG.sub, style: CFG.style };
    if (items.length < CFG.count) setTimeout(() => APP.toast(`فقط ${fa(items.length)} سؤال متفاوت ساخته شد؛ ناحیهٔ بزرگ‌تری انتخاب کنید`), 300);
    APP.render();
  };
  APP.acts['ws-back'] = () => { WS = null; APP.render(); };
  APP.acts['ws-again'] = () => {
    const items = makeItems(WS.style === 'test');
    if (items.length) WS.items = items;
    APP.render();
  };
  APP.acts['ws-swap'] = t => {
    if (!WS) return;
    const i = +t.dataset.i, skip = new Set(WS.items.map(x => x.key));
    const it = makeOne(skip, WS.style === 'test');
    if (!it) { APP.toast('سؤال متفاوت دیگری پیدا نشد'); return; }
    WS.items[i] = it;
    APP.fx.play('tap');
    // فقط همین سؤال (و پاسخ هم‌شمارهٔ آن) دوباره ساخته می‌شود؛ بقیهٔ برگه و جای اسکرول دست‌نخورده می‌ماند
    const q = $(`.ws-q[data-i="${i}"]`), a = $(`.ws-ans[data-i="${i}"]`);
    if (q) {
      q.outerHTML = qHTML(it, i);
      const nq = $(`.ws-q[data-i="${i}"]`); if (nq) { nq.classList.add('swapped'); setTimeout(() => nq.classList.remove('swapped'), 700); }
    }
    if (a) a.innerHTML = `<span class="ws-n">${fa(i + 1)}.</span><span>${keyText(it)}</span>`;
  };
  APP.acts['ws-del'] = t => {
    WS.items.splice(+t.dataset.i, 1); APP.fx.play('tap');
    const y = window.scrollY; APP.render(); window.scrollTo(0, y);
  };
  APP.acts['ws-print'] = t => {
    const root = document.documentElement;
    root.dataset.print = t.dataset.v;
    const done = () => { delete root.dataset.print; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { try { window.print(); } catch (e) { APP.toast('چاپ در این مرورگر در دسترس نیست'); done(); } }, 50);
    setTimeout(done, 60000);
  };
  APP.acts['ws-pdf'] = async t => {
    if (wsBusy || !WS || !WS.items.length) return;
    const kind = t.dataset.v;
    wsBusy = true;
    const msg = $('#ws-msg'), btns = $$('[data-act="ws-pdf"]');
    btns.forEach(b => { b.disabled = true; });
    if (msg) { msg.textContent = '⏳ در حال ساخت PDF …'; msg.classList.add('show'); }
    try {
      const spec = { kind, title: WS.title || 'برگهٔ تمرین شیمی', sub: WS.sub, teacher: APP.displayName(), style: WS.style, items: WS.items };
      const { blob, pages } = await APP.pdf.make(spec);
      APP.pdf.save(blob, kind === 'key' ? 'shimi-bazi-pasokhname.pdf' : 'shimi-bazi-soalha.pdf');
      APP.fx.play('good');
      if (msg) msg.textContent = `✅ PDF ${kind === 'key' ? 'پاسخنامه' : 'سؤال‌ها'} ساخته شد (${fa(pages)} صفحه).`;
    } catch (e) {
      if (msg) msg.textContent = '⚠️ ساخت PDF ناموفق بود؛ از «چاپ» و گزینهٔ ذخیره به‌صورت PDF استفاده کنید.';
    }
    wsBusy = false; btns.forEach(b => { b.disabled = false; });
  };

  APP.teachCfg = { configHTML, makeItems, checkCfg, CFG };
  APP.teacherReset = () => { LV = null; WS = null; };
})();

/* ===== gate.js ===== */
/* ورود با نام، نقش استاد (با کد)، تغییر نام و نقش در تنظیمات */
(function () {
  'use strict';
  const { u } = APP;
  const { $, esc } = u;
  const S = () => APP.S();

  let G = null; // { mode, step, first, last, fails, lockUntil }

  const splitName = full => {
    const parts = String(full || '').trim().split(/\s+/);
    return { first: parts[0] || '', last: parts.slice(1).join(' ') };
  };
  const clean = v => String(v).replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 40);

  function logo() {
    return '<div class="gate-logo"><svg viewBox="0 0 40 40"><ellipse class="o1" cx="20" cy="20" rx="16" ry="6.5"/><ellipse class="o2" cx="20" cy="20" rx="16" ry="6.5"/><ellipse class="o3" cx="20" cy="20" rx="16" ry="6.5"/><circle cx="20" cy="20" r="3.4"/></svg></div>';
  }

  function html() {
    const g = G;
    let body = '';
    if (g.step === 'name') {
      body = `
        ${logo()}
        <h1>شیمی بازی</h1>
        <p>${g.mode === 'rename' ? 'نام جدید را بنویسید' : 'برای شروع، نام و نام خانوادگی خود را بنویسید'}</p>
        <input id="g-first" type="text" placeholder="نام" value="${esc(g.first)}" autocomplete="given-name" maxlength="40">
        <input id="g-last" type="text" placeholder="نام خانوادگی" value="${esc(g.last)}" autocomplete="family-name" maxlength="40">
        <div class="gate-err" id="g-err" role="alert"></div>
        <button class="btn primary block gate-btn" data-act="gate-name">${g.mode === 'rename' ? 'ذخیره' : 'ادامه'}</button>
        ${g.mode === 'initial' ? '<button class="gate-link" data-act="gate-teacher">🎓 من استاد هستم</button><button class="gate-link sm" data-act="gate-display">📺 این دستگاه تلویزیون/پروژکتور کلاس است</button>' : '<button class="gate-link" data-act="gate-cancel">انصراف</button>'}`;
    } else if (g.step === 'code') {
      body = `
        ${logo()}
        <h1>ورود استاد</h1>
        <p>کد ویژهٔ استاد را وارد کنید</p>
        <input id="g-code" type="password" placeholder="کد استاد" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false" style="text-align:center">
        <div class="gate-err" id="g-err" role="alert"></div>
        <button class="btn primary block gate-btn" data-act="gate-code">تأیید</button>
        <button class="gate-link" data-act="gate-back">${g.mode === 'initial' ? '→ برگشت' : 'انصراف'}</button>`;
    } else {
      body = `
        ${logo()}
        <h1>${g.mode === 'rename' ? 'ویرایش نام' : 'خوش آمدید استاد'}</h1>
        <p>نام خانوادگی خود را بنویسید تا شما را با احترام خطاب کنیم</p>
        <div class="seg gate-seg" role="group" aria-label="عنوان">
          <button data-act="gate-sex" data-v="m" aria-pressed="${g.sex === 'm'}">آقا</button>
          <button data-act="gate-sex" data-v="f" aria-pressed="${g.sex === 'f'}">خانم</button>
        </div>
        <input id="g-last" type="text" placeholder="نام خانوادگی" value="${esc(g.last)}" autocomplete="family-name" maxlength="30">
        <div class="gate-preview" id="g-prev"></div>
        <div class="gate-err" id="g-err" role="alert"></div>
        <button class="btn primary block gate-btn" data-act="gate-tname">${g.mode === 'rename' ? 'ذخیره' : 'ورود به بخش استاد'}</button>
        <button class="gate-link" data-act="gate-back">${g.mode === 'initial' ? '→ برگشت' : 'انصراف'}</button>`;
    }
    return `<div class="gate-card">${body}<div class="gate-credit">ساخته شده توسط امیر محمد پدرام</div></div>`;
  }
  function paint() {
    const ov = $('#gate'); if (!ov) return;
    ov.innerHTML = html();
    const f = $('#g-code') || $('#g-first') || $('#g-last'); if (f) f.focus({ preventScroll: true });
    preview();
  }
  function preview() {
    const p = $('#g-prev'), l = $('#g-last'); if (!p || !l) return;
    const v = clean(l.value);
    p.textContent = v ? 'نمایش در برنامه: ' + (G.sex === 'f' ? 'خانم ' : 'آقای ') + v : '';
  }
  function err(msg) {
    const e = $('#g-err'); if (e) { e.textContent = msg; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
    APP.fx.play('bad');
  }

  // mode: 'initial' | 'rename' | 'to-teacher'
  APP.showGate = function (opts) {
    if ($('#gate')) return;
    const mode = (opts && opts.mode) || 'initial';
    const s = S();
    const tRename = mode === 'rename' && s.role === 'teacher';
    const cur = splitName(mode === 'to-teacher' ? s.name : mode === 'rename' ? s.name : '');
    G = { mode, step: mode === 'to-teacher' ? 'code' : tRename ? 'tname' : 'name', first: cur.first, last: cur.last, sex: s.tsex || 'm', fails: 0, lockUntil: 0 };
    if (tRename || mode === 'to-teacher') G.last = s.tname || cur.last;
    APP.closeSheet();
    const ov = document.createElement('div');
    ov.id = 'gate'; ov.className = 'gate';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    paint();
  };
  function close() {
    const ov = $('#gate'); if (ov) ov.remove();
    document.body.style.overflow = '';
    G = null;
  }
  function readNames() {
    const first = clean($('#g-first').value), last = clean($('#g-last').value);
    G.first = first; G.last = last;
    if (!first) { err('نام را بنویسید.'); $('#g-first').focus(); return null; }
    if (!last) { err('نام خانوادگی را هم بنویسید.'); $('#g-last').focus(); return null; }
    return first + ' ' + last;
  }
  function afterEntry() {
    APP.renderChrome(); APP.render();
    if (!S().onboarded) setTimeout(() => APP.showOnboarding(), 300);
  }

  APP.acts['gate-name'] = () => {
    const full = readNames(); if (!full) return;
    const s = S(), mode = G.mode;
    s.name = full;
    APP.save(); APP.fx.play('good'); close();
    APP.renderChrome();
    if (mode === 'initial') { afterEntry(); APP.toast('سلام ' + full.split(' ')[0] + '! خوش آمدید'); }
    else { APP.render(); APP.toast('نام ذخیره شد'); }
  };
  APP.acts['gate-teacher'] = () => { G.step = 'code'; paint(); };
  APP.acts['gate-display'] = () => { close(); location.hash = '#/display'; };
  APP.acts['gate-back'] = () => {
    if (G.mode === 'initial') { G.step = 'name'; paint(); } else close();
  };
  APP.acts['gate-cancel'] = () => close();
  APP.acts['gate-code'] = () => {
    const now = Date.now();
    if (now < G.lockUntil) { err('چند ثانیه صبر کنید و دوباره امتحان کنید.'); return; }
    const v = $('#g-code').value;
    if (APP.secure.checkCode(v)) {
      APP.fx.play('good'); G.step = 'tname'; G.fails = 0;
      paint();
    } else {
      G.fails++;
      if (G.fails >= 3) { G.lockUntil = now + 5000; G.fails = 0; err('کد درست نیست. ۵ ثانیه بعد دوباره امتحان کنید.'); }
      else err('کد درست نیست.');
      $('#g-code').value = ''; $('#g-code').focus();
    }
  };
  APP.acts['gate-sex'] = t => {
    G.sex = t.dataset.v;
    document.querySelectorAll('#gate [data-act="gate-sex"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === G.sex)));
    preview();
  };
  APP.acts['gate-tname'] = () => {
    const last = clean($('#g-last').value);
    G.last = last;
    if (!last) { err('نام خانوادگی را بنویسید.'); $('#g-last').focus(); return; }
    const s = S(), renaming = G.mode === 'rename';
    s.tname = last; s.tsex = G.sex; s.role = 'teacher';
    if (!s.name) s.name = last;
    APP.save(); close();
    APP.renderChrome();
    if (renaming) { APP.render(); APP.toast('نام ذخیره شد'); return; }
    APP.fx.play('win'); APP.fx.confetti();
    location.hash = '#/panel';
    afterEntry();
    APP.toast('به بخش استاد وارد شدید');
  };

  // دکمه‌های تنظیمات
  APP.acts.rename = () => APP.showGate({ mode: 'rename' });
  APP.acts['to-teacher'] = () => APP.showGate({ mode: 'to-teacher' });
  APP.acts['to-student'] = () => {
    if (!confirm('به حالت دانش‌آموز برگردید؟ فهرست دانش‌آموزان شما نگه داشته می‌شود.')) return;
    const s = S(); s.role = 'student'; APP.save(); APP.closeSheet();
    if (!/^#\/(home|learn)/.test(location.hash)) location.hash = '#/home';
    APP.renderChrome(); APP.render(); APP.toast('حالت دانش‌آموز فعال شد');
  };

  document.addEventListener('input', ev => { if (G && ev.target && ev.target.id === 'g-last') preview(); });

  // ورود با Enter
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' || !G) return;
    const b = $('#gate .gate-btn'); if (b) b.click();
  });
})();

    const dots = slides().map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('');
    return `
      <div class="onb-top"><span class="small">${fa(idx + 1)} از ${fa(slides().length)}</span>${s.last ? '<span></span>' : '<button class="onb-skip" data-act="onb-skip">رد کردن</button>'}</div>
      <div class="onb-slide ${dir > 0 ? 'from-left' : 'from-right'}" key="${idx}">
        <div class="onb-art">${s.art()}</div>
        <h2>${s.t}</h2>
        <p>${s.p}</p>
        ${s.credit ? `<div class="onb-credit">${s.credit}</div>` : ''}
      </div>
      <div class="onb-dots" aria-hidden="true">${dots}</div>
      <div class="onb-actions">
        ${idx > 0 ? '<button class="btn onb-btn ghost" data-act="onb-prev">قبلی</button>' : '<span></span>'}
        ${s.last ? '<button class="btn onb-btn solid" data-act="onb-done">شروع یادگیری 🚀</button>' : '<button class="btn onb-btn solid" data-act="onb-next">بعدی</button>'}
      </div>`;
  }
  function paint() {
    const ov = $('#onb'); if (!ov) return;
    const s = slides()[idx];
    ov.style.setProperty('--g1', s.c.split(',')[0]);
    ov.style.setProperty('--g2', s.c.split(',')[1]);
    ov.innerHTML = html();
  }
  function go(n) {
    if (n < 0 || n >= slides().length) return;
    dir = n > idx ? 1 : -1; idx = n; paint();
  }
  APP.showOnboarding = function () {
    idx = 0; dir = 1;
    const ov = document.createElement('div');
    ov.id = 'onb'; ov.className = 'onb';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'راهنمای برنامه');
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
    paint();
    let x0 = null;
    ov.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    ov.addEventListener('touchend', e => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) < 50) return;
      // در صفحهٔ راست‌به‌چپ، کشیدن به چپ یعنی اسلاید بعدی
      if (dx < 0) { APP.fx.play('next'); go(idx + 1); } else if (idx > 0) { APP.fx.play('next'); go(idx - 1); }
    }, { passive: true });
    document.addEventListener('keydown', onKey);
  };
  function onKey(e) {
    if (!$('#onb')) { document.removeEventListener('keydown', onKey); return; }
    if (e.key === 'ArrowLeft') { APP.fx.play('next'); go(idx + 1); }
    else if (e.key === 'ArrowRight') { APP.fx.play('next'); go(idx - 1); }
    else if (e.key === 'Escape') APP.acts['onb-skip']();
  }
  function close() {
    const ov = $('#onb'); if (ov) ov.remove();
    document.body.style.overflow = '';
    S().onboarded = true; APP.save();
  }
  APP.acts['onb-next'] = () => { APP.fx.play('next'); go(idx + 1); };
  APP.acts['onb-prev'] = () => { APP.fx.play('next'); go(idx - 1); };
  APP.acts['onb-skip'] = () => { close(); };
  APP.acts['onb-done'] = () => { APP.fx.play('win'); APP.fx.confetti({ n: 60 }); close(); };
  APP.acts['show-guide'] = () => { APP.closeSheet(); APP.showOnboarding(); };
})();

/* ===== main.js ===== */
window.addEventListener('DOMContentLoaded', function () { APP.start(); });

</script>
</body>
